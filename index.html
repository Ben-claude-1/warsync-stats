      <text x="${cx}" y="${cy+9}" font-size="8" fill="${zColors.Z5}" font-family="sans-serif" text-anchor="middle">Söldner</text>
      <text x="${cx}" y="${cy+22}" font-size="7" fill="${zColors.Z5}cc" font-family="sans-serif" text-anchor="middle">ab Min ~10</text>

      <!-- Steal zone label -->
      <text x="${cx}" y="${h-6}" font-size="9" fill="#c0392b" font-family="sans-serif" text-anchor="middle" font-weight="700">
        Stehlen: ${stealZone} bleibt leer → Gegner stiehlt → Assassinen stehlen zurück
      </text>
    </svg>`;
  }

  // Priority table — verifiziert aus Spiel-Screenshots
  const stealNote=stealZone?stealZone.toUpperCase()+' leer lassen':'Steal-Zone je nach Seite leer';
  const rows=[
    {prio:'1',zone:'Z5',gebaeude:'Nukl. Raketensilo',pts:'80/s',eff:'Höchste Punktequelle · Ressourcen stehlen',note:'Ab Min ~10:32 · sofort stürmen!'},
    {prio:'2',zone:'Z1',gebaeude:'Infozentrum',pts:'10/s',eff:'⭐ +10% Effizienz ALLER eigenen Gebäude → Bei 60/s Zonen = +6/s je Zone extra',note:'Nie aufgeben! Multiplikator-Effekt'},
    {prio:'3',zone:'Z1 / Z3',gebaeude:'Ölraffinerie',pts:'50/s',eff:'Hauptpunktequelle von Kampfbeginn · Zone-Total mit Infozentrum/Tech: 60/s',note:'Immer halten'},
    {prio:'4',zone:'Z5',gebaeude:'Arsenal',pts:'10/s',eff:'⚔ Helden +15% Angriff / Verteidigung / HP',note:'Ab Min ~10'},
    {prio:'5',zone:'Z5',gebaeude:'Söldnerfabrik',pts:'10/s',eff:'💀 Feindl. Helden −15% Angriff / Verteidigung / HP',note:'Ab Min ~10 · Z5 gesamt: 100/s'},
    {prio:'6',zone:'Z2 / Z4',gebaeude:'2× Feldlazarett',pts:'2×30=60/s',eff:'🏥 Heilung: 15 Einh. alle 10s pro Lazarett (bei 4 Lazaretten: 60 Einh./10s · 20 Spieler: ~216.000/30Min)',note:stealNote},
    {prio:'7',zone:'Z3',gebaeude:'Tech-Zentrum',pts:'10/s',eff:'⚡ Teleport-Cooldown −50% (2 Min → 1 Min) · ideal für Sammler & Support',note:'Zone-Total mit Ölraffinerie: 60/s'},
    {prio:'–',zone:'Überall',gebaeude:'Punkte-Versorgungskiste',pts:'–',eff:'💡 Bei Gebäudewechsel verstreuen sich Punkte um das Gebäude → Spähtruppen einsammeln!',note:'Sammler & Support Kernmechanik'},
  ];

  const tableHtml=`<div class="scroll-x" style="margin-top:12px">
    <table style="font-size:11px">
      <thead><tr>
        <th style="width:24px">#</th>
        <th>Zone</th>
        <th>Gebäude</th>
        <th style="white-space:nowrap">Pkt/s (Allianz)</th>
        <th>Effekt / Hinweis</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td style="font-weight:800;color:var(--acc)">${r.prio}</td>
          <td style="font-weight:700;white-space:nowrap">${r.zone}</td>
          <td style="white-space:nowrap">${r.gebaeude}</td>
          <td style="white-space:nowrap;font-weight:700;color:var(--win)">${r.pts}</td>
          <td style="font-size:10px;color:var(--tx2)">${r.eff}<br><span style="color:var(--tx3);font-style:italic">${r.note}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  return`<div class="card" style="margin-bottom:12px">
    <div class="ch" style="cursor:pointer" onclick="APP.infoCardOpen=!APP.infoCardOpen;renderPage()">
      <span>🏛 Gebäude-Übersicht</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;font-weight:400;color:var(--tx3)">Team-Seite:</span>
        <button onclick="event.stopPropagation();setTeamSide('left')" style="font-size:11px;padding:3px 9px;border-radius:6px;border:1.5px solid ${side==='left'?'var(--primary)':'var(--bd)'};background:${side==='left'?'var(--pri-l)':'#fff'};color:${side==='left'?'var(--primary)':'var(--tx3)'};font-weight:700;cursor:pointer">Links</button>
        <button onclick="event.stopPropagation();setTeamSide('right')" style="font-size:11px;padding:3px 9px;border-radius:6px;border:1.5px solid ${side==='right'?'var(--primary)':'var(--bd)'};background:${side==='right'?'var(--pri-l)':'#fff'};color:${side==='right'?'var(--primary)':'var(--tx3)'};font-weight:700;cursor:pointer">Rechts</button>
        <button onclick="event.stopPropagation();setTeamSide('none')" style="font-size:11px;padding:3px 9px;border-radius:6px;border:1.5px solid ${side==='none'?'var(--tx2)':'var(--bd)'};background:${side==='none'?'#f0f4f8':'#fff'};color:${side==='none'?'var(--tx)':'var(--tx3)'};font-weight:700;cursor:pointer">Egal</button>
        <span style="font-size:16px">${open?'▲':'▼'}</span>
      </div>
    </div>
    ${open?`<div class="cb">
      <div style="font-size:11px;color:var(--tx3);margin-bottom:10px">
        ${side==='none'
          ?`<strong style="color:var(--tx2)">ℹ Alle Zonen belegt</strong> — Seite noch nicht festgelegt. Wähle Links oder Rechts um die Steal-Strategie zu aktivieren.`
          :`<strong style="color:var(--loss)">⚠ ${stealZone} bleibt leer</strong> — ${stealLabel} — Gegner besetzt sie → Steal-Gruppe schlägt zurück → sofort Z5 stürmen`}
      </div>
      ${svgMap()}
      ${tableHtml}
    </div>`:''}
  </div>`;
}

function setTeamSide(s){APP.teamSide=s;saveWSState();renderPage();}

// --- AUFSTELLUNG (Drag & Drop + Gewichtung) ---
function wsAufstellung(){
  const t=APP.team;
  const lineup=getLineup(t);
  const lineupReady=getLineupReady(t);
  const stealZone=APP.teamSide==='left'?'z4':APP.teamSide==='right'?'z2':null;
  const ZONE_DEF={
    ass:{label:'⚔ Assassinen / Silo',sub:'Stärkste Spieler — bis 10:00 Gegner nullen, dann Silo',pts:'80/s ab Min 10:00',type:'ass',color:'var(--ass)'},
    ars:{label:'⚔ Arsenal',sub:'Buff-Helden — bis 10:00 in Zone 2, dann Arsenal',pts:'+15% ATK/DEF/HP',type:'ass',color:'#e67e22'},
    sold:{label:'🏭 Söldnerfabrik',sub:'Debuff-Helden — bis 10:00 in Zone 4, dann Söldner',pts:'−15% Feinde',type:'ass',color:'#e74c3c'},
    sup:{label:'🛡 Sammler & Endgame-Support',sub:'Schwächste Spieler — Punkte sammeln · am Ende freie Gebäude sichern',pts:'Gebäude einnehmen wenn Gegner keine Truppen mehr hat',type:'sup',color:'var(--tx2)'},
    z1:{label:'Zone 1',sub:'Ölraffinerie 50/s + Infozentrum 10/s',pts:'= 60/s · nie aufgeben!',type:'oil',color:'var(--oil)'},
    z2:{label:'Zone 2',sub:'2× Feldlazarett (je 30/s)',pts:APP.teamSide==='right'?'⚠ LEER — Steal-Zone':'= 60/s · Heilung 30 Einh./10s',type:'med',color:APP.teamSide==='right'?'#aaa':'var(--med)'},
    z3:{label:'Zone 3',sub:'Ölraffinerie 50/s + Tech-Zentrum 10/s',pts:'= 60/s · Teleport −50%',type:'oil',color:'var(--oil)'},
    z4:{label:'Zone 4',sub:'2× Feldlazarett (je 30/s)',pts:APP.teamSide==='left'?'⚠ LEER — Steal-Zone':'= 60/s · Heilung 30 Einh./10s',type:'med',color:APP.teamSide==='left'?'#aaa':'var(--med)'},
  };
  const sel=APP.selectedChip;
  const otherT=t==='A'?'B':'A';
  const otherLineup=getLineup(otherT);
  const otherReady=getLineupReady(otherT);
  const otherHas=Object.values(otherLineup).flat().length>0;

  function renderChip(name,zone,opts){
    opts=opts||{};
    const isSel=sel===name;
    const t1=getT1(name);
    const ba=APP.bldAssign||{};
    // Gebäude-Badge nur in Zone 1-4 (mit Cycle-Button)
    let bldBadge='';
    if(['z1','z2','z3','z4'].includes(zone)){
      const bldKey=ba[name];
      const meta=bldKey?BLD_META[bldKey]:null;
      const short=bldKey?(_bldShort[bldKey]||bldKey):'—';
      const color=meta?meta.color:'#bbb';
      bldBadge=`<button onclick="event.stopPropagation();cycleBldAssign('${name.replace(/'/g,"\\'")}','${zone}')" title="Gebäude wechseln" style="font-size:9px;padding:1px 5px;border-radius:4px;border:1px solid ${color}66;background:${color}18;color:${color};font-weight:700;cursor:pointer;margin-left:4px;white-space:nowrap">${short}</button>`;
    }
    const guestStyle=opts.isGuest?';opacity:.72;border-style:dashed':'';
    const ph2Badge=opts.guestLabel?`<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#7c3aed22;color:#7c3aed;font-weight:700;margin-left:2px;white-space:nowrap">→${opts.guestLabel}</span>`:'';
    const shiftBadge=opts.shiftLabel?`<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#27ae6022;color:#27ae60;font-weight:700;margin-left:2px;white-space:nowrap">↑${opts.shiftLabel}</span>`:'';
    return`<div class="player-chip${isSel?' selected':''}" id="chip-${name.replace(/\s/g,'_')}-${zone}"
      style="display:inline-flex;align-items:center;gap:4px${guestStyle}"
      onclick="selectChip('${name.replace(/'/g,"\\'")}','${zone}')"
      draggable="true"
      ondragstart="dragStart(event,'${name.replace(/'/g,"\\'")}','${zone}')"
      ondragend="dragEnd(event)">
      <span style="cursor:pointer" onclick="event.stopPropagation();openPlayer('${name.replace(/'/g,"\\'")}');event.preventDefault()">${name}</span><span class="chip-t1">${t1?'T1 '+t1:'–'}</span>${bldBadge}${ph2Badge}${shiftBadge}
    </div>`;
  }

  function renderZone(zoneKey){
    const def=ZONE_DEF[zoneKey];
    const players=lineup[zoneKey]||[];
    const teamSlots=getZoneSlots(t);
    const slots=teamSlots[zoneKey]||0;
    // Z5-Gäste: ass/ars/sold Spieler die laut bldAssign in dieser Zone stehen (Phase 1)
    const _bz2={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',
                oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
    const _ba=APP.bldAssign||{};
    const z5All=[...(lineup.ass||[]),...(lineup.ars||[]),...(lineup.sold||[])];
    const guestPlayers=z5All.filter(n=>_bz2[_ba[n]]===zoneKey);
    function guestRole(n){
      if((lineup.ass||[]).includes(n))return'Silo';
      if((lineup.ars||[]).includes(n))return'Arsenal';
      return'Söldner';
    }
    const isEmpty=!players.length&&!guestPlayers.length;
    const isSteal=stealZone===zoneKey;
    const isTarget=sel&&!players.includes(sel)&&!guestPlayers.includes(sel)&&!isSteal;
    const extraStyle=isSteal?'opacity:.55;border-style:dashed;':'';
    const isZone14=['z1','z2','z3','z4'].includes(zoneKey);

    // Body: für z1-z4 mit Sub-Sektionen pro Gebäude, sonst flach
    let body='';
    if(isSteal){
      body=`<div class="zc-empty" style="color:var(--loss);font-weight:700">Absichtlich leer — Steal-Strategie</div>`;
    } else if(isZone14){
      const zoneBlds=_zoneBlds[zoneKey]||[];
      const ba=APP.bldAssign||{};
      const bs=getBldSlots(t);
      // Spieler je Gebäude gruppieren (main + Phase-1-Gäste)
      const grouped={};
      zoneBlds.forEach(b=>grouped[b]={main:[],guests:[]});
      players.forEach(n=>{
        const b=ba[n];
        if(b&&grouped[b])grouped[b].main.push(n);
        else grouped[zoneBlds[0]].main.push(n); // Fallback aufs erste Gebäude
      });
      guestPlayers.forEach(n=>{
        const b=ba[n];
        if(b&&grouped[b])grouped[b].guests.push(n);
        else grouped[zoneBlds[0]].guests.push(n);
      });
      body=zoneBlds.map(b=>{
        const meta=BLD_META[b];
        const cap=bs[b]||0;
        const inBld=grouped[b];
        const total=inBld.main.length+inBld.guests.length;
        const isBldTarget=sel?true:false;
        return`<div class="bld-sub" data-zone="${zoneKey}" data-bld="${b}"
          ondragover="event.preventDefault();event.stopPropagation();this.style.background='${meta.color}28'"
          ondragleave="this.style.background='${meta.color}0d'"
          ondrop="handleDropBld(event,'${zoneKey}','${b}')"
          onclick="event.stopPropagation();dropToBld('${zoneKey}','${b}')"
          style="margin-top:6px;padding:6px 8px;border:1.5px ${isBldTarget?'solid':'dashed'} ${meta.color}66;border-radius:6px;background:${meta.color}0d;cursor:${isBldTarget?'pointer':'default'}">
          <div style="font-size:11px;font-weight:700;color:${meta.color};margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline">
            <span>${meta.dot} ${meta.label}</span>
            <span style="color:var(--tx3);font-weight:500;font-size:10px">${total}/${cap}</span>
          </div>
          ${total===0
            ?'<div style="font-size:10px;color:var(--tx3);font-style:italic;text-align:center;padding:4px 0">leer</div>'
            :inBld.main.map(n=>{
              const ba2=APP.bldAssignPh2||{};
              const p2=ba2[n];const isShifter=p2&&p2!==ba[n];
              return renderChip(n,zoneKey,isShifter?{shiftLabel:_bldShort[p2]||p2}:{});
            }).join('')+inBld.guests.map(n=>renderChip(n,zoneKey,{isGuest:true,guestLabel:guestRole(n)})).join('')
          }
        </div>`;
      }).join('');
    } else {
      // Flache Liste für ass / ars / sold / sup
      body=isEmpty
        ?`<div class="zc-empty">Leer – Spieler antippen zum Zuweisen</div>`
        :players.map(n=>renderChip(n,zoneKey)).join('');
    }

    return`<div class="zc ${def.type}${isTarget?' drop-target':''}" id="zone-${zoneKey}"
      style="${extraStyle}"
      onclick="${isSteal?'':'dropToZone(\''+zoneKey+'\')'}"
      ondragover="event.preventDefault()"
      ondragenter="${isSteal?'':'dragEnterZone(event,\''+zoneKey+'\')'}"
      ondragleave="${isSteal?'':'dragLeaveZone(event,\''+zoneKey+'\')'}"
      ondrop="${isSteal?'':'handleDrop(event,\''+zoneKey+'\')'}">
      <div class="zc-hd">
        <div><div class="zc-name" style="color:${def.color}">${def.label}</div><div class="zc-pts">${def.sub} · ${def.pts}</div></div>
        ${isSteal?`<div class="zc-count" style="background:#c0392b22;color:var(--loss)">LEER</div>`:`<div class="zc-count" style="background:${def.color}22;color:${def.color}">${players.length}/${slots}</div>`}
      </div>
      ${body}
      ${(isZone14&&!isSteal)?[(guestPlayers.length?'⏱ Gestrichelte → Zone 5 ab Min 10:00':''),(Object.values(APP.bldAssignPh2||{}).length?'↑ Grüne → rücken ab Min 10 in wichtigere Gebäude nach':'')].filter(Boolean).map(t=>`<div style="margin-top:4px;font-size:9px;color:var(--tx3);font-style:italic;text-align:center">${t}</div>`).join(''):''}

    </div>`;
  }

  const totalW=Object.values(APP.zoneWeights).reduce((a,b)=>a+b,0)||1;
  const wColors={z1:'var(--oil)',z2:'var(--med)',z3:'var(--oil)',z4:'var(--med)'};
  const teamColor=t==='A'?'var(--win)':'#2980b9';
  // Tatsächlicher Pool, mit dem autoAssign arbeitet (dedupe + ohne Inactive)
  const _teamPool=Object.entries(APP.teamAssign).filter(([n,v])=>v===t&&!isInactive(n)).map(([k])=>k);
  const _seen=new Set();
  const _accFiltered=APP.accepted.filter(n=>{if(!n||_seen.has(n)||isInactive(n))return false;_seen.add(n);return true;});
  const angemCount=_teamPool.length||_accFiltered.length;
  return`
    <!-- TEAM TABS -->
    <div class="ttabs">
      <button class="ttab${APP.team==='A'?' on-a':''}" onclick="setTeam('A')">⚔ Team A · 13:00</button>
      <button class="ttab${APP.team==='B'?' on-b':''}" onclick="setTeam('B')">⚔ Team B · 22:00</button>
    </div>

    <!-- TEAM STATUS BAR -->
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:${t==='A'?'var(--win-l)':'#eaf3fb'};border:1.5px solid ${teamColor};border-radius:10px;padding:10px 12px">
        <div style="font-size:11px;font-weight:700;color:${teamColor};text-transform:uppercase;letter-spacing:.04em">Team ${t} · ${t==='A'?'13:00':'22:00'} Uhr</div>
        <div style="font-size:12px;color:var(--tx2);margin-top:3px">${angemCount} angemeldet · ${Object.values(lineup).flat().length} eingeplant</div>
      </div>
      ${otherHas?`<div style="flex:1;background:#f8f9fc;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;opacity:.7">
        <div style="font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em">Team ${otherT} · ${otherT==='A'?'13:00':'22:00'}</div>
        <div style="font-size:12px;color:var(--tx3);margin-top:3px">${Object.values(otherLineup).flat().length} eingeplant ✓</div>
      </div>`:''}
    </div>

    <!-- GEBÄUDE-INFO-KARTE -->
    ${buildingInfoCard(APP.teamSide,APP.infoCardOpen)}

    <!-- STRATEGIE-KARTE -->
    ${renderStrategyCard()}

    ${sel?`<div class="move-hint">„${sel}" ausgewählt — Zone antippen zum Verschieben</div>`:''}

    <!-- ROLLEN — Zone-5-Spieler & Springer ZUERST -->
    <div class="card" style="margin-bottom:12px;border:2px solid var(--ass)">
      <div class="ch">🎭 Rollen <span class="ch-sub">Phase-2-Spieler + Springer</span></div>
      <div style="padding:0 6px 6px">
        <div class="zone-grid" style="margin-top:6px">
          ${getZoneSlots(t).ass>0?renderZone('ass'):''}
          ${getZoneSlots(t).sup>0?renderZone('sup'):''}
          ${getZoneSlots(t).ars>0?renderZone('ars'):''}
          ${getZoneSlots(t).sold>0?renderZone('sold'):''}
        </div>
      </div>
    </div>

    <!-- PHASE-2-ÜBERGANG HINWEIS -->
    <div class="note info" style="margin-bottom:12px;font-size:12px;line-height:1.45">
      <strong>📌 Phase 2 (ab Min 10:00):</strong> Nur die gestrichelt markierten Spieler wechseln per TP zu Zone 5. Alle anderen bleiben in ihren Zonen — kein weiterer Umzug nötig.
    </div>

    <!-- ZONE MAP — Phase 1 Zonen 1-4 -->
    <div class="zone-grid">
      ${renderZone('z1')}
      ${renderZone('z2')}
      ${renderZone('z3')}
      ${renderZone('z4')}
    </div>
    <div style="background:var(--acc-l);border-radius:12px;padding:12px;border:2px solid var(--acc);margin-bottom:10px;text-align:center">
      <div style="font-size:12px;font-weight:800;color:var(--acc)">Zone 5 · Silo 80/s + Arsenal 10/s + Söldnerfabrik 10/s = <span style="color:var(--win)">100/s</span></div>
      <div style="font-size:11px;color:var(--tx3);margin-top:3px">Öffnet nach ~10:00 Min · Arsenal: Helden +15% · Söldnerfabrik: Feinde −15% · Assassinen stürmen rein!</div>
    </div>

    <!-- STEAL-STRATEGIE (nur wenn Seite gewählt) -->
    ${stealZone?`<div class="card" style="margin-bottom:10px;border-color:#c0392b44">
      <div class="ch" style="background:#fff5f5">
        <span>🎯 Steal-Strategie · ${stealZone==='z4'?'Zone 4':'Zone 2'}</span>
        <span style="font-size:11px;font-weight:400;color:var(--tx3)">Zone leer lassen</span>
      </div>
      <div style="padding:12px;display:flex;flex-direction:column;gap:8px">

        <div style="display:flex;gap:10px;align-items:flex-start">
          <div style="width:28px;height:28px;border-radius:50%;background:#2980b922;color:#2980b9;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">1</div>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--tx)">Dauerbeobachtung durch 2er-Team</div>
            <div style="font-size:11px;color:var(--tx3);margin-top:2px">Sammler & Endgame-Support beobachten ${stealZone==='z4'?'Z4':'Z2'} laufend. Solange der Gegner die Zone <strong>nicht besetzt</strong> → sofort selber reingehen und Punkte sammeln.</div>
          </div>
        </div>

        <div style="display:flex;gap:10px;align-items:flex-start">
          <div style="width:28px;height:28px;border-radius:50%;background:#e8a02022;color:var(--acc);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">2</div>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--tx)">Zone besetzt? → Warten auf Steal-Signal</div>
            <div style="font-size:11px;color:var(--tx3);margin-top:2px">Wenn der Gegner ${stealZone==='z4'?'Z4':'Z2'} besetzt hat, nicht sofort rein. Warten bis kurz vor Spielende — dann gemeinsam als 3er-Gruppe porten und Punkte stehlen.</div>
          </div>
        </div>

        <div style="display:flex;gap:10px;align-items:flex-start">
          <div style="width:28px;height:28px;border-radius:50%;background:#c0392b22;color:var(--loss);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">3</div>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--tx)">Steal-Aktion — 3 Spieler gleichzeitig porten</div>
            <div style="font-size:11px;color:var(--tx3);margin-top:2px">
              ${(()=>{const sup=(getLineup(t).sup||[]);const ass=(getLineup(t).ass||[]);const stealers=[...sup,...ass].slice(0,3);return stealers.length?`Empfohlene Steal-Gruppe: <strong>${stealers.join(', ')}</strong> — gemeinsam in ${stealZone==='z4'?'Z4':'Z2'} porten, Zone einnehmen, Punkte sammeln.`:`Steal-Gruppe: 2 Sammler/Support + 1 Assassine — gemeinsam in ${stealZone==='z4'?'Z4':'Z2'} porten.`;})()}
            </div>

// Drag & Drop handlers
function dragStart(e,name,fromZone){
  APP.selectedChip=name;APP.selectedFromZone=fromZone;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',name);
  // delay so the element isn't hidden before the drag ghost is captured
  requestAnimationFrame(()=>{const el=document.getElementById('chip-'+name.replace(/\s/g,'_'));if(el)el.classList.add('dragging');});}
function dragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.zc').forEach(el=>el.classList.remove('drop-target'));
  APP.selectedChip=null;APP.selectedFromZone=null;
  renderPage();}
function handleDrop(e,toZone){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.zc').forEach(el=>el.classList.remove('drop-target'));
  if(APP.selectedChip)moveChip(APP.selectedChip,APP.selectedFromZone,toZone);}
function handleDropBld(e,toZone,toBld){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.zc').forEach(el=>el.classList.remove('drop-target'));
  document.querySelectorAll('.bld-sub').forEach(el=>{const m=BLD_META[el.dataset.bld];if(m)el.style.background=m.color+'0d';});
  if(APP.selectedChip)moveChip(APP.selectedChip,APP.selectedFromZone,toZone,toBld);
}
function dragEnterZone(e,zone){e.preventDefault();document.getElementById('zone-'+zone).classList.add('drop-target');}
function dragLeaveZone(e,zone){
  const el=document.getElementById('zone-'+zone);
  if(el&&!el.contains(e.relatedTarget))el.classList.remove('drop-target');}

// Tap-to-select (mobile)
function selectChip(name,zone){
  if(APP.selectedChip===name){APP.selectedChip=null;APP.selectedFromZone=null;}
  else{APP.selectedChip=name;APP.selectedFromZone=zone;}
  renderPage();}
function dropToZone(zone){
  if(!APP.selectedChip)return;
  if(APP.selectedFromZone===zone){APP.selectedChip=null;APP.selectedFromZone=null;renderPage();return;}
  moveChip(APP.selectedChip,APP.selectedFromZone,zone);
}
function dropToBld(toZone,toBld){
  if(!APP.selectedChip)return;
  const ba=APP.bldAssign||{};
  // Gleicher Spieler im selben Gebäude → deselektieren
  if(APP.selectedFromZone===toZone&&ba[APP.selectedChip]===toBld){
    APP.selectedChip=null;APP.selectedFromZone=null;renderPage();return;
  }
  moveChip(APP.selectedChip,APP.selectedFromZone,toZone,toBld);
}
function moveChip(name,fromZone,toZone,bldKey){
  const t=APP.team;
  const L=getLineup(t);
  if(!APP.bldAssign)APP.bldAssign={};
  // Phase-1-Gast bleibt Gast wenn man ihn auf ein Gebäude SEINER Phase-1-Zone zieht
  // (ass→z1, ars→z2, sold→z4): nur bldAssign ändern, Lineup-Gruppe bleibt.
  const phase1Map={ass:'z1',ars:'z2',sold:'z4'};
  if(bldKey&&phase1Map[fromZone]===toZone){
    APP.bldAssign[name]=bldKey;
    APP.selectedChip=null;APP.selectedFromZone=null;
    setLineupReady(t,true);
    saveWSState();renderPage();return;
  }
  // Standard-Move: aus altem Slot raus, in neuen rein
  if(fromZone&&L[fromZone])L[fromZone]=L[fromZone].filter(n=>n!==name);
  Object.keys(L).forEach(k=>{if(k!==toZone)L[k]=L[k].filter(n=>n!==name);});
  if(!L[toZone])L[toZone]=[];
  if(!L[toZone].includes(name))L[toZone].push(name);
  // Gebäude-Zuweisung
  if(bldKey&&BLD_META[bldKey]){
    APP.bldAssign[name]=bldKey;
  } else if(['z1','z2','z3','z4'].includes(toZone)){
    autoAssignBld(name,toZone,L);
  } else if(toZone==='ars'){
    autoAssignBld(name,'z2',{z2:L.ars||[]});
  } else if(toZone==='sold'){
    autoAssignBld(name,'z4',{z4:L.sold||[]});
  } else if(toZone==='ass'){
    APP.bldAssign[name]='infozentrum';
  } else if(toZone==='sup'){
    delete APP.bldAssign[name];
  }
  setLineup(t,L);
  APP.selectedChip=null;APP.selectedFromZone=null;
  setLineupReady(t,true);
  saveWSState();
  renderPage();}

function updateWeight(k,v){APP.zoneWeights[k]=Math.max(0,Math.min(100,parseInt(v)||0));renderPage();}

function moveBldPrio(key,dir){
  const defaultOrd=['infozentrum','oelraf1','sciencehub','oelraf2','arsenal','soeldner','laz1','laz2','laz3','laz4','silo','oelquellen'];
  const order=[...(APP.buildingOrder&&APP.buildingOrder.length>=12?APP.buildingOrder:defaultOrd)];
  const idx=order.indexOf(key);if(idx<0)return;
  const nIdx=idx+dir;if(nIdx<0||nIdx>=order.length)return;
  [order[idx],order[nIdx]]=[order[nIdx],order[idx]];
  APP.buildingOrder=order;
  // Zonegewichte aus Reihenfolge ableiten
  const zoneKeyMap={infozentrum:'z1',oelraf1:'z1',sciencehub:'z3',oelraf2:'z3',laz1:'z4',laz2:'z2',laz3:'z4',laz4:'z2'};
  const wVals=[40,30,20,10];
  const newW={z1:10,z2:10,z3:10,z4:10};
  const seen=new Set();let wi=0;
  for(const k of order){
    const zk=zoneKeyMap[k];
    if(zk&&!seen.has(zk)&&wi<wVals.length){newW[zk]=wVals[wi++];seen.add(zk);}
  }
  APP.zoneWeights=newW;
  saveWSState();renderPage();
}
function changeBldSlot(key,d){
  if(!BLD_META[key])return; // unbekanntes Gebäude
  const bs=getBldSlots();
  // Min/Max je Gebäudetyp
  const min=0; // alle Gebäude können auf 0 gesetzt werden
  const max=10;
  bs[key]=Math.max(min,Math.min(max,(bs[key]||0)+d));
  saveWSState();
  renderPage();
}
function cycleBldAssign(name,zone){
  const blds=_zoneBlds[zone];
  if(!blds)return;
  if(!APP.bldAssign)APP.bldAssign={};
  const cur=APP.bldAssign[name];
  const idx=blds.indexOf(cur);
  APP.bldAssign[name]=blds[(idx+1)%blds.length];
  saveWSState();renderPage();
}
function autoAssignBld(name,zone,lineup){
  const blds=_zoneBlds[zone];
  if(!blds)return;
  if(!APP.bldAssign)APP.bldAssign={};
  const ba=APP.bldAssign;
  const zonePlayers=lineup[zone]||[];
  const cnt={};blds.forEach(b=>cnt[b]=0);
  zonePlayers.forEach(n=>{if(ba[n]&&cnt[ba[n]]!==undefined)cnt[ba[n]]++;});
  const target=blds.reduce((a,b)=>cnt[a]<=cnt[b]?a:b);
  ba[name]=target;
}

function autoAssign(){
  const t=APP.team;
  const teamPool=Object.entries(APP.teamAssign).filter(([,v])=>v===t).map(([k])=>k);
  const seen=new Set();
  const rawPool=teamPool.length?teamPool:[...APP.accepted];
  const pool=rawPool.filter(n=>{
    if(!n||seen.has(n)||isInactive(n))return false;
    seen.add(n);return true;
  }).sort((a,b)=>getT1(b)-getT1(a));

  const newL={ass:[],ars:[],sold:[],sup:[],z1:[],z2:[],z3:[],z4:[]};
  if(!APP.bldAssign)APP.bldAssign={};
  pool.forEach(n=>delete APP.bldAssign[n]);

  const ts=getZoneSlots(t);
  const supN=ts.sup||0;

  // Springer: schwächste N (kein Gebäude). Achtung: slice(-0) === slice(0) → gesondert behandeln.
  newL.sup=supN===0?[]:(pool.length>supN?pool.slice(-supN):pool.slice());
  const ph1=pool.slice(0,pool.length-newL.sup.length); // alle außer Springer

  // Z5-Rollen nach Stärke: stärkste → Silo, nächste → Arsenal, nächste → Söldner
  // Constraint: jede Zone muss mindestens 1 permanenten Spieler behalten
  const ph1BldKeysEarly=['infozentrum','oelraf1','sciencehub','oelraf2','laz1','laz2','laz3','laz4'];
  const bldOrdEarly=(APP.buildingOrder||ph1BldKeysEarly).filter(k=>ph1BldKeysEarly.includes(k));
  const _bzE={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
  const slotSeqE=[];
  while(slotSeqE.length<ph1.length){for(const bk of bldOrdEarly){if(slotSeqE.length>=ph1.length)break;slotSeqE.push(bk);}}
  // Hilfsfunktion: Anzahl Zonen mit permanentem Spieler ab Index 'off'
  const zonesFrom=off=>{const zs=new Set();for(let i=off;i<slotSeqE.length;i++){const z=_bzE[slotSeqE[i]];if(z)zs.add(z);}return zs.size;};
  let assN=ts.ass||0,arsN=ts.ars||0,soldN=ts.sold||0;
  // Kappen: nicht mehr als ph1.length Z5-Spieler
  while(assN+arsN+soldN>ph1.length){if(soldN>0)soldN--;else if(arsN>0)arsN--;else assN--;}
  // Reduziere Z5 (unwichtigste zuerst) bis alle 4 Zonen mindestens 1 Spieler haben
  const needZones=Math.min(4,ph1.length);
  while(assN+arsN+soldN>0&&zonesFrom(assN+arsN+soldN)<needZones){
    if(soldN>0)soldN--;else if(arsN>0)arsN--;else if(assN>0)assN--;else break;
  }
  let off=0;
  newL.ass=ph1.slice(off,off+assN); off+=assN;
  newL.ars=ph1.slice(off,off+arsN); off+=arsN;
  newL.sold=ph1.slice(off,off+soldN); off+=soldN;
  const zonePlayers=ph1.slice(off); // bleiben die ganze Zeit in ihren Zonen

  // Phase-1-Gebäude-Zuteilung: slotSeqE und _bzE bereits oben definiert
  ph1.forEach((name,i)=>{APP.bldAssign[name]=slotSeqE[i];});

  // Zone-Spieler (permanent) in z1-z4 einsortieren
  zonePlayers.forEach(name=>{
    const zone=_bzE[APP.bldAssign[name]];
    if(zone)newL[zone].push(name);
  });

  // --- Minimaler Shift (Phase 2) ---
  // Z5-Spieler verlassen ihre Phase-1-Gebäude ab Min 10.
  // Spieler von den UNWICHTIGSTEN Gebäuden (letzte N in zonePlayers) springen in die geräumten wichtigen Slots.
  // Innerhalb dieser Gruppe: stärkster Shifter → wichtigstes geräumtes Gebäude.
  const z5Count=newL.ass.length+newL.ars.length+newL.sold.length;
  const vacatedSlots=slotSeqE.slice(0,z5Count); // wichtigste Gebäude (von Z5 geräumt)
  if(!APP.bldAssignPh2)APP.bldAssignPh2={};
  ph1.forEach(n=>delete APP.bldAssignPh2[n]);
  const shifterStart=Math.max(0,zonePlayers.length-z5Count);
  zonePlayers.forEach((n,i)=>{
    if(i>=shifterStart&&vacatedSlots[i-shifterStart]){
      APP.bldAssignPh2[n]=vacatedSlots[i-shifterStart];
    } else {
      APP.bldAssignPh2[n]=APP.bldAssign[n];
    }
  });

  setLineup(t,newL);
  setLineupReady(t,true);
  APP.selectedChip=null;
  saveWSState();
  renderPage();
}

function buildAufstellungMail(t){
  const L=getLineup(t);
  const ba=APP.bldAssign||{};
  const time=t==='A'?'13:00':'22:00';
  const stealZone=APP.teamSide==='left'?'z4':APP.teamSide==='right'?'z2':null;
  const BLD_SHORT={
    infozentrum:'Infozentrum',oelraf1:'Ölraf I',oelraf2:'Ölraf II',
    sciencehub:'Science Hub',laz1:'Laz I',laz2:'Laz II',laz3:'Laz III',laz4:'Laz IV',
  };
  const assSet=new Set(L.ass||[]),arsSet=new Set(L.ars||[]),soldSet=new Set(L.sold||[]);
  const ba2=APP.bldAssignPh2||{};
  function ph2(n){
    if(assSet.has(n))return'→ Silo (Z5) ab Min 10';
    if(arsSet.has(n))return'→ Arsenal (Z5) ab Min 10';
    if(soldSet.has(n))return'→ Söldner (Z5) ab Min 10';
    const p2=ba2[n];
    if(p2&&p2!==ba[n])return`→ ${BLD_SHORT[p2]||p2} ab Min 10 (Shift)`;
    return'bleibt';
  }
  const lines=[];
  const intro=APP.mailText[t]&&APP.mailText[t].trim();
  if(intro)lines.push(intro,'');
  lines.push(`Team ${t} · ${time} Uhr – Aufstellung`);
  lines.push('');
  const zoneDef=[
    {key:'z1',lbl:'ZONE 1 (Infozentrum + Ölraf I)'},
    {key:'z2',lbl:'ZONE 2 (2× Feldlazarett)'},
    {key:'z3',lbl:'ZONE 3 (Ölraf II + Science Hub)'},
    {key:'z4',lbl:'ZONE 4 (2× Feldlazarett)'},
  ];
  // Z5-Gäste: Z5-Spieler in einer Zone anhand bldAssign
  const _bz={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',
             oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
  const z5All=[...assSet,...arsSet,...soldSet];
  function guestsInZone(zk){return z5All.filter(n=>_bz[ba[n]]===zk);}
  zoneDef.forEach(({key,lbl})=>{
    const isSteal=key===stealZone;
    const perm=L[key]||[];
    const guests=guestsInZone(key);
    const all=[...guests,...perm]; // Z5-Spieler zuerst (stärkste)
    lines.push(isSteal?`${lbl} ⚠ STEAL:`:`${lbl}:`);
    if(isSteal){
      lines.push('  leer lassen');
    } else if(!all.length){
      lines.push('  (leer)');
    } else {
      all.forEach(n=>{
        const bShort=BLD_SHORT[ba[n]]||'';
        lines.push(`  ${n} – ${bShort?bShort+' · ':''}${ph2(n)}`);
      });
    }
    lines.push('');
  });
  if((L.sup||[]).length){
    lines.push('🛡 SPRINGER:');
    L.sup.forEach(n=>lines.push(`  ${n} – Kisten sammeln · ab Min 25 freie Gebäude${stealZone?' · Steal-Zone beobachten':''}`));
    lines.push('');
  }
  lines.push('ZONE 5 (ab Min 10:00):');
  if((L.ass||[]).length)lines.push(`  Silo: ${[...assSet].join(', ')}`);
  if((L.ars||[]).length)lines.push(`  Arsenal: ${[...arsSet].join(', ')}`);
  if((L.sold||[]).length)lines.push(`  Söldner: ${[...soldSet].join(', ')}`);
  return lines.join('\n').trim();
}

function loadWSState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const s=JSON.parse(raw);
    if(s.teamSide)APP.teamSide=s.teamSide;
    if(s.infoCardOpen!==undefined)APP.infoCardOpen=s.infoCardOpen;
    if(s.teamAssign&&typeof s.teamAssign==='object')APP.teamAssign=s.teamAssign;
    if(s.anmeldungClosed!==undefined)APP.anmeldungClosed=s.anmeldungClosed;
    if(s.lineupA)APP.lineupA=s.lineupA;
    if(s.lineupB)APP.lineupB=s.lineupB;
    if(s.lineupReadyA!==undefined)APP.lineupReadyA=s.lineupReadyA;
    if(s.lineupReadyB!==undefined)APP.lineupReadyB=s.lineupReadyB;
    // Aktuelle bldSlots-Felder
    if(s.bldSlotsA)APP.bldSlotsA={...APP.bldSlotsA,...s.bldSlotsA};
    if(s.bldSlotsB)APP.bldSlotsB={...APP.bldSlotsB,...s.bldSlotsB};
    // Migration: alte zoneSlotsA/B + arsSlots/soldSlots → bldSlotsA/B
    ['A','B'].forEach(team=>{
      const oldZone=s['zoneSlots'+team];
      const oldArs=s.arsSlots, oldSold=s.soldSlots;
      const target=APP['bldSlots'+team];
      // Pro Zone Summe → auf primäres Gebäude allokieren, Rest auf sekundäres (gleichmäßig)
      function distribute(z,bldA,bldB){
        if(!oldZone||oldZone[z]===undefined||s.bldSlotsA||s.bldSlotsB)return;
        const total=oldZone[z]||0;
        target[bldA]=Math.ceil(total/2);
        target[bldB]=Math.floor(total/2);
      }
      distribute('z1','oelraf1','infozentrum');
      distribute('z2','laz2','laz4');
      distribute('z3','oelraf2','sciencehub');
      distribute('z4','laz1','laz3');
      if(!s.bldSlotsA&&!s.bldSlotsB){
        if(oldZone&&oldZone.ass!==undefined)target.silo=oldZone.ass;
        if(oldZone&&oldZone.sup!==undefined)target.oelquellen=oldZone.sup;
        if(oldArs!==undefined)target.arsenal=oldArs;
        if(oldSold!==undefined)target.soeldner=oldSold;
      }
    });
    if(Array.isArray(s.buildingOrder)&&s.buildingOrder.length)APP.buildingOrder=s.buildingOrder;
    if(s.bldAssign&&typeof s.bldAssign==='object')APP.bldAssign=s.bldAssign;
    if(s.bldAssignPh2&&typeof s.bldAssignPh2==='object')APP.bldAssignPh2=s.bldAssignPh2;
    if(s.stratCardOpen!==undefined)APP.stratCardOpen=s.stratCardOpen;
    // Migration: alte gespeicherte lineups ohne ars/sold ergänzen
    ['A','B'].forEach(t=>{
      const L=APP['lineup'+t];
      if(L){if(!L.ars)L.ars=[];if(!L.sold)L.sold=[];}
    });
    if(s.mailText)APP.mailText=s.mailText;
    if(typeof s.mailGeneral==='string'){

// --- SPIELER (Liste + Profil) ---
function wsSpieler(){
  if(APP.selectedPlayer)return wsPlayerProfile(APP.selectedPlayer);
  const pl=APP.data.players;
  const sorted=sortPlayers(pl);
  const active=pl.filter(p=>!isInactive(p.name)).length;
  const s=APP.playerSort;

  const SORTS=[
    {k:'t1',l:'T1 ↓'},
    {k:'kills',l:'⚔ Kills'},
    {k:'popularity',l:'❤ Beliebtheit'},
    {k:'profession_level',l:'Beruf-Lvl'},
    {k:'reliability',l:'Quote'},
    {k:'name',l:'A–Z'},
  ];

  function profInfo(p){
    const prof=p.profession||'Ingenieur';
    const isK=prof==='Kriegsführer';
    return{prof,isK,icon:isK?'⚔':'🔧',color:isK?'var(--ass)':'var(--primary)',bg:isK?'var(--ass-l)':'var(--pri-l)'};
  }

  function playerRow(p){
    const inactive=isInactive(p.name);
    const rel=reliability(p.name);
    const {prof,isK,icon,color,bg}=profInfo(p);
    const pRole=inactive?null:(p.role||'R3');
    const stats=[
      p.t1?`<span style="white-space:nowrap">T1 <strong>${p.t1}M</strong></span>`:'',
      p.kills?`<span style="white-space:nowrap">${icon} ${fmtK(p.kills)}</span>`:'',
      p.popularity?`<span style="white-space:nowrap">❤ ${fmt(p.popularity)}</span>`:'',
      p.profession_level?`<span style="white-space:nowrap;color:${inactive?'#aaa':color}">${prof==='Kriegsführer'?'⚔':'🔧'} Lv.${p.profession_level}</span>`:'',
    ].filter(Boolean).join('<span style="color:var(--bd2);margin:0 1px"> · </span>');
    return`<div class="mi" style="cursor:pointer;${inactive?'opacity:.42;background:#f9f9f9':''}" onclick="APP.selectedPlayer='${p.name.replace(/'/g,"\\'")}';renderPage()">
      <div class="mav" style="background:${inactive?'#eee':bg};color:${inactive?'#bbb':color};font-size:16px">${inactive?'✕':icon}</div>
      <div style="flex:1;min-width:0">
        <div class="mn" style="display:flex;align-items:center;gap:6px;${inactive?'color:var(--tx3);text-decoration:line-through':isK?'color:var(--ass)':''}">
          ${p.name}${pRole?rankBadge(pRole):''}
        </div>
        <div class="mm" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;align-items:center">
          ${inactive?'<span style="color:#e67e22;font-size:11px;font-weight:700">⚠ Ausgetreten</span>':stats||'<span style="color:var(--tx3)">Keine Daten</span>'}
        </div>
      </div>
      <div class="mr" style="flex-shrink:0">
        <span style="font-size:12px;font-weight:700;color:${inactive?'#ccc':relColor(rel)}">${inactive?'–':rel!==null?rel+'%':'Neu'}</span>
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:var(--tx3);stroke-width:2;fill:none"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>`;
  }

  const GROUP_META={R5:{label:'R5 · Präsident',c:'#f39c12'},R4:{label:'R4 · Offiziere',c:'#9b59b6'},R3:{label:'R3 · Mitglieder',c:'#7f8c8d'},inactive:{label:'Ausgetreten',c:'#bdc3c7'}};
  function groupHeader(role){const m=GROUP_META[role]||{label:role,c:'#8892a4'};return`<div style="padding:8px 14px 4px;font-size:11px;font-weight:800;color:${m.c};letter-spacing:.6px;background:${m.c}11;border-bottom:1px solid ${m.c}33">── ${m.label} ──</div>`;}

  let h=``;
  // Sort buttons
  h+=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
    ${SORTS.map(b=>`<button class="btn btn-sm ${s===b.k?'btn-sol':'btn-out'}" style="padding:5px 10px;font-size:12px" onclick="APP.playerSort='${b.k}';renderPage()">${b.l}</button>`).join('')}
  </div>`;
  // Summary
  h+=`<div class="note info" style="margin-bottom:10px;padding:8px 12px;font-size:12px">
    <strong>${active} aktive Spieler</strong> · ${pl.length-active} ausgetreten · ${pl.length} gesamt · Antippen für Profil
  </div>`;
  // Grouped player list
  let listHtml='';let lastGroup=null;
  sorted.forEach(p=>{
    const g=isInactive(p.name)?'inactive':(p.role||'R3');
    if(g!==lastGroup){listHtml+=groupHeader(g);lastGroup=g;}
    listHtml+=playerRow(p);
  });
  h+=`<div class="card">${listHtml}</div>`;
  return h;
}

function wsPlayerProfile(name){
  const p=APP.data.players.find(x=>x.name===name);
  if(!p)return`<div class="loader">Spieler nicht gefunden.</div>`;
  const allParts=APP.data.participation.filter(x=>x.player_name===name);
  const allEvts=allParts.map(x=>({...x,ev:APP.data.events.find(e=>e.id===x.event_id)})).filter(x=>x.ev).sort((a,b)=>b.ev.event_date.localeCompare(a.ev.event_date));
  const played=allParts.filter(x=>x.played);
  const missed=allParts.filter(x=>!x.played&&!x.excused);
  const excused=allParts.filter(x=>x.excused);
  const rel=allParts.length?Math.round(played.length/allParts.length*100):null;
  const ap=played.filter(x=>x.individual_pts).reduce((s,x)=>s+(x.individual_pts||0),0);
  const apCount=played.filter(x=>x.individual_pts).length;
  const avgP=apCount?Math.round(ap/apCount):0;
  const evtsWon=allEvts.filter(x=>x.played&&x.ev?.result==='win').length;
  const evtsLost=allEvts.filter(x=>x.played&&x.ev?.result==='loss').length;
  const bestRank=played.filter(x=>x.rank).reduce((m,x)=>x.rank<m?x.rank:m,999);

  const inactive=isInactive(name);
  const canEdit=canAccess('profile_edit');
  const safeName=name.replace(/'/g,"\\'");
  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <button class="btn btn-out btn-sm" onclick="APP.selectedPlayer=null;renderPage()">← Alle Spieler</button>
    ${canEdit&&!inactive?`<button class="btn btn-sol btn-sm" onclick="APP.selectedPlayer=null;APP.allianzPlayer='${safeName}';APP.allianzPlayerEdit=true;APP.allianzParsed=null;APP.allianzParsedSel={};nav('allianz')">✏ Profil bearbeiten</button>`:''}
  </div>`;
  if(inactive)h+=`<div class="note" style="margin-bottom:10px;border-left-color:#e67e22;background:#fef9f0">⚠️ <strong>Nicht mehr in der Allianz</strong> — Historische Daten aus früheren WS-Läufen.</div>`;
  h+=`<div style="display:flex;align-items:center;gap:13px;margin-bottom:16px;${inactive?'opacity:.7':''}">
    <div style="width:52px;height:52px;border-radius:16px;background:${inactive?'#ccc':'var(--primary)'};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0">${name.charAt(0)}</div>
    <div><div style="font-size:18px;font-weight:800;${inactive?'color:var(--tx3);text-decoration:line-through':''}">${name}</div>
    <div style="margin-top:4px;display:flex;gap:5px;flex-wrap:wrap">
      ${inactive?`<span style="font-size:11px;font-weight:700;color:#e67e22;background:#fef0e0;padding:3px 8px;border-radius:6px">Ausgetreten</span>`:''}
      ${p.team&&!inactive?badge('Team '+p.team,p.team==='A'?'var(--win)':'#2980b9'):''}
      ${rel!==null?`<span style="font-size:11px;font-weight:700;color:${relColor(rel)};background:${relColor(rel)}22;padding:3px 8px;border-radius:6px">${rel}% Quote</span>`:''}
    </div></div>
  </div>`;

  // Spieler-Info (Beruf, Kills, Beliebtheit)
  const profP=p.profession||'Ingenieur';const isKP=profP==='Kriegsführer';
  if(profP||p.kills||p.popularity||p.profession_level){
    h+=`<div class="card" style="margin-bottom:10px"><div class="ch">Spieler-Info</div><div style="padding:12px"><div class="kk-grid">
      <div class="kk-box" style="${isKP?'border:1.5px solid var(--ass);background:var(--ass-l)':''}"><div class="kk-l">Beruf</div><div class="kk-v" style="font-size:14px;color:${isKP?'var(--ass)':'var(--primary)'}">${isKP?'⚔ Kriegsführer':'🔧 Ingenieur'}</div></div>
      ${p.profession_level?`<div class="kk-box"><div class="kk-l">Beruf-Level</div><div class="kk-v">${p.profession_level}</div></div>`:''}
      ${p.kills?`<div class="kk-box"><div class="kk-l">Kills</div><div class="kk-v">${fmtK(p.kills)}</div></div>`:''}
      ${p.popularity?`<div class="kk-box"><div class="kk-l">❤ Beliebtheit</div><div class="kk-v">${fmt(p.popularity)}</div></div>`:''}
    </div></div></div>`;
  }
  // Strength box
  if(p.t1||p.t2||p.t3){
    h+=`<div class="card" style="margin-bottom:10px"><div class="ch">Truppenstärke</div><div style="padding:12px"><div class="kk-grid">
      ${p.t1?`<div class="kk-box"><div class="kk-l">T1</div><div class="kk-v">${p.t1} M</div></div>`:''}
      ${p.t2?`<div class="kk-box"><div class="kk-l">T2</div><div class="kk-v">${p.t2} M</div></div>`:''}
      ${p.t3?`<div class="kk-box"><div class="kk-l">T3</div><div class="kk-v">${p.t3} M</div></div>`:''}
      ${p.t4?`<div class="kk-box"><div class="kk-l">T4</div><div class="kk-v">${p.t4} M</div></div>`:''}
      ${p.total_power?`<div class="kk-box" style="grid-column:1/-1"><div class="kk-l">Gesamtkampfkraft</div><div class="kk-v" style="font-size:18px">${fmt(p.total_power)}</div></div>`:''}
    </div></div></div>`;
  }

  // WS stats
  if(allParts.length){
    h+=`<div class="sg"><div class="sb"><div class="sb-l">Gespielt</div><div class="sb-v" style="color:var(--win)">${played.length}</div><div class="sb-s">von ${allParts.length}</div></div><div class="sb"><div class="sb-l">Siege</div><div class="sb-v" style="color:var(--win)">${evtsWon}</div><div class="sb-s">als aktiver Spieler</div></div><div class="sb"><div class="sb-l">Niederlagen</div><div class="sb-v" style="color:var(--loss)">${evtsLost}</div></div><div class="sb"><div class="sb-l">Ø Punkte</div><div class="sb-v">${fmt(avgP)}</div><div class="sb-s">pro Event</div></div>${missed.length?`<div class="sb"><div class="sb-l">Gefehlt</div><div class="sb-v" style="color:var(--loss)">${missed.length}</div></div>`:''}${excused.length?`<div class="sb"><div class="sb-l">Entschuldigt</div><div class="sb-v" style="color:var(--acc)">${excused.length}</div></div>`:''}</div>`;
  }

  // Event history
  if(allEvts.length){
    h+=`<div class="card"><div class="ch">WS-Verlauf</div>`;
    allEvts.forEach(x=>{
      const ev=x.ev;
      const c=x.played?(ev.result==='win'?'var(--win)':'var(--loss)'):(x.excused?'var(--acc)':'var(--loss)');
      const label=x.played?(ev.result==='win'?'Sieg':'Niederlage'):(x.excused?'Entschuldigt':'Gefehlt');
      h+=`<div class="mi">
        <div style="width:34px;height:34px;border-radius:9px;background:${c}22;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${c};flex-shrink:0">${x.played?(ev.result==='win'?'S':'N'):(x.excused?'E':'F')}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${ev.event_date} · Team ${ev.team}</div>
          <div style="font-size:11px;color:var(--tx3)">${ev.opponent||''}${x.zone?' · '+x.zone:''}${x.rank?' · Platz '+x.rank:''}</div>
        </div>
        <div class="mr">
          ${x.individual_pts?`<span style="font-size:13px;font-weight:800">${fmt(x.individual_pts)}</span>`:''}
          ${badge(label,c)}
        </div>
      </div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="note">Noch keine WS-Teilnahme erfasst.</div>`;
  }
  return h;
}

// --- ERGEBNIS ERFASSEN ---
function wsErfassenView(){
  // Lineup des aktuellen Teams → vorregistrierte Spieler
  const L=getLineup(APP.team);
  const regSet=new Set([...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[]),
    ...(L.ass||[]),...(L.ars||[]),...(L.sold||[]),...(L.sup||[])]);
  // Pending Event für dieses Team finden (am nächsten in der Zukunft oder gerade abgelaufen)
  const pendingEvt=[...APP.data.events]
    .filter(e=>e.team===APP.team&&(!e.result||e.result==='pending'))
    .sort((a,b)=>b.event_date.localeCompare(a.event_date))[0]||null;
  const defaultDate=pendingEvt?.event_date||new Date().toISOString().split('T')[0];
  const pendingId=pendingEvt?.id||'';
  const players=APP.data.players.filter(p=>!isInactive(p.name)).sort((a,b)=>getT1(b)-getT1(a));
  const pRows=players.map(p=>{
    const safe=p.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    const isReg=regSet.has(p.name)||regSet.size===0; // wenn kein Lineup: alle als registriert
    return`<tr style="${isReg?'':'opacity:0.45'}">
      <td style="font-size:13px;font-weight:600">${p.name}</td>
      <td style="text-align:center"><input type="checkbox" id="ef-reg-${safe}" ${isReg?'checked':''} onchange="efRegChange('${safe}')"></td>
      <td style="text-align:center"><input type="checkbox" id="ef-pld-${safe}"></td>
      <td><input type="number" id="ef-pts-${safe}" class="fi" style="width:110px;text-align:right;padding:3px 6px;font-size:12px;margin:0" placeholder="–" oninput="efPtsInput('${safe}')"></td>
    </tr>`;
  }).join('');
  const pendingNote=pendingEvt?`<div class="note info" style="margin-bottom:12px">Pending Event gefunden: <strong>${pendingEvt.event_date}</strong> · Dieses Event wird mit dem Ergebnis aktualisiert.</div>`:'';
  return`<button class="btn btn-out btn-sm" onclick="APP.wsErfassen=false;renderPage()" style="margin-bottom:12px">← Alle Events</button>
  ${pendingNote}
  <div class="card"><div class="ch">Ergebnis erfassen – Team ${APP.team}</div><div class="cb">
    <input type="hidden" id="ef-pending-id" value="${pendingId}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="fl2"><label>Datum</label><input class="fi" id="ef-date" type="date" value="${defaultDate}"></div>
      <div class="fl2"><label>Gegner</label><input class="fi" id="ef-opp" type="text" placeholder="Allianzname" value="${pendingEvt?.opponent||''}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="fl2"><label>Unsere Punkte</label><input class="fi" id="ef-our" type="number" placeholder="z.B. 327675" oninput="efAutoResult()"></div>
      <div class="fl2"><label>Gegner Punkte</label><input class="fi" id="ef-opp-pts" type="number" placeholder="z.B. 242149" oninput="efAutoResult()"></div>
    </div>
    <div class="fl2"><label>Ergebnis</label>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ok" id="res-win" style="flex:1" onclick="setResult('win')">🏆 Sieg</button>
        <button class="btn btn-no" id="res-loss" style="flex:1" onclick="setResult('loss')">💀 Niederlage</button>
      </div>
    </div>
    <div class="fl2"><label>Screenshots (optional – nur zur Ansicht)</label>
      <input type="file" id="ef-shots" multiple accept="image/*" onchange="efShowPreviews()" style="width:100%;padding:6px 0">
    </div>
    <div id="ef-previews" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
    <div style="font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--tx)">Spieler – Punkte aus Screenshot</div>
    <div style="font-size:11px;color:var(--tx3);margin-bottom:8px">Punkte eintragen → Spieler wird automatisch als <strong>Gespielt</strong> markiert. Spieler ohne Punkte aber mit Angem. ✓ → werden als <strong>Abwesend</strong> gespeichert.</div>
    <div class="scroll-x"><table>
      <thead><tr><th>Spieler</th><th style="text-align:center;white-space:nowrap">Angem.</th><th style="text-align:center">Gespielt</th><th style="text-align:right">Punkte</th></tr></thead>
      <tbody>${pRows}</tbody>
    </table></div>
    <button class="btn btn-sol" style="width:100%;margin-top:14px" id="saveRes2" onclick="saveResult2()">Ergebnis speichern</button>
  </div></div>`;
}

let _resultChoice=null;
function setResult(r){
  _resultChoice=r;
  document.getElementById('res-win').style.background=r==='win'?'var(--win)':'';
  document.getElementById('res-win').style.color=r==='win'?'#fff':'';
  document.getElementById('res-loss').style.background=r==='loss'?'var(--loss)':'';
  document.getElementById('res-loss').style.color=r==='loss'?'#fff':'';}
function efAutoResult(){
  const our=parseInt(document.getElementById('ef-our')?.value)||0;
  const opp=parseInt(document.getElementById('ef-opp-pts')?.value)||0;
  if(our&&opp)setResult(our>opp?'win':'loss');
}
function efShowPreviews(){
  const files=document.getElementById('ef-shots')?.files;
  const box=document.getElementById('ef-previews');
  if(!files||!box)return;
  box.innerHTML='';
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=document.createElement('img');
      img.src=e.target.result;
      img.style.cssText='height:200px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer';
      img.onclick=()=>window.open(e.target.result);
      box.appendChild(img);
    };
    r.readAsDataURL(f);
  });
}
function efRegChange(safe){
  const reg=document.getElementById('ef-reg-'+safe);
  const pld=document.getElementById('ef-pld-'+safe);
  if(reg&&pld&&!reg.checked)pld.checked=false;
}
function efPtsInput(safe){
  const pts=parseInt(document.getElementById('ef-pts-'+safe)?.value)||0;
  const pld=document.getElementById('ef-pld-'+safe);
  const reg=document.getElementById('ef-reg-'+safe);
  if(pld)pld.checked=pts>0;
  if(pts>0&&reg&&!reg.checked)reg.checked=true; // Punkte eingetragen → automatisch angemeldet+gespielt
}

async function saveResult2(){
  const date=document.getElementById('ef-date')?.value;
  const opp=document.getElementById('ef-opp')?.value?.trim();
  const our=parseInt(document.getElementById('ef-our')?.value)||null;
  const oppPts=parseInt(document.getElementById('ef-opp-pts')?.value)||null;
  if(!date||!_resultChoice){alert('Bitte Datum und Ergebnis (Sieg/Niederlage) angeben.');return;}
  const btn=document.getElementById('saveRes2');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const pendingId=document.getElementById('ef-pending-id')?.value||'';
    let eid;
    if(pendingId){
      // Bestehendes pending Event aktualisieren
      const upd=await fetch(SB+'/rest/v1/ws_events?id=eq.'+pendingId,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({event_date:date,opponent:opp||null,our_pts:our,opp_pts:oppPts,result:_resultChoice})});
      if(!upd.ok)throw new Error(await upd.text());
      // Alte Teilnahme-Daten löschen (werden neu gesetzt)
      await fetch(SB+'/rest/v1/ws_participation?event_id=eq.'+pendingId,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
      eid=pendingId;
    }else{
      const evRes=await fetch(SB+'/rest/v1/ws_events',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({event_date:date,team:APP.team,time_slot:APP.team==='A'?'13:00':'22:00',opponent:opp||null,our_pts:our,opp_pts:oppPts,result:_resultChoice})});
      if(!evRes.ok)throw new Error(await evRes.text());
      const [newEv]=await evRes.json();
      eid=newEv.id;
    }
    const players=APP.data.players.filter(p=>!isInactive(p.name));
    const ptsArr=[];
    players.forEach(p=>{
      const safe=p.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const pts=parseInt(document.getElementById('ef-pts-'+safe)?.value)||null;
      if(pts)ptsArr.push({name:p.name,pts});
    });
    ptsArr.sort((a,b)=>b.pts-a.pts);
    const rankMap={};ptsArr.forEach((x,i)=>rankMap[x.name]=i+1);
    const ptsMap=Object.fromEntries(ptsArr.map(x=>[x.name,x.pts]));
    const recs=players.map(p=>{
      const safe=p.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const reg=document.getElementById('ef-reg-'+safe)?.checked!==false;
      const pts=ptsMap[p.name]||null;
      // Gespielt = Punkte vorhanden ODER Gespielt-Checkbox manuell gesetzt
      const pld=pts>0||!!document.getElementById('ef-pld-'+safe)?.checked;
      return{event_id:eid,player_name:p.name,registered:reg,played:pld,excused:false,individual_pts:pts,rank:rankMap[p.name]||null};
    });
    let batches=[];
    for(let i=0;i<recs.length;i+=20)batches.push(recs.slice(i,i+20));
    const stripReg=r=>{const{registered,...rest}=r;return rest;};
    let hasRegCol=true;
    try{await sbPost('ws_participation',batches[0]);}
    catch(e){
      if(e.message?.includes('registered')){hasRegCol=false;await sbPost('ws_participation',batches[0].map(stripReg));}
      else throw e;
    }
    for(let i=1;i<batches.length;i++)await sbPost('ws_participation',hasRegCol?batches[i]:batches[i].map(stripReg));
    if(!hasRegCol)console.warn('SQL needed: ALTER TABLE ws_participation ADD COLUMN registered boolean DEFAULT true;');
    alert('✅ Ergebnis gespeichert!');
    _resultChoice=null;
    await loadData();
    APP.wsErfassen=false;APP.wsEventId=eid;
    setWSView('ergebnis');
  }catch(err){
    alert('Fehler: '+err.message);
    const btn=document.getElementById('saveRes2');
    if(btn){btn.textContent='Ergebnis speichern';btn.disabled=false;}
  }
}

const ROLE_DOT_C={R5:'#f39c12',R4:'#9b59b6',R3:'#7f8c8d'};
function roleDot(r,inact){
  const c=inact?'#bdc3c7':(ROLE_DOT_C[r]||'#7f8c8d');
  return`<div style="width:30px;height:30px;border-radius:50%;background:${c};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff">${inact?'✕':(r||'R3')}</div>`;
}
function calcGrowth(playerName){
  const hist=APP.playerHistory[playerName]||[];
  // Nur Einträge mit echtem T1-Wert (>0) — verhindert, dass Ersterfassung als Steigerung gilt
  const pts=hist
    .filter(e=>parseFloat(e.t1)>0)
    .map(e=>({t:new Date(e.recorded_at).getTime(),v:parseFloat(e.t1)}))
    .sort((a,b)=>a.t-b.t);
  if(pts.length<2)return{rate:0,projected:null};
  if(pts[pts.length-1].t-pts[0].t<2*86400000)return{rate:0,projected:null};
  const W=7*86400000,n=pts.length;
  const xs=pts.map(p=>p.t/W),ys=pts.map(p=>p.v);
  const xm=xs.reduce((a,b)=>a+b,0)/n,ym=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-xm)*(ys[i]-ym);den+=(xs[i]-xm)**2;}
  if(!den||!ym)return{rate:0,projected:null};
  const slope=num/den;
  const projected=Math.round((slope*(Date.now()/W)+(ym-slope*xm))*10)/10;
  return{rate:Math.round(slope/ym*1000)/10,projected:projected>0?projected:null};
}
function calcGrowthRate(playerName){return calcGrowth(playerName).rate;}
function allianzSortPlayers(list){
  const s=APP.allianzSort;
  const f=APP.allianzFilter;
  // Filter by roles
  let filtered=[...list];
  if(f.roles&&f.roles.length)filtered=filtered.filter(p=>{
    if(isInactive(p.name))return f.roles.includes('inaktiv');
    return f.roles.includes(p.role||'R3');
  });
  // Filter by profession
  if(f.profession==='Kriegsführer')filtered=filtered.filter(p=>p.profession==='Kriegsführer');
  if(f.profession==='Ingenieur')filtered=filtered.filter(p=>!p.profession||p.profession==='Ingenieur');
  // Filter by min T1
  if(f.minT1>0)filtered=filtered.filter(p=>isInactive(p.name)||(parseFloat(p.t1)||0)>=f.minT1);
  // Search
  const q=(APP.allianzSearch||'').toLowerCase().trim();
  if(q)filtered=filtered.filter(p=>p.name.toLowerCase().includes(q));
  // Sort
  filtered.sort((a,b)=>{
    const ai=isInactive(a.name),bi=isInactive(b.name);
    if(ai!==bi)return ai?1:-1;
    if(s==='role'){const rr=roleRank(b.role)-roleRank(a.role);return rr!==0?rr:a.name.localeCompare(b.name);}
    if(s==='t1')return(parseFloat(b.t1)||0)-(parseFloat(a.t1)||0);
    if(s==='kills')return(b.kills||0)-(a.kills||0);
    if(s==='popularity')return(b.popularity||0)-(a.popularity||0);
    if(s==='profession_level')return(b.profession_level||0)-(a.profession_level||0);
    if(s==='profession')return(a.profession||'').localeCompare(b.profession||'');
    if(s==='growth')return calcGrowthRate(b.name)-calcGrowthRate(a.name);
    return a.name.localeCompare(b.name);
  });
  return filtered;
}

// ── ALLIANZ PLAYER DETAIL HELPERS ──
function parseTruppenText(txt){
  if(!txt||!txt.trim()){APP.allianzParsed=null;APP.allianzParsedSel={};renderPage();return;}
  const res={};
  const patterns=[['t1',/T1\s*[:=]\s*([\d.,]+)/i],['t2',/T2\s*[:=]\s*([\d.,]+)/i],['t3',/T3\s*[:=]\s*([\d.,]+)/i],['t4',/T4\s*[:=]\s*([\d.,]+)/i],['total_power',/(?:gesamt|total|ges\.?)\s*[:=]?\s*([\d.,]+)/i]];
  patterns.forEach(([k,re])=>{const m=txt.match(re);if(m){const v=parseFloat(m[1].replace(',','.'));if(!isNaN(v))res[k]=k==='total_power'?Math.round(v):v;}});
  APP.allianzParsed=Object.keys(res).length?res:null;
  // default all checked
  if(APP.allianzParsed)Object.keys(APP.allianzParsed).forEach(k=>{if(APP.allianzParsedSel[k]===undefined)APP.allianzParsedSel[k]=true;});
  renderPage();
}
async function savePlayerHistory(name, fields){
  // fields: object with any of {t1,t2,t3,t4,total_power}
  const hasTruppe=fields.t1||fields.t2||fields.t3||fields.t4||fields.total_power;
  if(!hasTruppe)return;
  const pl=APP.data.players.find(x=>x.name===name);
  const hist={
    player_name:name,
    t1:fields.t1??pl?.t1??null,
    t2:fields.t2??pl?.t2??null,
    t3:fields.t3??pl?.t3??null,
    t4:fields.t4??pl?.t4??null,
    total_power:fields.total_power??pl?.total_power??null,
  };
  try{
    await sbPost('ws_player_history',[{...hist,changed_by:APP.user?.playerName||APP.user?.username||'unknown'}]);
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),{t1_updated_at:new Date().toISOString()});
    // update local
    if(pl)pl.t1_updated_at=new Date().toISOString();
    if(!APP.playerHistory[name])APP.playerHistory[name]=[];
    APP.playerHistory[name].unshift({...hist,recorded_at:new Date().toISOString()});
  }catch(e){console.warn('History save failed:',e.message);}
}
async function applyParsedTruppen(name){
  const parsed=APP.allianzParsed;const sel=APP.allianzParsedSel;
  if(!parsed)return;
  const upd={};
  Object.entries(parsed).forEach(([k,v])=>{if(sel[k]!==false)upd[k]=v;});
  if(!Object.keys(upd).length){alert('Keine Felder ausgewählt.');return;}
  try{
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
    const pl=APP.data.players.find(x=>x.name===name);
    if(pl)Object.assign(pl,upd);
    await savePlayerHistory(name,upd);
    APP.allianzParsed=null;APP.allianzParsedSel={};APP.allianzPlayerEdit=false;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}
async function apdSaveManual(name){
  const v=k=>document.getElementById(k)?.value;
  const upd={};
  const t1=parseFloat(v('apd-t1'));if(!isNaN(t1)&&t1>0)upd.t1=t1;
  const t2=parseFloat(v('apd-t2'));if(!isNaN(t2)&&t2>0)upd.t2=t2;
  const t3=parseFloat(v('apd-t3'));if(!isNaN(t3)&&t3>0)upd.t3=t3;
  const t4=parseFloat(v('apd-t4'));if(!isNaN(t4)&&t4>0)upd.t4=t4;
  const gkk=parseInt(v('apd-gkk'));if(!isNaN(gkk)&&gkk>0)upd.total_power=gkk;
  const isCorrection=!!APP.historyEditId;
  if(!isCorrection){
    const pl_val=parseInt(v('apd-pl'));if(!isNaN(pl_val)&&pl_val>0)upd.profession_level=pl_val;
    const kills=parseInt(v('apd-kills'));if(!isNaN(kills)&&kills>0)upd.kills=kills;
    const pop=parseInt(v('apd-pop'));if(!isNaN(pop)&&pop>0)upd.popularity=pop;
  }
  if(!Object.keys(upd).length){alert('Keine Werte eingetragen.');return;}
  const btn=document.getElementById('apd-save');if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    if(isCorrection){
      // PATCH the existing history row
      const histFields={t1:upd.t1??null,t2:upd.t2??null,t3:upd.t3??null,t4:upd.t4??null,total_power:upd.total_power??null};
      await sbPatch('ws_player_history','id=eq.'+encodeURIComponent(APP.historyEditId),histFields);
      // Also update ws_players with the corrected values
      await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
      // Update local cache
      const pl=APP.data.players.find(x=>x.name===name);
      if(pl)Object.assign(pl,upd);
      const entry=APP.playerHistory[name]?.find(e=>e.id===APP.historyEditId);
      if(entry)Object.assign(entry,histFields);
      APP.historyEditId=null;APP.historyEditPrefill={};
    } else {
      await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
      const pl=APP.data.players.find(x=>x.name===name);
      if(pl)Object.assign(pl,upd);
      await savePlayerHistory(name,upd);
    }
    APP.allianzPlayerEdit=false;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);if(btn){btn.textContent='Speichern';btn.disabled=false;}}
}
async function apd_setProfession(name,prof){
  try{
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),{profession:prof});
    const pl=APP.data.players.find(x=>x.name===name);

function t1StaleInfo(player){
  if(!player)return null;
  const upd=player.t1_updated_at;
  if(!upd)return{stale:true,label:'Nie aktualisiert',color:'var(--loss)'};
  const days=Math.floor((Date.now()-new Date(upd).getTime())/(1000*86400));
  if(days>21)return{stale:true,label:`Veraltet (vor ${days} Tagen)`,color:'var(--loss)'};
  if(days>10)return{stale:false,label:`Vor ${days} Tagen`,color:'var(--acc)'};
  return{stale:false,label:days===0?'Heute':days===1?'Gestern':`Vor ${days} Tagen`,color:'var(--win)'};
}
function renderHistoryChart(name){
  const hist=(APP.playerHistory[name]||[]).slice().reverse(); // oldest first
  if(hist.length<2)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Noch nicht genug Datenpunkte für einen Verlauf.</div>`;
  const fields=[{k:'t1',c:'#2980b9',l:'T1'},{k:'t2',c:'#27ae60',l:'T2'},{k:'t3',c:'#e8a020',l:'T3'},{k:'t4',c:'#9b59b6',l:'T4'}].filter(f=>hist.some(h=>h[f.k]));
  const allVals=hist.flatMap(h=>fields.map(f=>parseFloat(h[f.k])||0));
  const maxV=Math.max(...allVals,0.1);
  const W=320,H=120,PAD=6,BOTT=20;
  const xScale=(W-PAD*2)/(hist.length-1||1);
  const yScale=(H-PAD-BOTT)/maxV;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  // Grid lines
  for(let i=0;i<=4;i++){
    const y=PAD+(H-PAD-BOTT)*(1-i/4);
    const val=(maxV*i/4).toFixed(1);
    svg+=`<line x1="${PAD}" y1="${y}" x2="${W-PAD}" y2="${y}" stroke="#e2e6f0" stroke-width="1"/>`;
    svg+=`<text x="${PAD}" y="${y-2}" font-size="8" fill="#8892a4">${val}M</text>`;
  }
  // Lines per field
  fields.forEach(f=>{
    const pts=hist.map((h,i)=>{
      const v=parseFloat(h[f.k])||0;
      const x=PAD+i*xScale;
      const y=H-BOTT-v*yScale;
      return`${x},${y}`;
    });
    svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${f.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // Dots
    hist.forEach((h,i)=>{
      const v=parseFloat(h[f.k])||0;if(!v)return;
      svg+=`<circle cx="${PAD+i*xScale}" cy="${H-BOTT-v*yScale}" r="3" fill="${f.c}"/>`
      svg+=`<title>${f.l}: ${v}M · ${h.recorded_at?.slice(0,10)||''}</title>`;
    });
  });
  // X-axis labels (first + last + middle if ≥5 points)
  const labelIdx=[0,hist.length-1];
  if(hist.length>=5)labelIdx.push(Math.floor(hist.length/2));
  labelIdx.forEach(i=>{
    const d=hist[i]?.recorded_at?.slice(0,10)||'';
    svg+=`<text x="${PAD+i*xScale}" y="${H-3}" font-size="7" fill="#8892a4" text-anchor="middle">${d.slice(5)}</text>`;
  });
  svg+=`</svg>`;
  // Legend
  const legend=fields.map(f=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px"><span style="width:12px;height:3px;background:${f.c};display:inline-block;border-radius:2px"></span>${f.l}</span>`).join('');
  return`<div style="padding:12px">${svg}<div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">${legend}</div></div>`;
}

function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
}
function resizeImageForOcr(dataUrl,maxPx=1280){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.85));
    };
    img.src=dataUrl;
  });
}
async function handleStrengthImage(file,t1Id,t2Id,t3Id,t4Id,resultId,labelId){
  const lbl=document.getElementById(labelId);
  const out=document.getElementById(resultId);
  if(!file)return;
  if(lbl)lbl.textContent='Analysiere…';
  if(out){out.style.display='';out.style.background='var(--bg)';out.style.borderColor='var(--bd)';out.textContent='Bild wird via Ollama analysiert…';}
  try{
    const b64=await resizeImageForOcr(await fileToBase64(file));
    const resp=await fetch(VISION_URL()+'/analyze-strength',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64})
    });
    if(!resp.ok)throw new Error('Vision-Server HTTP '+resp.status);
    const parsed=await resp.json();
    if(parsed.error)throw new Error(parsed.error);
    const toMio=v=>v>1000?Math.round(v/1e4)/100:v; // raw int → Mio
    let filled=0;
    [['t1',t1Id],['t2',t2Id],['t3',t3Id],['t4',t4Id]].forEach(([k,id])=>{
      if(parsed[k]!=null){const el=document.getElementById(id);if(el){el.value=toMio(parsed[k]);filled++;}}
    });
    if(out){out.style.background='#f0fef4';out.style.borderColor='var(--win)';out.textContent=`✅ ${filled} Werte erkannt — bitte prüfen und speichern.`;}
    if(lbl)lbl.textContent=file.name;
  }catch(e){
    let msg='❌ '+e.message;
    if(e.message.includes('fetch')||e.message.includes('Failed'))msg+=' — Ist der Vision-Server erreichbar? (Admin → Vision-URL prüfen)';
    if(out){out.style.background='#fef0f0';out.style.borderColor='var(--loss)';out.textContent=msg;}
    if(lbl)lbl.textContent='Screenshot hochladen (Truppenstärke)';
  }
}
function handleStrengthImageProf(file){handleStrengthImage(file,'manT1','manT2','manT3','manT4','profImgResult','profImgLabel');}
function handleStrengthImageApd(file){handleStrengthImage(file,'apd-t1','apd-t2','apd-t3','apd-t4','apdImgResult','apdImgLabel');}
async function saveStrength(){

  const t3=parseFloat(document.getElementById('manT3')?.value)||null;

  const btn=document.getElementById('saveBtn');if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{

    const player=APP.data.players.find(p=>p.name===name);

async function saveProfilePassword(){
  const u=APP.user;
  const isSA=u.role==='superadmin';
  const targetName=isSA?(document.getElementById('prof-pw-player')?.value||u.playerName):u.playerName;
  // Safety: non-admin can only change own password
  if(!isSA&&targetName!==u.playerName){alert('Nur dein eigenes Passwort kann geändert werden.');return;}
  const pw=(document.getElementById('prof-pw-new')?.value||'').trim();
  const pw2=(document.getElementById('prof-pw-confirm')?.value||'').trim();
  if(!pw){showPwResult('Bitte ein Passwort eingeben.',false);return;}
  if(pw.length<4){showPwResult('Passwort muss mindestens 4 Zeichen haben.',false);return;}
  if(pw!==pw2){showPwResult('Passwörter stimmen nicht überein.',false);return;}
  const btn=document.getElementById('prof-pw-btn');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const hash=await sha256(pw);
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(targetName),{password_hash:hash});
    const pl=APP.data.players.find(p=>p.name===targetName);
    if(pl)pl.password_hash=hash;
    showPwResult('✅ Passwort für „'+targetName+'" gespeichert!',true);
    document.getElementById('prof-pw-new').value='';
    document.getElementById('prof-pw-confirm').value='';
  }catch(err){showPwResult('Fehler: '+err.message,false);}
  if(btn){btn.textContent='Passwort speichern';btn.disabled=false;}
}
function showPwResult(msg,ok){
  const el=document.getElementById('prof-pw-result');
  if(!el)return;
  el.style.display='block';
  el.style.background=ok?'var(--win-l)':'var(--loss-l)';
  el.style.color=ok?'var(--win)':'var(--loss)';
  el.style.border='1px solid '+(ok?'#a9dfbf':'#f5b7b1');
  el.textContent=msg;
  if(ok)setTimeout(()=>{el.style.display='none';},3000);
}

}

async function togglePollVote(pollId,name,vote){
  const existing=(APP.data.pollVotes||[]).find(v=>v.poll_id===pollId&&v.player_name===name);
  try{
    if(existing&&existing.vote===vote){
      await sbDelete('ws_poll_votes','id=eq.'+encodeURIComponent(existing.id));
      APP.data.pollVotes=APP.data.pollVotes.filter(v=>v.id!==existing.id);
    }else{
      await sbUpsert('ws_poll_votes',{poll_id:pollId,player_name:name,vote,recorded_by:APP.user.playerName,recorded_at:new Date().toISOString()},'poll_id,player_name');
      const fresh=await sbGet('ws_poll_votes?poll_id=eq.'+encodeURIComponent(pollId));
      APP.data.pollVotes=(APP.data.pollVotes||[]).filter(v=>v.poll_id!==pollId).concat(fresh);
    }
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}
async function deletePoll(pollId){
  const isSA=APP.user?.role==='superadmin';
  const msg=isSA?'Umfrage und alle Stimmen ENDGÜLTIG löschen? Das kann nicht rückgängig gemacht werden.':'Umfrage ausblenden? Sie wird nicht mehr in Liste oder Aktivitätsübersicht gezählt — Super-Admin kann sie wiederherstellen oder endgültig löschen.';
  if(!confirm(msg))return;
  try{
    if(isSA){
      await sbDelete('ws_polls','id=eq.'+encodeURIComponent(pollId));
      APP.data.polls=(APP.data.polls||[]).filter(p=>p.id!==pollId);
      APP.data.pollVotes=(APP.data.pollVotes||[]).filter(v=>v.poll_id!==pollId);
    }else{
      const ts=new Date().toISOString();
      await sbPatch('ws_polls','id=eq.'+encodeURIComponent(pollId),{deleted_at:ts});
      const p=(APP.data.polls||[]).find(x=>x.id===pollId);
      if(p)p.deleted_at=ts;
    }
    navUmfragen('list');
  }catch(e){alert('Fehler: '+e.message);}
}
async function restorePoll(pollId){
  if(APP.user?.role!=='superadmin')return;
  try{
    await sbPatch('ws_polls','id=eq.'+encodeURIComponent(pollId),{deleted_at:null});
    const p=(APP.data.polls||[]).find(x=>x.id===pollId);
    if(p)p.deleted_at=null;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}
