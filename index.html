// ========== ALLIANZ ==========
const ROLE_DOT_C={R5:'#f39c12',R4:'#9b59b6',R3:'#7f8c8d'};
function roleDot(r,inact,name){
  const c=inact?'#bdc3c7':(ROLE_DOT_C[r]||'#7f8c8d');
  // Mit Avatar: Bild im rangfarbenen Ring. Der Rang steht in diesen Listen
  // ohnehin in der Gruppenüberschrift bzw. im Tooltip.
  if(name&&avatarUrl(name))
    return avatarImg(name,32,`border-radius:7px;border:2px solid ${c};box-sizing:border-box`,'')
      .replace('alt=""',`alt="" title="${inact?'Ausgetreten':(r||'R3')}"`);
  return`<div style="width:30px;height:30px;border-radius:50%;background:${c};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff">${inact?'✕':(r||'R3')}</div>`;
}
function calcGrowthAll(playerName){
  const hist=APP.playerHistory[playerName]||[];
  const calc=field=>{
    const pts=hist.filter(e=>parseFloat(e[field])>0)
      .map(e=>({t:new Date(e.recorded_at).getTime(),v:parseFloat(e[field])}))
      .sort((a,b)=>a.t-b.t);
    if(pts.length<2||pts[pts.length-1].t-pts[0].t<2*86400000)return{rate:0,projected:null};
    const W=7*86400000,n=pts.length;
    const xs=pts.map(p=>p.t/W),ys=pts.map(p=>p.v);
    const xm=xs.reduce((a,b)=>a+b,0)/n,ym=ys.reduce((a,b)=>a+b,0)/n;
    let num=0,den=0;
    for(let i=0;i<n;i++){num+=(xs[i]-xm)*(ys[i]-ym);den+=(xs[i]-xm)**2;}
    if(!den||!ym)return{rate:0,projected:null};
    const slope=num/den;
    const proj=Math.round((slope*(Date.now()/W)+(ym-slope*xm))*10)/10;
    return{rate:Math.round(slope/ym*1000)/10,projected:proj>0?proj:null};
  };
  const t1=calc('t1'),t2=calc('t2'),t3=calc('t3'),t4=calc('t4');
  const rates=[t1,t2,t3,t4].map(x=>x.rate).filter(r=>r!==0);
  const avgRate=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length*10)/10:0;
  return{t1,t2,t3,t4,avgRate};
}
function calcGrowth(playerName){return calcGrowthAll(playerName).t1;}
function calcGrowthRate(playerName){return calcGrowthAll(playerName).avgRate;}
function allianzSortPlayers(list){
  const s=APP.allianzSort;
  const f=APP.allianzFilter;
  // Filter by roles
  let filtered=[...list];
  if(f.roles&&f.roles.length)filtered=filtered.filter(p=>{
    if(isInactive(p.name))return f.roles.includes('inaktiv');
    return f.roles.includes(p.role||'R3');
  });
  // Filter by profession
  if(f.profession==='Kriegsführer')filtered=filtered.filter(p=>p.profession==='Kriegsführer');
  if(f.profession==='Ingenieur')filtered=filtered.filter(p=>!p.profession||p.profession==='Ingenieur');
  // Filter by min T1
  if(f.minT1>0)filtered=filtered.filter(p=>isInactive(p.name)||(parseFloat(p.t1)||0)>=f.minT1);
  // Search
  const q=(APP.allianzSearch||'').toLowerCase().trim();
  if(q)filtered=filtered.filter(p=>p.name.toLowerCase().includes(q));
  // Sort
  filtered.sort((a,b)=>{
    const ai=isInactive(a.name),bi=isInactive(b.name);
    if(ai!==bi)return ai?1:-1;
    if(s==='role'){const rr=roleRank(b.role)-roleRank(a.role);return rr!==0?rr:a.name.localeCompare(b.name);}
    if(s==='t1')return(parseFloat(b.t1)||0)-(parseFloat(a.t1)||0);
    if(s==='hero_power')return(b.hero_power||0)-(a.hero_power||0);
    if(s==='kills')return(b.kills||0)-(a.kills||0);
    if(s==='popularity')return(b.popularity||0)-(a.popularity||0);
    if(s==='profession_level')return(b.profession_level||0)-(a.profession_level||0);
    if(s==='profession')return(a.profession||'').localeCompare(b.profession||'');
    if(s==='growth')return calcGrowthRate(b.name)-calcGrowthRate(a.name);
    if(s==='growth_t1')return calcGrowthAll(b.name).t1.rate-calcGrowthAll(a.name).t1.rate;
    if(s==='growth_t2')return calcGrowthAll(b.name).t2.rate-calcGrowthAll(a.name).t2.rate;
    if(s==='growth_t3')return calcGrowthAll(b.name).t3.rate-calcGrowthAll(a.name).t3.rate;
    if(s==='growth_t4')return calcGrowthAll(b.name).t4.rate-calcGrowthAll(a.name).t4.rate;
    if(s==='t1_stale'){const au=a.t1_updated_at?new Date(a.t1_updated_at).getTime():0;const bu=b.t1_updated_at?new Date(b.t1_updated_at).getTime():0;return au-bu;}
    return a.name.localeCompare(b.name);
  });
  return filtered;
}

// ── ALLIANZ PLAYER DETAIL HELPERS ──
// Ganzzahl aus dem Spiel: „1.234.567", „1,234,567" und „1234567" meinen
// alle dieselbe Zahl. parseFloat allein macht aus „1.234.567" eine 1,234.
function parseBigInt(str){
  const s=String(str).trim();
  if(/^\d{1,3}([.,]\d{3})+$/.test(s))return parseInt(s.replace(/[.,]/g,''),10);
  const v=parseFloat(s.replace(',','.'));
  return isNaN(v)?null:Math.round(v);
}
function parseTruppenText(txt){
  if(!txt||!txt.trim()){APP.allianzParsed=null;APP.allianzParsedSel={};renderPage();return;}
  const res={};
  // Helden zuerst — und den Treffer aus dem Text schneiden, sonst greift die
  // lockere „gesamt"-Regel weiter unten auf „Gesamtkraft der Helden" zu und
  // schreibt die Heldenkraft in die Gesamtkampfkraft.
  let rest=txt;
  const heroRe=/(?:gesamtkraft\s*(?:der\s*)?helden|heldenkraft|helden|total\s*hero\s*power|hero\s*power)\s*[:=]?\s*([\d.,]+)/i;
  const hm=rest.match(heroRe);
  if(hm){
    let v=parseBigInt(hm[1]);
    // Im Spiel steht die Heldenkraft in Millionen („167,2"). Gespeichert wird
    // der absolute Wert. Alles unter 10.000 ist deshalb sicher eine
    // Millionen-Angabe — echte Heldenkräfte liegen bei zig Millionen.
    if(v!==null&&v<10000){const f=parseFloat(String(hm[1]).replace(',','.'));if(!isNaN(f))v=Math.round(f*1e6);}
    if(v!==null&&v>0)res.hero_power=v;
    rest=rest.replace(heroRe,' ');
  }
  const patterns=[['t1',/T1\s*[:=]\s*([\d.,]+)/i],['t2',/T2\s*[:=]\s*([\d.,]+)/i],['t3',/T3\s*[:=]\s*([\d.,]+)/i],['t4',/T4\s*[:=]\s*([\d.,]+)/i],['total_power',/(?:gesamt|total|ges\.?)\s*[:=]?\s*([\d.,]+)/i]];
  patterns.forEach(([k,re])=>{const m=rest.match(re);if(m){if(k==='total_power'){const v=parseBigInt(m[1]);if(v!==null)res[k]=v;}else{const v=parseFloat(m[1].replace(',','.'));if(!isNaN(v))res[k]=v;}}});
  APP.allianzParsed=Object.keys(res).length?res:null;
  // default all checked
  if(APP.allianzParsed)Object.keys(APP.allianzParsed).forEach(k=>{if(APP.allianzParsedSel[k]===undefined)APP.allianzParsedSel[k]=true;});
  renderPage();
}
async function savePlayerHistory(name, fields){
  // fields: object with any of {t1,t2,t3,t4,total_power,hero_power}
  const hasTruppe=fields.t1||fields.t2||fields.t3||fields.t4||fields.total_power||fields.hero_power;
  if(!hasTruppe)return;
  const pl=APP.data.players.find(x=>x.name===name);
  const hist={
    player_name:name,
    t1:fields.t1??pl?.t1??null,
    t2:fields.t2??pl?.t2??null,
    t3:fields.t3??pl?.t3??null,
    t4:fields.t4??pl?.t4??null,
    total_power:fields.total_power??pl?.total_power??null,
    hero_power:fields.hero_power??pl?.hero_power??null,
  };
  try{
    const _payload=[{...hist,changed_by:APP.user?.playerName||APP.user?.username||'unknown'}];
    const _r=await fetch(SB+'/rest/v1/ws_player_history',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(_payload)});
    if(!_r.ok)throw new Error(await _r.text());
    const _inserted=(await _r.json())[0]||{};
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),{t1_updated_at:new Date().toISOString()});
    // update local
    if(pl)pl.t1_updated_at=new Date().toISOString();
    if(!APP.playerHistory[name])APP.playerHistory[name]=[];
    APP.playerHistory[name].unshift({...hist,id:_inserted.id,recorded_at:_inserted.recorded_at||new Date().toISOString()});
  }catch(e){console.warn('History save failed:',e.message);}
}
async function applyParsedTruppen(name){
  const parsed=APP.allianzParsed;const sel=APP.allianzParsedSel;
  if(!parsed)return;
  const upd={};
  Object.entries(parsed).forEach(([k,v])=>{if(sel[k]!==false)upd[k]=v;});
  if(!Object.keys(upd).length){alert('Keine Felder ausgewählt.');return;}
  try{
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
    const pl=APP.data.players.find(x=>x.name===name);
    if(pl)Object.assign(pl,upd);
    await savePlayerHistory(name,upd);
    APP.allianzParsed=null;APP.allianzParsedSel={};APP.allianzPlayerEdit=false;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}
async function apdSaveManual(name){
  const v=k=>document.getElementById(k)?.value;
  const upd={};
  const t1=parseFloat(v('apd-t1'));if(!isNaN(t1)&&t1>0)upd.t1=t1;
  const t2=parseFloat(v('apd-t2'));if(!isNaN(t2)&&t2>0)upd.t2=t2;
  const t3=parseFloat(v('apd-t3'));if(!isNaN(t3)&&t3>0)upd.t3=t3;
  const t4=parseFloat(v('apd-t4'));if(!isNaN(t4)&&t4>0)upd.t4=t4;
  const gkk=parseInt(v('apd-gkk'));if(!isNaN(gkk)&&gkk>0)upd.total_power=gkk;
  const hp=parseFloat(v('apd-hp'));if(!isNaN(hp)&&hp>0)upd.hero_power=Math.round(hp*1e6);
  const isCorrection=!!APP.historyEditId;
  if(!isCorrection){
    const lvl=parseInt(v('apd-lvl'));if(!isNaN(lvl)&&lvl>0)upd.level=lvl;
    const pl_val=parseInt(v('apd-pl'));if(!isNaN(pl_val)&&pl_val>0)upd.profession_level=pl_val;
    const kills=parseInt(v('apd-kills'));if(!isNaN(kills)&&kills>0)upd.kills=kills;
    const pop=parseInt(v('apd-pop'));if(!isNaN(pop)&&pop>0)upd.popularity=pop;
  }
  if(!Object.keys(upd).length){alert('Keine Werte eingetragen.');return;}
  const btn=document.getElementById('apd-save');if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    if(isCorrection){
      // Beim Korrigieren: nur explizit eingetragene Felder überschreiben,
      // nicht eingetragene Felder behalten den Originalwert aus historyEditPrefill
      const pref=APP.historyEditPrefill||{};
      const keep=f=>upd[f]!==undefined?upd[f]:(pref[f]>0?pref[f]:null);
      const histFields={t1:keep('t1'),t2:keep('t2'),t3:keep('t3'),t4:keep('t4'),total_power:keep('total_power'),hero_power:keep('hero_power')};
      if(!APP.historyEditId||APP.historyEditId==='undefined'){throw new Error('History-Eintrag hat keine ID — Seite neu laden und erneut versuchen.');}
      await sbPatch('ws_player_history','id=eq.'+encodeURIComponent(APP.historyEditId),histFields);
      // ws_players nur mit explizit eingetragenen Werten aktualisieren
      await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
      // Update local cache
      const pl=APP.data.players.find(x=>x.name===name);
      if(pl)Object.assign(pl,upd);
      const entry=APP.playerHistory[name]?.find(e=>e.id===APP.historyEditId);
      if(entry)Object.assign(entry,histFields);
      APP.historyEditId=null;APP.historyEditPrefill={};
    } else {
      await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
      const pl=APP.data.players.find(x=>x.name===name);
      if(pl)Object.assign(pl,upd);
      await savePlayerHistory(name,upd);
    }
    APP.allianzPlayerEdit=false;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);if(btn){btn.textContent='Speichern';btn.disabled=false;}}
}
async function apdRename(oldName){

  if(!confirm(`„${oldName}" in „${newName}" umbenennen?\n\nName wird in allen Tabellen aktualisiert (Spieler, History, Teilnahmen, VS-Einträge).`))return;
  const btn=document.getElementById('apd-rename');if(btn){btn.textContent='Läuft…';btn.disabled=true;}
  try{
    const srcE=encodeURIComponent(oldName);
    await sbPatch('ws_participation','player_name=eq.'+srcE,{player_name:newName});
    await sbPatch('ws_player_history','player_name=eq.'+srcE,{player_name:newName});
    for(const tbl of ['vs_entries','ws_player_coords','ws_poll_votes','ws_rankings','ws_versammlungen']){
      try{await sbPatch(tbl,'player_name=eq.'+srcE,{player_name:newName});}catch(e){console.warn(tbl+' rename übersprungen:',e.message);}
    }
    await sbPatch('ws_players','name=eq.'+srcE,{name:newName});
    // Local cache
    const pl=APP.data.players.find(p=>p.name===oldName);if(pl)pl.name=newName;
    if(APP.playerHistory[oldName]){APP.playerHistory[newName]=APP.playerHistory[oldName];delete APP.playerHistory[oldName];APP.playerHistory[newName].forEach(h=>h.player_name=newName);}
    APP.data.participation.forEach(p=>{if(p.player_name===oldName)p.player_name=newName;});
    // WS-State (lineup/teamAssign/accepted/bldAssign)
    if(APP.teamAssign[oldName]){APP.teamAssign[newName]=APP.teamAssign[oldName];delete APP.teamAssign[oldName];}
    if(APP.csTeamAssign[oldName]){APP.csTeamAssign[newName]=APP.csTeamAssign[oldName];delete APP.csTeamAssign[oldName];}
    if(APP.csPlanA&&APP.csPlanA[oldName]){APP.csPlanA[newName]=APP.csPlanA[oldName];delete APP.csPlanA[oldName];}
    if(APP.csPlanB&&APP.csPlanB[oldName]){APP.csPlanB[newName]=APP.csPlanB[oldName];delete APP.csPlanB[oldName];}
    csSaveState();
    APP.accepted=APP.accepted.map(n=>n===oldName?newName:n);
    ['lineupA','lineupB'].forEach(k=>{const L=APP[k];Object.keys(L||{}).forEach(z=>{L[z]=(L[z]||[]).map(n=>n===oldName?newName:n);});});
    ['bldAssign','bldAssignPh2'].forEach(k=>{if(APP[k]?.[oldName]){APP[k][newName]=APP[k][oldName];delete APP[k][oldName];}});
    if(APP.selectedPlayer===oldName)APP.selectedPlayer=newName;
    saveWSState();
    APP.allianzPlayerEdit=false;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);if(btn){btn.textContent='✎ Umbenennen';btn.disabled=false;}}
}

function t1StaleInfo(player){
  if(!player)return null;
  const upd=player.t1_updated_at;
  if(!upd)return{stale:true,label:'Nie aktualisiert',color:'var(--loss)'};
  const days=Math.floor((Date.now()-new Date(upd).getTime())/(1000*86400));
  if(days>21)return{stale:true,label:`Veraltet (vor ${days} Tagen)`,color:'var(--loss)'};
  if(days>10)return{stale:false,label:`Vor ${days} Tagen`,color:'var(--acc)'};
  return{stale:false,label:days===0?'Heute':days===1?'Gestern':`Vor ${days} Tagen`,color:'var(--win)'};
}
function renderHistoryChart(name){
  const hist=(APP.playerHistory[name]||[]).slice().reverse(); // oldest first
  if(hist.length<2)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Noch nicht genug Datenpunkte für einen Verlauf.</div>`;
  const fields=[{k:'t1',c:'#2980b9',l:'T1'},{k:'t2',c:'#27ae60',l:'T2'},{k:'t3',c:'#e8a020',l:'T3'},{k:'t4',c:'#9b59b6',l:'T4'}].filter(f=>hist.some(h=>h[f.k]));
  const allVals=hist.flatMap(h=>fields.map(f=>parseFloat(h[f.k])||0));
  const maxV=Math.max(...allVals,0.1);
  const W=320,H=120,PAD=6,BOTT=20;
  const xScale=(W-PAD*2)/(hist.length-1||1);
  const yScale=(H-PAD-BOTT)/maxV;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  // Grid lines
  for(let i=0;i<=4;i++){
    const y=PAD+(H-PAD-BOTT)*(1-i/4);
    const val=(maxV*i/4).toFixed(1);
    svg+=`<line x1="${PAD}" y1="${y}" x2="${W-PAD}" y2="${y}" stroke="#e2e6f0" stroke-width="1"/>`;
    svg+=`<text x="${PAD}" y="${y-2}" font-size="8" fill="#8892a4">${val}M</text>`;
  }
  // Lines per field
  fields.forEach(f=>{
    const pts=hist.map((h,i)=>{
      const v=parseFloat(h[f.k])||0;
      const x=PAD+i*xScale;
      const y=H-BOTT-v*yScale;
      return`${x},${y}`;
    });
    svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${f.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // Dots
    hist.forEach((h,i)=>{
      const v=parseFloat(h[f.k])||0;if(!v)return;
      svg+=`<circle cx="${PAD+i*xScale}" cy="${H-BOTT-v*yScale}" r="3" fill="${f.c}"/>`
      svg+=`<title>${f.l}: ${v}M · ${h.recorded_at?.slice(0,10)||''}</title>`;
    });
  });
  // X-axis labels (first + last + middle if ≥5 points)
  const labelIdx=[0,hist.length-1];
  if(hist.length>=5)labelIdx.push(Math.floor(hist.length/2));
  labelIdx.forEach(i=>{
    const d=hist[i]?.recorded_at?.slice(0,10)||'';
    svg+=`<text x="${PAD+i*xScale}" y="${H-3}" font-size="7" fill="#8892a4" text-anchor="middle">${d.slice(5)}</text>`;
  });
  svg+=`</svg>`;
  // Legend
  const legend=fields.map(f=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px"><span style="width:12px;height:3px;background:${f.c};display:inline-block;border-radius:2px"></span>${f.l}</span>`).join('');
  return`<div style="padding:12px">${svg}<div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">${legend}</div></div>`;
}

function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
}
function resizeImageForOcr(dataUrl,maxPx=1280){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.85));
    };
    img.src=dataUrl;
  });
}
async function handleStrengthImage(file,t1Id,t2Id,t3Id,t4Id,resultId,labelId){
  const lbl=document.getElementById(labelId);
  const out=document.getElementById(resultId);
  if(!file)return;
  if(lbl)lbl.textContent='Analysiere…';
  if(out){out.style.display='';out.style.background='var(--bg)';out.style.borderColor='var(--bd)';out.textContent='Bild wird via Ollama analysiert…';}
  try{
    const b64=await resizeImageForOcr(await fileToBase64(file));
    const resp=await fetch(VISION_URL()+'/analyze-strength',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64})
    });
    if(!resp.ok)throw new Error('Vision-Server HTTP '+resp.status);
    const parsed=await resp.json();
    if(parsed.error)throw new Error(parsed.error);
    const toMio=v=>v>1000?Math.round(v/1e4)/100:v; // raw int → Mio
    let filled=0;
    [['t1',t1Id],['t2',t2Id],['t3',t3Id],['t4',t4Id]].forEach(([k,id])=>{
      if(parsed[k]!=null){const el=document.getElementById(id);if(el){el.value=toMio(parsed[k]);filled++;}}
    });
    if(out){out.style.background='#f0fef4';out.style.borderColor='var(--win)';out.textContent=`✅ ${filled} Werte erkannt — bitte prüfen und speichern.`;}
    if(lbl)lbl.textContent=file.name;
  }catch(e){
    let msg='❌ '+e.message;
    if(e.message.includes('fetch')||e.message.includes('Failed'))msg+=' — Ist der Vision-Server erreichbar? (Admin → Vision-URL prüfen)';
    if(out){out.style.background='#fef0f0';out.style.borderColor='var(--loss)';out.textContent=msg;}
    if(lbl)lbl.textContent='Screenshot hochladen (Truppenstärke)';
  }
}

async function saveStrength(){
  const t1=parseFloat(document.getElementById('manT1')?.value)||null;
  const t2=parseFloat(document.getElementById('manT2')?.value)||null;
  const t3=parseFloat(document.getElementById('manT3')?.value)||null;
  const t4=parseFloat(document.getElementById('manT4')?.value)||null;
  if(!t1&&!t2&&!t3){alert('Bitte mindestens T1 eingeben.');return;}
  const btn=document.getElementById('saveBtn');if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const name=APP.user.playerName;
    const upd={};if(t1)upd.t1=t1;if(t2)upd.t2=t2;if(t3)upd.t3=t3;if(t4)upd.t4=t4;
    const player=APP.data.players.find(p=>p.name===name);
    if(player)await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),upd);
    if(player)Object.assign(player,upd);
    await savePlayerHistory(name,upd);
    if(btn){btn.textContent='✅ Gespeichert!';setTimeout(()=>{btn.textContent='Stärken speichern';btn.disabled=false;},2000);}
    renderPage();
  }catch(err){alert('Fehler: '+err.message);if(btn){btn.textContent='Stärken speichern';btn.disabled=false;}}
}

async function saveProfilePassword(){
  const u=APP.user;
  const isSA=u.role==='superadmin';
  const targetName=isSA?(document.getElementById('prof-pw-player')?.value||u.playerName):u.playerName;
  // Safety: non-admin can only change own password
  if(!isSA&&targetName!==u.playerName){alert('Nur dein eigenes Passwort kann geändert werden.');return;}
  const pw=(document.getElementById('prof-pw-new')?.value||'').trim();
  const pw2=(document.getElementById('prof-pw-confirm')?.value||'').trim();
  if(!pw){showPwResult('Bitte ein Passwort eingeben.',false);return;}
  if(pw.length<4){showPwResult('Passwort muss mindestens 4 Zeichen haben.',false);return;}
  if(pw!==pw2){showPwResult('Passwörter stimmen nicht überein.',false);return;}
  const btn=document.getElementById('prof-pw-btn');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const hash=await sha256(pw);
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(targetName),{password_hash:hash});
    const pl=APP.data.players.find(p=>p.name===targetName);
    if(pl)pl.password_hash=hash;
    showPwResult('✅ Passwort für „'+targetName+'" gespeichert!',true);
    document.getElementById('prof-pw-new').value='';
    document.getElementById('prof-pw-confirm').value='';
  }catch(err){showPwResult('Fehler: '+err.message,false);}
  if(btn){btn.textContent='Passwort speichern';btn.disabled=false;}
}
function showPwResult(msg,ok){
  const el=document.getElementById('prof-pw-result');
  if(!el)return;
  el.style.display='block';
  el.style.background=ok?'var(--win-l)':'var(--loss-l)';
  el.style.color=ok?'var(--win)':'var(--loss)';
  el.style.border='1px solid '+(ok?'#a9dfbf':'#f5b7b1');
  el.textContent=msg;
  if(ok)setTimeout(()=>{el.style.display='none';},3000);
}

async function loadUmfragen(){
  try{
    const[polls,votes]=await Promise.all([
      sbGet('ws_polls?order=created_at.desc'),
      sbGet('ws_poll_votes?order=recorded_at.desc')
    ]);
    APP.data.polls=polls;
    APP.data.pollVotes=votes;
  }catch(e){
    APP.data.polls=[];
    APP.data.pollVotes=[];
    APP.data.pollsErr=e.message;
  }
  renderPage();
}
function navUmfragen(sub,pollId){APP.umfragenSub=sub||'list';APP.umfragenPollId=pollId||null;renderPage();}

  if(!canAccess('umfragen'))return`<div class="loader" style="color:var(--tx3)">Kein Zugriff. Nur R4 und R5 dürfen Umfragen verwalten.</div>`;

async function createPoll(){
  const title=(document.getElementById('poll-title')?.value||'').trim();
  const desc=(document.getElementById('poll-desc')?.value||'').trim();
  const err=document.getElementById('poll-create-err');
  const btn=document.getElementById('poll-create-btn');
  if(!title){if(err){err.style.display='block';err.textContent='Bitte einen Titel eingeben.';}return;}
  if(btn){btn.textContent='Speichere…';btn.disabled=true;}
  try{
    const r=await fetch(SB+'/rest/v1/ws_polls',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({title,description:desc||null,created_by:APP.user.playerName})});
    if(!r.ok)throw new Error(await r.text());
    const created=await r.json();
    const newPoll=Array.isArray(created)?created[0]:created;
    APP.data.polls=[newPoll,...(APP.data.polls||[])];
    navUmfragen('detail',newPoll.id);
  }catch(e){
    if(err){err.style.display='block';err.textContent='Fehler: '+e.message;}
    if(btn){btn.textContent='Umfrage anlegen';btn.disabled=false;}
  }
}

async function togglePollVote(pollId,name,vote){
  const existing=(APP.data.pollVotes||[]).find(v=>v.poll_id===pollId&&v.player_name===name);
  try{
    if(existing&&existing.vote===vote){
      await sbDelete('ws_poll_votes','id=eq.'+encodeURIComponent(existing.id));
      APP.data.pollVotes=APP.data.pollVotes.filter(v=>v.id!==existing.id);
    }else{
      await sbUpsert('ws_poll_votes',{poll_id:pollId,player_name:name,vote,recorded_by:APP.user.playerName,recorded_at:new Date().toISOString()},'poll_id,player_name');
      const fresh=await sbGet('ws_poll_votes?poll_id=eq.'+encodeURIComponent(pollId));
      APP.data.pollVotes=(APP.data.pollVotes||[]).filter(v=>v.poll_id!==pollId).concat(fresh);
    }
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}
async function deletePoll(pollId){
  const isSA=APP.user?.role==='superadmin';
  const msg=isSA?'Umfrage und alle Stimmen ENDGÜLTIG löschen? Das kann nicht rückgängig gemacht werden.':'Umfrage ausblenden? Sie wird nicht mehr in Liste oder Aktivitätsübersicht gezählt — Super-Admin kann sie wiederherstellen oder endgültig löschen.';
  if(!confirm(msg))return;
  try{
    if(isSA){
      await sbDelete('ws_polls','id=eq.'+encodeURIComponent(pollId));
      APP.data.polls=(APP.data.polls||[]).filter(p=>p.id!==pollId);
      APP.data.pollVotes=(APP.data.pollVotes||[]).filter(v=>v.poll_id!==pollId);
    }else{
      const ts=new Date().toISOString();
      await sbPatch('ws_polls','id=eq.'+encodeURIComponent(pollId),{deleted_at:ts});
      const p=(APP.data.polls||[]).find(x=>x.id===pollId);
      if(p)p.deleted_at=ts;
    }
    navUmfragen('list');
  }catch(e){alert('Fehler: '+e.message);}
}
async function restorePoll(pollId){
  if(APP.user?.role!=='superadmin')return;
  try{
    await sbPatch('ws_polls','id=eq.'+encodeURIComponent(pollId),{deleted_at:null});
    const p=(APP.data.polls||[]).find(x=>x.id===pollId);
    if(p)p.deleted_at=null;
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}

// ========== KARTEN-BILD ==========
// Phase 1: 4 Zonen (volle Breite, kein Z5-Streifen), kein Z5-Footer
// Phase 2: Z5-Mittelspalte + Z5-Footer mit neuer Aufstellung
function renderWSMapSvg(t, phase){
  const L=getLineup(t);
  const ba=APP.bldAssign||{};
  const ba2=APP.bldAssignPh2||{};
  const time=t==='A'?'13:00':'22:00';
  const W=400;
  const trunc=s=>(s||'').length>12?s.slice(0,11)+'…':s;

  const _bz={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
  const z5All=[...(L.ass||[]),...(L.ars||[]),...(L.sold||[])];
  const allZonePlayers=[...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[])];
  function z5Short(n){
    if((L.ass||[]).includes(n))return'→Silo';
    if((L.ars||[]).includes(n))return'→Ars';
    return'→Söld';
  }

  const hdrH=0, mapH=395, mapY=hdrH;
  const topY=mapY+4, topH=190, botY=topY+topH, botH=196;
  const BOX_FILL='rgba(255,255,255,0.45)';
  const hasSpringer=(L.sup||[]).length>0;
  const FS={zone:15,bld:12,player:14,guest:13,z5lbl:13,z5entry:12,footer:11,legend:10}; // font-sizes

  // Zone-Layout: Phase 1 = volle Breite ohne Z5; Phase 2 = mit Z5-Mittelspalte
  let zones, z5box=null;
  if(phase===1){
    zones={
      z1:{x:4,   y:topY, w:195, h:topH, color:'#c0392b', label:'Z1', blds:['oelraf1','infozentrum']},
      z4:{x:4,   y:botY, w:195, h:botH, color:'#2980b9', label:'Z4', blds:['laz3','laz4']},
      z2:{x:201, y:topY, w:195, h:topH, color:'#e8a020', label:'Z2', blds:['laz1','laz2']},
      z3:{x:201, y:botY, w:195, h:botH, color:'#27ae60', label:'Z3', blds:['oelraf2','sciencehub']},
    };
  } else {
    zones={
      z1:{x:4,   y:topY, w:138, h:topH, color:'#c0392b', label:'Z1', blds:['oelraf1','infozentrum']},
      z4:{x:4,   y:botY, w:138, h:botH, color:'#2980b9', label:'Z4', blds:['laz3','laz4']},
      z2:{x:258, y:topY, w:138, h:topH, color:'#e8a020', label:'Z2', blds:['laz1','laz2']},
      z3:{x:258, y:botY, w:138, h:botH, color:'#27ae60', label:'Z3', blds:['oelraf2','sciencehub']},
    };
    z5box={x:146, y:topY, w:108, h:topH+botH, color:'#7c3aed'};
  }

  // Dynamische Gesamthöhe
  const z5FooterH=0;
  const supH=hasSpringer?46:0;
  const H=mapY+mapH+8+z5FooterH+supH+40;

  let parts=[];
  // Bild + dunkles Overlay
  parts.push(`<image href="assets/ws_map_bg.jpg" x="0" y="${mapY}" width="${W}" height="${mapH}" preserveAspectRatio="none"/>`);
  parts.push(`<rect x="0" y="${mapY}" width="${W}" height="${mapH}" fill="rgba(0,0,0,0.12)"/>`);
  // Z5-Spalte (nur Phase 2)
  if(z5box){
    const {x,y,w,h,color}=z5box;
    parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(124,58,237,0.28)" stroke="${color}" stroke-width="2" rx="6"/>`);
    parts.push(`<text x="${x+w/2}" y="${y+18}" text-anchor="middle" font-size="${FS.z5lbl}" font-weight="800" fill="${color}" font-family="Arial" stroke="#fff" stroke-width="2.5" paint-order="stroke">Z5</text>`);
    const z5entries=[...(L.ass||[]).map(n=>({n,r:'Silo'})),...(L.ars||[]).map(n=>({n,r:'Ars'})),...(L.sold||[]).map(n=>({n,r:'Söld'}))];
    let z5yo=y+34;
    z5entries.forEach(({n,r})=>{
      if(z5yo>y+h-8)return;
      parts.push(`<text x="${x+w/2}" y="${z5yo}" text-anchor="middle" font-size="${FS.z5entry}" fill="${color}" font-family="Arial" stroke="#fff" stroke-width="1.5" paint-order="stroke">${r}: ${trunc(n)}</text>`);
      z5yo+=15;
    });
  }

  // Zonen-Overlays
  Object.entries(zones).forEach(([zk,z])=>{
    parts.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${BOX_FILL}" stroke="${z.color}" stroke-width="1.5" rx="5"/>`);
    parts.push(`<text x="${z.x+5}" y="${z.y+16}" font-size="${FS.zone}" font-weight="800" fill="${z.color}" font-family="Arial" stroke="#fff" stroke-width="2.5" paint-order="stroke">${z.label}</text>`);
    let yo=z.y+32;
    z.blds.forEach(bk=>{
      const meta=BLD_META[bk];
      const permForBld=phase===2
        ?allZonePlayers.filter(n=>(ba2[n]||ba[n])===bk)
        :(L[zk]||[]).filter(n=>(ba[n]||z.blds[0])===bk);
      const guestForBld=phase===1?z5All.filter(n=>_bz[ba[n]]===zk&&(ba[n]||z.blds[0])===bk):[];
      if(!permForBld.length&&!guestForBld.length)return;
      const sl=meta.label.replace('Feldlazarett','Laz').replace('Ölraffinerie','Öl').replace('Infozentrum','Info').replace('Science Hub','Sci');
      parts.push(`<text x="${z.x+5}" y="${yo}" font-size="${FS.bld}" font-weight="700" fill="${meta.color}" font-family="Arial" stroke="#fff" stroke-width="2.5" paint-order="stroke">${sl}</text>`);
      yo+=16;
      permForBld.forEach(n=>{
        if(yo>z.y+z.h-4)return;
        const isShifted=phase===2&&ba2[n]&&ba2[n]!==ba[n];
        parts.push(`<text x="${z.x+8}" y="${yo}" font-size="${FS.player}" fill="${isShifted?'#000':'#fff'}" font-family="Arial" stroke="${isShifted?'rgba(255,255,255,0.85)':'rgba(0,0,0,0.5)'}" stroke-width="2" paint-order="stroke">${isShifted?'↑ ':'• '}${trunc(n)}</text>`);
        yo+=16;
      });
      guestForBld.forEach(n=>{
        if(yo>z.y+z.h-4)return;
        parts.push(`<text x="${z.x+8}" y="${yo}" font-size="${FS.guest}" fill="#000" font-style="italic" font-family="Arial" stroke="rgba(255,255,255,0.85)" stroke-width="2" paint-order="stroke">⏱ ${trunc(n)} ${z5Short(n)}</text>`);
        yo+=15;
      });
      yo+=4;
    });
  });

  // Footer
  const footerY=mapY+mapH+8;
  parts.push(`<rect x="0" y="${footerY-8}" width="${W}" height="${H-footerY+8}" fill="#fff"/>`);
  let fy=footerY;



  // Springer (nur wenn vorhanden)
  if(hasSpringer){
    parts.push(`<text x="${W/2}" y="${fy+14}" text-anchor="middle" font-size="${FS.footer}" font-weight="700" fill="#7f8c8d" font-family="Arial">Springer / Sammler</text>`);
    parts.push(`<text x="${W/2}" y="${fy+28}" text-anchor="middle" font-size="${FS.z5entry}" fill="#2c3e50" font-family="Arial">${(L.sup||[]).map(trunc).join(', ')}</text>`);
    fy+=supH;
  }

  // Legende
  if(phase===2){
    parts.push(`<text x="${W/2}" y="${fy+15}" text-anchor="middle" font-size="${FS.legend}" font-weight="700" fill="#2c3e50" font-family="Arial">↑ = rückt in geräumtes Gebäude nach (Shift)</text>`);
  }
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block">${parts.join('')}</svg>`;
}
function wsZoneCards(t,phase){
  const L=getLineup(t);
  const ba=APP.bldAssign||{};
  const ba2=APP.bldAssignPh2||{};
  const BS={infozentrum:'Infozentrum',oelraf1:'Ölraf I',oelraf2:'Ölraf II',sciencehub:'Science Hub',laz1:'Laz I',laz2:'Laz II',laz3:'Laz III',laz4:'Laz IV'};
  const ZD=[{z:'z1',label:'Zone 1',color:'#c0392b',blds:['oelraf1','infozentrum']},{z:'z2',label:'Zone 2',color:'#e8a020',blds:['laz1','laz2']},{z:'z3',label:'Zone 3',color:'#27ae60',blds:['oelraf2','sciencehub']},{z:'z4',label:'Zone 4',color:'#2980b9',blds:['laz3','laz4']}];
  // Nur Spieler dieses Teams berücksichtigen
  const teamPl=new Set([...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[]),...(L.ass||[]),...(L.ars||[]),...(L.sold||[]),...(L.sup||[])]);
  const assSet=new Set(L.ass||[]),arsSet=new Set(L.ars||[]),soldSet=new Set(L.sold||[]);
  const isZ5=n=>assSet.has(n)||arsSet.has(n)||soldSet.has(n);
  if(phase===1){
    const boxes=ZD.map(z=>{
      const byBld={};z.blds.forEach(b=>byBld[b]=[]);
      Object.entries(ba).forEach(([n,b])=>{if(z.blds.includes(b)&&teamPl.has(n))byBld[b].push(n);});
      let rows='';
      z.blds.forEach(b=>{(byBld[b]||[]).forEach(n=>{const z5=isZ5(n);rows+=`<div style="padding:2px 0;font-size:11px"><span style="color:${z.color};font-weight:700">${BS[b]||b}:</span> ${n}${z5?` <span style="color:#7c3aed;font-size:9px;font-weight:800">⏱→Z5</span>`:''}</div>`;});});

    }).join('');
    return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${boxes}</div>`;
  } else {
    const boxes=ZD.map(z=>{
      const byBld={};z.blds.forEach(b=>byBld[b]=[]);
      Object.entries(ba2).forEach(([n,b])=>{if(z.blds.includes(b)&&teamPl.has(n))byBld[b].push(n);});
      let rows='';
      z.blds.forEach(b=>{(byBld[b]||[]).forEach(n=>{const shifted=ba[n]!==ba2[n];rows+=`<div style="padding:2px 0;font-size:11px${shifted?';background:#fff9c4;border-radius:3px;padding-left:3px':''}"><span style="color:${z.color};font-weight:700">${BS[b]||b}:</span> ${n}${shifted?` <span style="color:#e67e22;font-size:9px;font-weight:800">↑Shift</span>`:''}</div>`;});});
      if(!rows)rows='<div style="font-size:10px;color:#aaa">–</div>';
      return`<div style="border:2px solid ${z.color};border-radius:8px;padding:8px"><div style="font-weight:800;color:${z.color};font-size:12px;margin-bottom:4px">${z.label}</div>${rows}</div>`;
    }).join('');
    let z5rows='';
    (L.ass||[]).forEach(n=>z5rows+=`<div style="padding:2px 0;font-size:11px"><span style="color:#7c3aed;font-weight:700">Silo:</span> ${n}</div>`);
    (L.ars||[]).forEach(n=>z5rows+=`<div style="padding:2px 0;font-size:11px"><span style="color:#e67e22;font-weight:700">Arsenal:</span> ${n}</div>`);
    (L.sold||[]).forEach(n=>z5rows+=`<div style="padding:2px 0;font-size:11px"><span style="color:#e74c3c;font-weight:700">Söldner:</span> ${n}</div>`);
    const z5box=z5rows?`<div style="border:2px solid #7c3aed;border-radius:8px;padding:8px;background:#faf5ff;grid-column:1/-1"><div style="font-weight:800;color:#7c3aed;font-size:12px;margin-bottom:4px">Zone 5 (ab Min 10:00)</div>${z5rows}</div>`:'';
    return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${boxes}${z5box}</div>`;
  }
}

// Bild in die Fotos-App legen. navigator.share öffnet auf iPhone/iPad/Android das
// System-Sheet, dort steht "Bild sichern" bzw. "In Fotos sichern". Ohne Share-API
// (Desktop-Browser) bleibt es beim normalen Download — deshalb heißt der Fallback
// hier bewusst nicht "Fehler", sondern speichert einfach als Datei.
// build() liefert die Canvas und läuft erst nach dem Button-Feedback, sonst wirkt
// das Rendern der großen PNGs wie ein Hänger.
async function savePngToPhotos(build,filename,btn){
  const orig=btn?btn.textContent:'';
  const reset=()=>{if(btn){btn.textContent=orig;btn.disabled=false;}};
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  try{
    const c=await build();
    if(!c){reset();return;}
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const file=new File([blob],filename,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename.replace(/\.png$/,'')});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=filename;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    }
    if(btn){btn.textContent='✓ Gespeichert';setTimeout(reset,1800);}
  }catch(e){
    // AbortError = Nutzer hat das Share-Sheet abgebrochen, das ist kein Fehler.
    if(!e||e.name!=='AbortError')alert('Speichern fehlgeschlagen: '+((e&&e.message)||e));
    reset();
  }
}
// Prüft, ob eine Bildquelle wirklich lädt. Ein defektes Bild darf weder angezeigt
// noch als Allianz-Standard verteilt werden — sonst sieht die ganze Allianz nichts
// mehr, und das lässt sich von außen nicht mehr korrigieren.
function imgLoads(src){
  return new Promise(res=>{
    if(!src)return res(false);
    const i=new Image();
    i.onload=()=>res(i.naturalWidth>0);
    i.onerror=()=>res(false);
    i.src=src;
  });
}
async function _svgToPngCanvas(svgEl,scale){
  let xml=new XMLSerializer().serializeToString(svgEl);
  // Alle referenzierten Hintergrundbilder als Base64 einbetten (sonst rendert die Canvas sie nicht).
  for(const asset of ['assets/ws_map_bg.jpg','assets/cs_map_bg.png']){
    const ref=`href="${asset}"`;
    if(!xml.includes(ref))continue;
    try{
      const bgResp=await fetch(asset);
      const bgBlob=await bgResp.blob();
      const bgB64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(bgBlob);});
      xml=xml.split(ref).join(`href="${bgB64}"`);
    }catch(e){console.warn('Hintergrundbild nicht ladbar:',asset,e);}
  }
  const vb=svgEl.viewBox.baseVal;
  const img=new Image();
  await new Promise(res=>{img.onload=res;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);});
  const c=document.createElement('canvas');
  c.width=vb.width*scale;c.height=vb.height*scale;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#f8f9fc';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  return c;
}

  const ZD=[{label:'Zone 1',color:'#c0392b',blds:['oelraf1','infozentrum']},{label:'Zone 2',color:'#e8a020',blds:['laz1','laz2']},{label:'Zone 3',color:'#27ae60',blds:['oelraf2','sciencehub']},{label:'Zone 4',color:'#2980b9',blds:['laz3','laz4']}];

  }
  function cardH(entries){return hdrH+Math.max(1,entries.length)*lineH+innerPad;}
  const zData=ZD.map(zd=>({zd,entries:getEntries(zd)}));
  const rows=[[zData[0],zData[1]],[zData[3],zData[2]]];
  const rowH=rows.map(r=>Math.max(cardH(r[0].entries),cardH(r[1].entries)));
  const z5entries=[];
  if(phase===2){
    (L.ass||[]).forEach(n=>z5entries.push({n,role:'Silo',color:'#7c3aed'}));
    (L.ars||[]).forEach(n=>z5entries.push({n,role:'Arsenal',color:'#e67e22'}));
    (L.sold||[]).forEach(n=>z5entries.push({n,role:'Söldner',color:'#e74c3c'}));
  }
  const z5CardH=z5entries.length?hdrH+z5entries.length*lineH+innerPad+gap:0;
  const totalH=titleH+rowH.reduce((a,b)=>a+b,0)+(rows.length+1)*gap+z5CardH+gap;
  const c=document.createElement('canvas');c.width=W;c.height=totalH;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#f8f9fc';ctx.fillRect(0,0,W,totalH);
  function rr(x,y,w,h,r,fill,stroke,lw){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2*S;ctx.stroke();}
  }
  // Titel
  ctx.font=`800 ${titleFs}px Arial`;ctx.textAlign='center';
  ctx.fillStyle=phase===1?'#27ae60':'#7c3aed';
  ctx.fillText(`Team ${team} · ${team==='A'?'13:00':'22:00'} – `+trs('Phase '+phase+' Aufstellung'),W/2,titleH-10*S);
  ctx.textAlign='left';
  function drawCard(x,y,w,h,zd,entries){
    rr(x,y,w,h,8*S,'#fff',zd.color,2*S);
    ctx.font=`800 ${hdrFs}px Arial`;ctx.fillStyle=zd.color;ctx.fillText(trs(zd.label),x+innerPad,y+hdrH-5*S);
    let ey=y+hdrH;
    if(!entries.length){ctx.font=`${fs}px Arial`;ctx.fillStyle='#aaa';ctx.fillText('–',x+innerPad,ey+lineH-4*S);}
    else entries.forEach(({n,b,shifted})=>{
      if(shifted){ctx.fillStyle='#fffde7';ctx.fillRect(x+2*S,ey,w-4*S,lineH);}
      ctx.font=`700 ${fs}px Arial`;ctx.fillStyle=zd.color;
      const bl=trs(BS[b]||b)+': ';ctx.fillText(bl,x+innerPad,ey+lineH-4*S);
      const bw=ctx.measureText(bl).width;
      ctx.font=`${fs}px Arial`;ctx.fillStyle='#222';ctx.fillText(n,x+innerPad+bw,ey+lineH-4*S);
      const nw=ctx.measureText(n).width;
      if(phase===1&&isZ5(n)){ctx.font=`700 ${9*S}px Arial`;ctx.fillStyle='#7c3aed';ctx.fillText('⏱Z5',x+innerPad+bw+nw+3*S,ey+lineH-4*S);}
      else if(shifted){ctx.font=`700 ${9*S}px Arial`;ctx.fillStyle='#e67e22';ctx.fillText('↑',x+innerPad+bw+nw+3*S,ey+lineH-4*S);}
      ey+=lineH;
    });
  }
  let cy=titleH+gap;
  rows.forEach((row,ri)=>{
    const rh=rowH[ri];
    row.forEach(({zd,entries},ci)=>drawCard(pad+ci*(colW+gap),cy,colW,rh,zd,entries));
    cy+=rh+gap;
  });
  if(z5entries.length){
    const z5H=hdrH+z5entries.length*lineH+innerPad;
    rr(pad,cy,W-pad*2,z5H,8*S,'#faf5ff','#7c3aed',2*S);
    ctx.font=`800 ${hdrFs}px Arial`;ctx.fillStyle='#7c3aed';ctx.fillText(trs('Zone 5 (ab Min 10:00)'),pad+innerPad,cy+hdrH-5*S);
    let z5y=cy+hdrH;
    z5entries.forEach(({n,role,color})=>{
      ctx.font=`700 ${fs}px Arial`;ctx.fillStyle=color;
      const rl=trs(role)+': ';ctx.fillText(rl,pad+innerPad,z5y+lineH-4*S);
      const rlw=ctx.measureText(rl).width;
      ctx.font=`${fs}px Arial`;ctx.fillStyle='#222';ctx.fillText(n,pad+innerPad+rlw,z5y+lineH-4*S);
      z5y+=lineH;
    });
  }
  return c;
}
async function _buildWSMapCanvas(team,phase){
  const box=document.getElementById('ws-map-'+team+'-p'+phase);
  if(!box)return null;const svg=box.querySelector('svg');if(!svg)return null;
  return _svgToPngCanvas(svg,2);
}
async function _buildWSCombinedCanvas(team,phase){
  const mapC=await _buildWSMapCanvas(team,phase);
  if(!mapC)return null;
  const cardsC=_buildWSCardsCanvas(team,phase);
  const totalH=mapC.height+cardsC.height;
  const c=document.createElement('canvas');c.width=mapC.width;c.height=totalH;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#f8f9fc';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(mapC,0,0);ctx.drawImage(cardsC,0,mapC.height);
  return c;
}
async function downloadWSMapPng(team,phase){
  const c=await _buildWSMapCanvas(team,phase);
  if(!c)return;
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`warsync_team${team}_phase${phase}_karte.png`;a.click();
}
async function downloadWSCardsPng(team,phase){
  const c=_buildWSCardsCanvas(team,phase);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`warsync_team${team}_phase${phase}_aufstellung.png`;a.click();
}
async function downloadWSCombinedPng(team,phase){
  const c=await _buildWSCombinedCanvas(team,phase);
  if(!c)return;
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`warsync_team${team}_phase${phase}_komplett.png`;a.click();
}
// Fotos-Variante bekommt das komplette Bild (Karte + Aufstellungskarten) — das ist
// das, was man im Handy-Album wiederfinden will.
async function shareWSCombinedPng(team,phase,btn){
  await savePngToPhotos(()=>_buildWSCombinedCanvas(team,phase),`warsync_team${team}_phase${phase}_komplett.png`,btn);
}

function exportPlayersExcel(){
  if(typeof XLSX==='undefined'){alert('Excel-Bibliothek noch nicht geladen. Bitte kurz warten und nochmal versuchen.');return;}
  const all=APP.data.players;
  if(!all.length){alert('Keine Spielerdaten vorhanden.');return;}

  // Aktive Spieler zuerst, dann inaktive; innerhalb nach Rolle sortiert
  const sorted=[...all].sort((a,b)=>{
    const ia=isInactive(a.name),ib=isInactive(b.name);
    if(ia!==ib)return ia?1:-1;
    const rr=roleRank(b.role||'R3')-roleRank(a.role||'R3');
    return rr||a.name.localeCompare(b.name);
  });

  const rows=sorted.map(p=>({
    'Name':p.name,
    'Rolle':p.role||'R3',
    'Status':isInactive(p.name)?'Ausgetreten':'Aktiv',
    'Beruf':p.profession||'',
    'Beruf-Level':p.profession_level||'',
    'Kills':p.kills||'',
    'Beliebtheit':p.popularity||'',
    'T1 (Mio.)':p.t1||'',
    'T2 (Mio.)':p.t2||'',
    'T3 (Mio.)':p.t3||'',
    'T4 (Mio.)':p.t4||'',
    'Gesamtkampfkraft':p.total_power||'',
    'Gesamtkraft der Helden (Mio.)':p.hero_power?p.hero_power/1e6:'',
    'T1 zuletzt aktualisiert':p.t1_updated_at?p.t1_updated_at.slice(0,10):'',
  }));

  const ws=XLSX.utils.json_to_sheet(rows);

  // Auto column widths
  const colWidths=Object.keys(rows[0]).map(k=>({wch:Math.max(k.length,12)}));
  ws['!cols']=colWidths;

  // Style header row bold (basic)
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let C=range.s.c;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(!ws[addr])continue;
    ws[addr].s={font:{bold:true},fill:{fgColor:{rgb:'2C3E6B'}},};
  }

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Spielerprofile');

  const date=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`warsync_spieler_${date}.xlsx`);

  const info=document.getElementById('export-info');
  if(info){info.style.display='block';info.textContent=`✓ ${rows.length} Spieler exportiert (${sorted.filter(p=>!isInactive(p.name)).length} aktiv, ${sorted.filter(p=>isInactive(p.name)).length} ausgetreten)`;}
}

async function adminMergePlayers(){
  const src=document.getElementById('merge-src')?.value;
  const dst=document.getElementById('merge-dst')?.value;
  const res=document.getElementById('merge-result');
  const btn=document.getElementById('merge-btn');
  function showRes(msg,ok){if(res){res.style.display='block';res.style.background=ok?'#eafaf1':'#fdecea';res.style.color=ok?'var(--win)':'var(--loss)';res.innerHTML=msg;}}
  if(!src||!dst){showRes('Bitte beide Spieler auswählen.',false);return;}
  if(src===dst){showRes('Quelle und Ziel sind identisch.',false);return;}
  if(!confirm(`"${src}" → "${dst}" zusammenführen?\n\nAlle Daten von "${src}" werden auf "${dst}" übertragen, dann wird "${src}" gelöscht.`))return;
  if(btn){btn.textContent='Läuft…';btn.disabled=true;}
  try{
    const srcE=encodeURIComponent(src),dstE=encodeURIComponent(dst);
    // ws_participation
    const wpR=await fetch(SB+'/rest/v1/ws_participation?player_name=eq.'+srcE,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({player_name:dst})});
    if(!wpR.ok)throw new Error('ws_participation: '+await wpR.text());
    // vs_entries
    const veR=await fetch(SB+'/rest/v1/vs_entries?player_name=eq.'+srcE,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({player_name:dst})});
    if(!veR.ok)throw new Error('vs_entries: '+await veR.text());
    // ws_player_history
    await fetch(SB+'/rest/v1/ws_player_history?player_name=eq.'+srcE,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({player_name:dst})});
    // ws_players löschen
    const delR=await fetch(SB+'/rest/v1/ws_players?name=eq.'+srcE,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
    if(!delR.ok)throw new Error('Löschen: '+await delR.text());
    APP.data.players=await sbGet('ws_players?order=name.asc&select=name,role,access_enabled,password_hash');
    showRes(`✓ "${src}" wurde mit "${dst}" vereint und gelöscht.`,true);
    setTimeout(()=>renderPage(),1500);
  }catch(e){showRes('Fehler: '+e.message,false);}
  if(btn){btn.textContent='🔀 Zusammenführen';btn.disabled=false;}
}

async function admAnalyzeMembers(){
  const files=document.getElementById('adm-mem-shots')?.files;
  if(!files||!files.length){alert('Bitte zuerst Screenshots auswählen.');return;}
  const btn=document.getElementById('adm-mem-btn');
  const statusEl=document.getElementById('adm-mem-status');
  const resultEl=document.getElementById('adm-mem-result');
  if(btn){btn.disabled=true;btn.textContent='⏳ Analysiere…';}
  if(statusEl)statusEl.textContent='';
  if(resultEl)resultEl.innerHTML='';
  try{
    const images=await Promise.all(Array.from(files).map(f=>new Promise((res,rej)=>{
      const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);
    })));
    const knownPlayers=APP.data.players.map(p=>p.name);
    const resp=await fetch(VISION_URL()+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,known_players:knownPlayers})});
    if(!resp.ok)throw new Error(`Vision-Server: HTTP ${resp.status}`);
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    const detected=new Set((data.players||[]).map(p=>{
      const n=p.name||'';
      return n.replace(/^\[[^\]]+\]\s*/,'').replace(/\s*\[[^\]]+\]$/,'').trim();
    }).filter(Boolean));
    // Vergleich mit aktiven DB-Spielern
    const activePlayers=APP.data.players.filter(p=>p.active!==false);
    const activeNames=new Set(activePlayers.map(p=>p.name));
    // Neu: in Screenshots, nicht in DB
    const neuList=[...detected].filter(n=>!APP.data.players.find(p=>p.name===n));
    // Rückkehrer: in Screenshots, aber in DB als inaktiv geführt
    const backList=APP.data.players.filter(p=>p.active===false&&detected.has(p.name));
    // Nicht mehr gesehen: aktiv in DB, nicht in Screenshots
    const weggList=activePlayers.filter(p=>!detected.has(p.name));
    if(resultEl)resultEl.innerHTML=admMemDiffHtml(detected.size,neuList,weggList,backList);
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--win)">✓ ${detected.size} Spieler erkannt</span>`;
  }catch(e){
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--loss)">❌ ${e.message}</span>`;
  }
  if(btn){btn.disabled=false;btn.textContent='🔍 Analysieren';}
}

    if(!byDate[r.recorded_at]){byDate[r.recorded_at]=[];dates.push(r.recorded_at);}
    byDate[r.recorded_at].push(r);
    if(r.player_name)playerSet.add(r.player_name);
  }
  dates.sort((a,b)=>b.localeCompare(a));
  _rkData={dates,byDate,players:[...playerSet].sort()};
  return _rkData;
}

async function pageRankings(el){
  el.innerHTML=`<div class="loader"><span class="spin"></span>Lade Rankings…</div>`;
  let data;
  try{data=await loadRankingsData();}
  catch(e){el.innerHTML=`<div class="loader" style="color:var(--loss)">Fehler: ${e.message}</div>`;return;}

  if(!data.dates.length){
    el.innerHTML=`<div class="card"><div class="ch">Ranglisten</div><div style="padding:20px;text-align:center;color:var(--tx3)">Noch keine Daten.<br><br>Der Collector läuft täglich um 13:30 Uhr automatisch.</div></div>`;
    return;
  }

  if(!_rkChartPlayers)_rkChartPlayers=new Set(data.players.slice(0,5));

  const latestDate=data.dates[0];
  const latest=data.byDate[latestDate]||[];
  const TABS=[
    {k:'kampfkraft',         rk:'list_rank_kampfkraft',          label:'Kampfkraft',        fmt:v=>v?(v/1e6).toFixed(2)+'M':'-'},
    {k:'kills',              rk:'list_rank_kills',                label:'Kills',             fmt:v=>v?v.toLocaleString('de'):'-'},
    {k:'spende_taeglich',    rk:'list_rank_spende_taeglich',      label:'Spende Tägl.',      fmt:v=>v?v.toLocaleString('de'):'-'},
    {k:'spende_woechentlich',rk:'list_rank_spende_woechentlich',  label:'Spende Wöch.',      fmt:v=>v?v.toLocaleString('de'):'-'},
  ];
  const tab=TABS.find(t=>t.k===_rkTab)||TABS[0];
  const sorted=[...latest].filter(r=>r[tab.rk]!=null).sort((a,b)=>(a[tab.rk]||999)-(b[tab.rk]||999));
  const chronoDates=[...data.dates].sort();
  const COLORS=['#2980b9','#27ae60','#e8a020','#9b59b6','#e74c3c','#1abc9c','#f39c12','#8e44ad','#c0392b','#16a085'];

  function renderTrend(){
    if(chronoDates.length<2)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Mindestens 2 Tage Daten nötig.</div>`;
    const sel=data.players.filter(p=>_rkChartPlayers.has(p));
    if(!sel.length)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Wähle unten Spieler aus.</div>`;
    const series=sel.map((name,i)=>({name,color:COLORS[i%COLORS.length],pts:chronoDates.map(d=>{const rec=(data.byDate[d]||[]).find(r=>r.player_name===name);return rec?rec[tab.k]:null;})}));
    const allV=series.flatMap(s=>s.pts.filter(v=>v!=null));
    if(!allV.length)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Keine Daten für Auswahl.</div>`;
    const maxV=Math.max(...allV),minV=Math.min(...allV),range=maxV-minV||1;
    const W=360,H=140,PAD=8,BOTT=22,LEFT=10;
    const xS=(W-PAD-LEFT)/(chronoDates.length-1||1),yS=(H-PAD-BOTT)/range;
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
    for(let i=0;i<=4;i++){
      const y=PAD+(H-PAD-BOTT)*(1-i/4),val=minV+range*i/4;
      const lbl=tab.k==='kampfkraft'?(val/1e6).toFixed(1)+'M':Math.round(val).toLocaleString('de');
      svg+=`<line x1="${LEFT}" y1="${y}" x2="${W-PAD}" y2="${y}" stroke="#e2e6f0" stroke-width="1"/>`;
      svg+=`<text x="${LEFT}" y="${y-2}" font-size="7" fill="#8892a4">${lbl}</text>`;
    }
    series.forEach(s=>{
      const vpts=[];
      s.pts.forEach((v,i)=>{
        if(v==null)return;
        const x=LEFT+i*xS,y=H-BOTT-(v-minV)*yS;
        vpts.push(`${x},${y}`);
        svg+=`<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"><title>${s.name}: ${tab.fmt(v)} · ${chronoDates[i]}</title></circle>`;
      });
      if(vpts.length>1)svg+=`<polyline points="${vpts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    });
    const step=Math.max(1,Math.floor(chronoDates.length/4));
    chronoDates.forEach((d,i)=>{if(i%step!==0&&i!==chronoDates.length-1)return;svg+=`<text x="${LEFT+i*xS}" y="${H-5}" font-size="7" fill="#8892a4" text-anchor="middle">${d.slice(5)}</text>`;});
    svg+=`</svg>`;
    const legend=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;cursor:pointer" onclick="rkTogglePlayer('${s.name.replace(/'/g,"\\'")}')"><span style="width:14px;height:3px;background:${s.color};display:inline-block;border-radius:2px"></span>${s.name}</span>`).join('');
    return`<div style="padding:10px">${svg}<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${legend}</div></div>`;
  }

  function rkRoleBadge(r){
    if(!r)return'';
    const c={R5:'#e74c3c',R4:'#e8a020',R3:'#2980b9',R2:'#27ae60',R1:'#95a5a6'}[r]||'#bbb';
    return`<span style="font-size:10px;font-weight:800;color:#fff;background:${c};padding:2px 5px;border-radius:4px;margin-right:5px">${r}</span>`;
  }

  const listRows=sorted.slice(0,30).map(r=>{
    const rank=r[tab.rk],val=r[tab.k];
    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    return`<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd)">
      <div style="width:28px;text-align:center;font-size:13px;font-weight:800;color:${rank<=3?'var(--primary)':'var(--tx3)'};flex-shrink:0">${medal||rank}</div>
      <div style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rkRoleBadge(r.alliance_rank)}${r.player_name}</div>
      <div style="font-size:13px;font-weight:700;color:var(--primary);flex-shrink:0">${tab.fmt(val)}</div>
    </div>`;
  }).join('');

  const playerBtns=data.players.map(name=>{
    const on=_rkChartPlayers.has(name);
    return`<button onclick="rkTogglePlayer('${name.replace(/'/g,"\\'")}'" style="font-size:11px;padding:4px 9px;border-radius:6px;border:1.5px solid ${on?'var(--primary)':'var(--bd)'};background:${on?'var(--primary)':'var(--card)'};color:${on?'#fff':'var(--tx2)'};cursor:pointer;font-family:inherit;font-weight:600">${name}</button>`;
  }).join('');

  el.innerHTML=`
  <div class="card" style="margin-bottom:10px">
    <div class="stabs" style="margin-bottom:8px">${TABS.map(t=>`<button class="stab${_rkTab===t.k?' on':''}" onclick="rkSetTab('${t.k}')">${t.label}</button>`).join('')}</div>
    <div style="font-size:11px;color:var(--tx3);padding:0 12px 8px">Stand: ${latestDate} · ${sorted.length} Spieler</div>
    <div>${listRows||'<div style="padding:20px;text-align:center;color:var(--tx3)">Keine Daten für diesen Tab.</div>'}</div>
  </div>

  <div class="card" style="margin-bottom:10px">
    <div class="ch">Verlauf <span class="ch-sub">${chronoDates.length} Tage · ${tab.label}</span></div>
    ${renderTrend()}
  </div>

  <div class="card">
    <div class="ch">Spieler im Diagramm</div>
    <div style="padding:10px;display:flex;flex-wrap:wrap;gap:6px">${playerBtns}</div>
  </div>`;
}

function rkSetTab(t){_rkTab=t;_rkData=null;const el=document.getElementById('pc');if(el)pageRankings(el);}
function rkTogglePlayer(name){
  if(_rkChartPlayers.has(name))_rkChartPlayers.delete(name);else _rkChartPlayers.add(name);
  const el=document.getElementById('pc');if(el)pageRankings(el);
}

// ====== INIT ======
document.documentElement.lang=LANG;
render();
i18nStart();
</script>
</body>
</html>
