<!DOCTYPE html>
<html lang="de">

<title>WarSync Stats · AR1S</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#1a1d2e;min-height:100vh;padding-bottom:72px}
button{font-family:inherit;cursor:pointer;transition:all .15s;border:none;background:none}
table{border-collapse:collapse;width:100%}
input,textarea,select{font-family:inherit;outline:none}
:root{
  --bg:#f5f6fa;--card:#fff;--primary:#2c3e6b;--pri-l:#eef1f8;--acc:#e8a020;--acc-l:#fef6e6;
  --win:#27ae60;--win-l:#eafaf1;--loss:#c0392b;--loss-l:#fdedec;
  --tx:#1a1d2e;--tx2:#5a6278;--tx3:#8892a4;--bd:#e2e6f0;--bd2:#c8cfe0;
  --oil:#c0392b;--oil-l:#fff0f0;--med:#2980b9;--med-l:#eaf4fb;--silo:#e8a020;--ass:#7c3aed;--ass-l:#f5f0ff;
}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

.hd{background:var(--primary);color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(44,62,107,.18)}
.hd-title{font-size:17px;font-weight:800}.hd-sub{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.06em}
.hd-r{display:flex;align-items:center;gap:8px}
.role-pill{background:rgba(255,255,255,.15);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--win);flex-shrink:0}
.sync-dot.err{background:var(--loss)}.sync-dot.wait{background:var(--acc);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:100;box-shadow:0 -2px 14px rgba(0,0,0,.07)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px;font-size:10px;color:var(--tx3);font-weight:500;gap:3px;cursor:pointer;border:none;background:none;font-family:inherit}
.bni.on{color:var(--primary)}.bni svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor}
.main{max-width:600px;margin:0 auto;padding:14px 14px 8px}

/* LOGIN */
.login-wrap{min-height:100vh;padding-bottom:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--primary)}
.login-card{background:#fff;border-radius:22px;padding:30px 22px;width:100%;max-width:360px;box-shadow:0 8px 48px rgba(0,0,0,.22)}
.login-icon{width:62px;height:62px;background:var(--primary);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.login-icon svg{width:34px;height:34px;stroke:#fff;stroke-width:1.8;fill:none}
.login-title{font-size:22px;font-weight:800;color:var(--primary);text-align:center}
.login-sub{font-size:13px;color:var(--tx3);text-align:center;margin:4px 0 22px}
.fl label{font-size:11px;font-weight:700;color:var(--tx2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fl{margin-bottom:14px}
.inp{width:100%;padding:12px 13px;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;color:var(--tx);background:#fff;transition:border-color .15s}
.inp:focus{border-color:var(--primary)}
.btn-pri{width:100%;padding:14px;background:var(--primary);color:#fff;border-radius:10px;font-size:15px;font-weight:700;margin-top:6px;cursor:pointer;border:none}
.demo-sep{margin-top:20px;padding-top:16px;border-top:1px solid var(--bd);text-align:center;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.demo-btn{width:100%;padding:10px 13px;border:1.5px solid var(--bd);border-radius:10px;text-align:left;cursor:pointer;background:#fff;margin-bottom:7px;font-family:inherit}
.demo-btn:hover,.demo-btn:active{border-color:var(--primary);background:var(--pri-l)}
.demo-btn-name{font-size:13px;font-weight:700;color:var(--tx)}.demo-btn-desc{font-size:11px;color:var(--tx3);margin-top:2px}

.card{background:var(--card);border-radius:14px;border:1px solid var(--bd);overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ch{padding:12px 15px;border-bottom:1px solid var(--bd);font-weight:700;font-size:14px;color:var(--tx);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch-sub{font-size:11px;color:var(--tx3);font-weight:400}
.cb{padding:14px}

.stabs{display:flex;gap:3px;margin-bottom:14px;background:var(--pri-l);border-radius:10px;padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.stab{padding:7px 12px;font-size:13px;border-radius:7px;font-weight:600;color:var(--tx2);white-space:nowrap;border:none;background:none;cursor:pointer;font-family:inherit;flex-shrink:0}
.stab.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}

.ttabs{display:flex;gap:8px;margin-bottom:14px}
.ttab{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;border:2px solid var(--bd);background:var(--card);color:var(--tx3);cursor:pointer;text-align:center;font-family:inherit}
.ttab.on-a{border-color:var(--win);color:var(--win);background:var(--win-l)}
.ttab.on-b{border-color:#2980b9;color:#2980b9;background:#eaf3fb}

.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px}
.sb-l{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600}
.sb-v{font-size:22px;font-weight:800;color:var(--tx)}.sb-s{font-size:11px;color:var(--tx3);margin-top:2px}

.rbanner{border-radius:14px;padding:16px;margin-bottom:12px;border:1.5px solid}
.rbanner.win{background:var(--win-l);border-color:#a9dfbf}.rbanner.loss{background:var(--loss-l);border-color:#f5b7b1}.rbanner.pend{background:var(--acc-l);border-color:#f9e0a8}
.rb-date{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.rb-res{font-size:26px;font-weight:800}.rb-res.win{color:var(--win)}.rb-res.loss{color:var(--loss)}.rb-res.pend{color:var(--acc)}
.score-row{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.sc-block{text-align:center}.sc-name{font-size:10px;color:var(--tx3);text-transform:uppercase;margin-bottom:2px}.sc-pts{font-size:20px;font-weight:800}.sc-vs{font-size:12px;color:var(--tx3);font-weight:700}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
th{font-size:11px;color:var(--tx3);font-weight:600;padding:9px 11px;text-align:left;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.05em;background:#f8f9fc;white-space:nowrap}
td{font-size:13px;padding:9px 11px;border-bottom:1px solid var(--bd);vertical-align:middle;color:var(--tx)}
tr:last-child td{border-bottom:none}

.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block;white-space:nowrap}
.bar-w{display:flex;align-items:center;gap:6px}.bar-bg{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden;min-width:40px}.bar-f{height:100%;border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}.dot-row{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.wh{display:flex;gap:5px;flex-wrap:wrap}.wh-d{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}

/* ZONE CARDS */
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.zc{border-radius:12px;padding:12px;border:2px solid transparent;transition:all .2s;position:relative}
.zc.oil{background:var(--oil-l);border-color:#c0392b33}.zc.med{background:var(--med-l);border-color:#2980b933}
.zc.silo{background:var(--acc-l);border-color:#e8a02044;grid-column:1/-1}.zc.ass{background:var(--ass-l);border-color:#7c3aed33}.zc.sup{background:#f0f4f8;border-color:#8892a433}
.zc.drop-target{border-color:var(--primary);border-style:dashed;transform:scale(1.01)}
.zc-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.zc-name{font-size:12px;font-weight:800}.zc-pts{font-size:10px;color:var(--tx3);margin-top:1px}
.zc-count{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}

/* PLAYER CHIPS */
.player-chip{background:#fff;border-radius:8px;padding:7px 10px;margin-bottom:4px;font-size:12px;font-weight:600;border:1.5px solid rgba(0,0,0,.09);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:all .15s;touch-action:none;user-select:none}
.player-chip:hover{border-color:var(--primary);background:var(--pri-l)}
.player-chip.selected{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(44,62,107,.25)}
.player-chip.dragging{opacity:.4}
.chip-t1{font-size:10px;opacity:.6;white-space:nowrap}
.zc-empty{font-size:11px;color:var(--tx3);font-style:italic;padding:6px 0;text-align:center;border:1.5px dashed var(--bd2);border-radius:6px;margin-bottom:4px}

/* WEIGHT INPUTS */
.weight-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.weight-label{font-size:12px;font-weight:600;flex:1;min-width:0}
.weight-inp{width:54px;padding:5px 8px;border:1.5px solid var(--bd);border-radius:8px;font-size:13px;font-weight:700;text-align:center;color:var(--tx)}
.weight-inp:focus{border-color:var(--primary)}
.weight-bar{flex:2;height:6px;background:var(--bd);border-radius:3px;overflow:hidden;min-width:40px}
.weight-bar-f{height:100%;border-radius:3px;transition:width .3s}
.weight-pct{font-size:11px;color:var(--tx3);min-width:30px;text-align:right}

/* SLOT INPUT */
.slot-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.slot-label{font-size:12px;color:var(--tx2);flex:1}
.slot-btns{display:flex;align-items:center;gap:4px}
.slot-btn{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--bd);background:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;color:var(--primary)}
.slot-num{font-size:15px;font-weight:800;min-width:20px;text-align:center;color:var(--tx)}

.note{background:var(--acc-l);border:1px solid #f9e0a8;border-left:3px solid var(--acc);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--tx2);margin-bottom:12px}
.note.info{background:var(--pri-l);border-color:#c5d0e8;border-left-color:var(--primary);color:var(--primary)}
.note.ok{background:var(--win-l);border-color:#a9dfbf;border-left-color:var(--win);color:#1a6b3a}

.loader{text-align:center;padding:48px;color:var(--tx3);font-size:14px}
.spin{display:inline-block;width:22px;height:22px;border:2px solid var(--bd2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-out{background:#fff;border:1.5px solid var(--bd);color:var(--tx2)}
.btn-sol{background:var(--primary);color:#fff}.btn-sol:active{opacity:.9}
.btn-ok{background:var(--win-l);color:var(--win);border:1.5px solid #a9dfbf}
.btn-no{background:var(--loss-l);color:var(--loss);border:1.5px solid #f5b7b1}
.btn-acc{background:var(--acc-l);color:var(--acc);border:1.5px solid #f9e0a8}

.fi{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;color:var(--tx);background:#fff;transition:border-color .15s}
.fi:focus{border-color:var(--primary)}
.fl2{margin-bottom:12px}.fl2 label{font-size:11px;color:var(--tx3);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}

.upl{border:2px dashed var(--bd2);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#fff;margin-bottom:12px}
.upl:hover,.upl:active{border-color:var(--primary);background:var(--pri-l)}
.upl svg{width:30px;height:30px;stroke:var(--tx3);stroke-width:1.5;margin-bottom:8px;fill:none}
.upl-t{font-size:14px;font-weight:700;color:var(--tx2)}.upl-s{font-size:12px;color:var(--tx3);margin-top:3px}

.kk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kk-box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px}
.kk-l{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;font-weight:600}.kk-v{font-size:16px;font-weight:800;color:var(--tx)}

.mi{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.mi:last-child{border-bottom:none}
.mav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;background:var(--pri-l);color:var(--primary)}
.mn{font-size:14px;font-weight:700}.mm{font-size:11px;color:var(--tx3);margin-top:2px}
.mr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.qc:active{transform:scale(.97)}
.qc-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.qc-ico svg{width:21px;height:21px;stroke-width:2;fill:none;stroke:currentColor}
.qc-t{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:2px}.qc-s{font-size:11px;color:var(--tx3)}

.cs{text-align:center;padding:60px 24px}.cs-ico{font-size:48px;margin-bottom:16px}
.cs-t{font-size:18px;font-weight:800;color:var(--tx);margin-bottom:8px}.cs-s{font-size:14px;color:var(--tx3)}

/* MOVE HINT */
.move-hint{text-align:center;padding:10px;font-size:12px;color:var(--primary);font-weight:700;background:var(--pri-l);border-radius:8px;margin-bottom:8px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
</style>

async function sbGet(p){const r=await fetch(SB+'/rest/v1/'+p,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPost(t,d){const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r;}
async function sbPatch(t,q,d){const r=await fetch(SB+'/rest/v1/'+t+'?'+q,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r;}
async function sbDelete(t,q){const r=await fetch(SB+'/rest/v1/'+t+'?'+q,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});if(!r.ok)throw new Error(await r.text());return r;}
async function sbUpsert(t,d,onConflict){const url=SB+'/rest/v1/'+t+(onConflict?'?on_conflict='+encodeURIComponent(onConflict):'');const r=await fetch(url,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r;}

// ====== AUTH ======
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin(){
  const name=(document.getElementById('lu')?.value||'').trim();
  const pw=document.getElementById('lp')?.value||'';
  if(!name||!pw){showLoginErr('Bitte Name und Passwort eingeben.');return;}
  const btn=document.getElementById('login-btn');
  if(btn){btn.textContent='Anmelden…';btn.disabled=true;}
  try{
    const hash=await sha256(pw);
    // ilike = case-insensitive name match
    const rows=await sbGet('ws_players?name=ilike.'+encodeURIComponent(name)+'&select=name,role,ws_admin,profile_edit,password_hash,access_enabled,can_reset_password');
    if(!rows||!rows.length){showLoginErr('Spieler „'+name+'" nicht gefunden.');if(btn){btn.textContent='Anmelden';btn.disabled=false;}return;}
    const pl=rows[0];
    if(!pl.access_enabled){showLoginErr('Kein Zugang — wende dich an den Admin.');if(btn){btn.textContent='Anmelden';btn.disabled=false;}return;}
    if(!pl.password_hash){showLoginErr('Kein Passwort gesetzt — Admin muss zuerst eines vergeben.');if(btn){btn.textContent='Anmelden';btn.disabled=false;}return;}
    if(pl.password_hash!==hash){showLoginErr('Falsches Passwort.');if(btn){btn.textContent='Anmelden';btn.disabled=false;}return;}
    const roleMap={R5:'r5',R4:'r4',R3:'r3',R2:'r2',R1:'r1'};
    const isSuperAdmin=pl.name==='Ben_the_men';
    APP.user={
      username:pl.name.toLowerCase().replace(/\s/g,'_'),
      playerName:pl.name,
      role:isSuperAdmin?'superadmin':(roleMap[pl.role]||'r3'),
      ws_admin:pl.ws_admin||false,
      profile_edit:pl.profile_edit||false,
      can_reset_password:pl.can_reset_password||false,
    };
    renderShell();loadData();
  }catch(e){showLoginErr('Fehler: '+e.message);if(btn){btn.textContent='Anmelden';btn.disabled=false;}}
}
function showLoginErr(msg){
  const el=document.getElementById('login-err');
  if(el){el.textContent=msg;el.style.display='block';}
}

async function loadData(){
  setSyncDot('wait');
  try{
    const[ev,pa,pl,hist,vsw,vse]=await Promise.all([
      sbGet('ws_events?order=event_date.desc,team.asc'),
      sbGet('ws_participation?order=rank.asc'),
      sbGet('ws_players?order=t1.desc.nullslast&select=*,access_enabled,password_hash'),
      sbGet('ws_player_history?order=recorded_at.desc&limit=500'),
      sbGet('vs_weeks?order=week_start.desc'),
      sbGet('vs_entries?order=pts.desc'),
    ]);
    APP.data={events:ev,participation:pa,players:pl,vsWeeks:vsw,vsEntries:vse};
    // Index history by player_name
    APP.playerHistory={};
    hist.forEach(h=>{
      if(!APP.playerHistory[h.player_name])APP.playerHistory[h.player_name]=[];
      APP.playerHistory[h.player_name].push(h);
    });
    APP.synced=true;APP.syncErr=false;setSyncDot('ok');
    loadWSState();
    if(!APP.accepted.length)APP.accepted=pl.map(p=>p.name);
    renderPage();
  }catch(err){APP.syncErr=true;setSyncDot('err');console.error(err);renderPage();}
}
function setSyncDot(s){const d=document.getElementById('sd');if(d)d.className='sync-dot'+(s==='err'?' err':s==='wait'?' wait':'');}

// ====== HELPERS ======
function fmt(n){return n?Number(n).toLocaleString('de-DE'):'–';}
function fmtMio(n){if(!n&&n!==0)return'–';const m=n/1000000;return m.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' Mio';}
function badge(t,c){return`<span class="badge" style="background:${c}22;color:${c}">${t}</span>`;}
function roleBadge(r){return badge(ROLES[r]||r,ROLE_C[r]||'#8892a4');}
function canAccess(f){
  const u=APP.user;if(!u)return false;if(u.role==='superadmin')return true;
  if(f==='ws')return u.role==='r5'||u.role==='r4';
  if(f==='ws_admin'){
    // WS-Admin: superadmin oder Spieler mit ws_admin=true in DB
    const pl=APP.data.players.find(p=>p.name===u.playerName);
    return u.role==='r5'||(pl&&pl.ws_admin);
  }
  if(f==='profile_edit'){
    // Profil bearbeiten: superadmin, r5, oder Spieler mit profile_edit=true
    const pl=APP.data.players.find(p=>p.name===u.playerName);
    return u.role==='r5'||(pl&&pl.profile_edit);
  }
  if(f==='allianz')return u.role==='r5'||u.role==='r4';
  if(f==='umfragen')return u.role==='r5'||u.role==='r4';
  if(f==='admin')return u.role==='superadmin';
  return true;
}
function reliability(name){const p=APP.data.participation.filter(x=>{const ev=APP.data.events.find(e=>e.id===x.event_id);return ev&&x.player_name===name;});if(!p.length)return null;return Math.round(p.filter(x=>x.played).length/p.length*100);}
function relColor(pct){if(pct===null)return'var(--tx3)';if(pct>=80)return'var(--win)';if(pct>=50)return'var(--acc)';return'var(--loss)';}
function avgPts(name){const p=APP.data.participation.filter(x=>x.player_name===name&&x.played&&x.individual_pts);if(!p.length)return 0;return Math.round(p.reduce((s,x)=>s+(x.individual_pts||0),0)/p.length);}
function getT1(name){return parseFloat(APP.data.players.find(p=>p.name===name)?.t1)||0;}
function fmtK(n){if(!n)return'–';if(n>=1000000)return(n/1000000).toLocaleString('de-DE',{maximumFractionDigits:1})+'M';if(n>=1000)return Math.round(n/1000)+'K';return String(n);}
function roleRank(r){return{R5:5,R4:4,R3:3,R2:2,R1:1}[r]||2;}
function rankBadge(r){const c={R5:'#f39c12',R4:'#9b59b6',R3:'#7f8c8d',R2:'#95a5a6',R1:'#bdc3c7'}[r||'R3']||'#7f8c8d';return`<span style="font-size:10px;font-weight:800;color:${c};background:${c}22;padding:2px 6px;border-radius:4px;flex-shrink:0">${r||'R3'}</span>`;}
function sortPlayers(list){
  const s=APP.playerSort;
  return[...list].sort((a,b)=>{
    const ai=isInactive(a.name),bi=isInactive(b.name);
    if(ai!==bi)return ai?1:-1; // inactive always last
    // Primary: role rank descending
    const rra=roleRank(a.role),rrb=roleRank(b.role);
    if(rra!==rrb)return rrb-rra;
    // Secondary: selected sort
    if(s==='t1')return(parseFloat(b.t1)||0)-(parseFloat(a.t1)||0);
    if(s==='kills')return(b.kills||0)-(a.kills||0);
    if(s==='popularity')return(b.popularity||0)-(a.popularity||0);
    if(s==='profession_level')return(b.profession_level||0)-(a.profession_level||0);
    if(s==='reliability'){const ra=reliability(a.name)??-1,rb=reliability(b.name)??-1;return rb-ra;}
    return a.name.localeCompare(b.name);
  });
}
function getLineup(t){return t==='B'?APP.lineupB:APP.lineupA;}
function setLineup(t,v){if(t==='B')APP.lineupB=v;else APP.lineupA=v;}
function getBldSlots(t){return (t||APP.team)==='B'?APP.bldSlotsB:APP.bldSlotsA;}
// Zone-Slots werden aus bldSlots ABGELEITET — Summe der Gebäude in der Zone bzw. das einzelne Phase-2-Gebäude.
function getZoneSlots(t){
  const bs=getBldSlots(t);
  return {
    ass:bs.silo||0,
    ars:bs.arsenal||0,
    sold:bs.soeldner||0,
    sup:bs.oelquellen||0,
    z1:(bs.oelraf1||0)+(bs.infozentrum||0),
    z2:(bs.laz2||0)+(bs.laz4||0),
    z3:(bs.oelraf2||0)+(bs.sciencehub||0),
    z4:(bs.laz1||0)+(bs.laz3||0),
  };
}
function getLineupReady(t){return t==='B'?APP.lineupReadyB:APP.lineupReadyA;}
function setLineupReady(t,v){if(t==='B')APP.lineupReadyB=v;else APP.lineupReadyA=v;}

// ========== WÜSTENSTURM ==========
function getNextFriday(){
  const now=new Date();
  const day=now.getDay(); // 0=So..5=Fr..6=Sa (Lokalzeit)
  const add=day<=5?5-day:6;
  // Lokales Datum verwenden (kein UTC-Offset-Problem)
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+add);
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
async function ensureWeeklyEvents(){
  const friday=getNextFriday();
  // Nur anlegen wenn dieser Freitag noch gar nicht in der DB ist (weder pending noch abgeschlossen)
  const exists=APP.data.events.some(e=>e.event_date===friday);
  if(!exists){
    await sbPost('ws_events',[{event_date:friday,team:'A',time_slot:'13:00',result:'pending'},{event_date:friday,team:'B',time_slot:'22:00',result:'pending'}]);
    const ev=await sbGet('ws_events?order=event_date.desc,team.asc');
    APP.data.events=ev;renderPage();
  }
}
function pageWS(){
  const hasWS=canAccess('ws');
  const v=APP.wsView;
  // Auto-create weekly events (fire and forget)
  if(hasWS)ensureWeeklyEvents().catch(()=>{});
  return`
    <div class="stabs">
      ${hasWS?`<button class="stab${v==='anmeldung'?' on':''}" onclick="setWSView('anmeldung')">Anmeldung</button>`:''}
      ${hasWS?`<button class="stab${v==='aufstellung'?' on':''}" onclick="setWSView('aufstellung')">Aufstellung</button>`:''}
      ${hasWS?`<button class="stab${v==='mail'?' on':''}" onclick="setWSView('mail')">Mail</button>`:''}
      <button class="stab${v==='ergebnis'?' on':''}" onclick="setWSView('ergebnis')">Ergebnisse</button>
      <button class="stab${v==='spieler'?' on':''}" onclick="setWSView('spieler')">Spieler</button>
    </div>
    ${v==='anmeldung'?wsAnmeldung():v==='aufstellung'?wsAufstellung():v==='mail'?wsMailExport():v==='ergebnis'?wsErgebnis():wsSpieler()}`;}

// --- ERGEBNIS (Event-Historie + Drill-Down) ---
function wsErgebnis(){
  if(APP.wsErfassen)return wsErfassenView();
  if(APP.wsEventId)return wsErgebnisDrilldown(APP.wsEventId);
  const canEdit=canAccess('ws');
  const allEvts=[...APP.data.events].sort((a,b)=>b.event_date.localeCompare(a.event_date));
  // Heutiges Datum (lokal) als Trennlinie
  const now=new Date();
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  // Vergangene Events (vor heute): immer in Ergebnisliste, egal ob pending
  const pastEvts=allEvts.filter(e=>e.event_date<todayStr);
  // Zukünftige pending Events (>= heute): für "Nächstes Event"
  const upcomingPending=allEvts.filter(e=>(!e.result||e.result==='pending')&&e.event_date>=todayStr);
  const nextDate=upcomingPending.length?[...upcomingPending].sort((a,b)=>a.event_date.localeCompare(b.event_date))[0].event_date:null;
  const nextEvts=nextDate?upcomingPending.filter(e=>e.event_date===nextDate):[];
  // Statistiken nur auf Events mit echtem Ergebnis
  const done=allEvts.filter(e=>e.result&&e.result!=='pending');
  const wins=done.filter(e=>e.result==='win').length;
  const rate=done.length?Math.round(wins/done.length*100):0;
  let h='';
  if(canEdit)h+=`<button class="btn btn-sol btn-sm" onclick="APP.wsErfassen=true;renderPage()" style="margin-bottom:12px;width:100%">+ Ergebnis erfassen</button>`;
  h+=`<div class="sg"><div class="sb"><div class="sb-l">Siege</div><div class="sb-v" style="color:var(--win)">${wins}</div></div><div class="sb"><div class="sb-l">Niederlagen</div><div class="sb-v" style="color:var(--loss)">${done.length-wins}</div></div><div class="sb"><div class="sb-l">Siegquote</div><div class="sb-v" style="color:var(--win)">${rate}%</div></div><div class="sb"><div class="sb-l">Events</div><div class="sb-v">${done.length}</div></div></div>`;
  // Nächstes Event (nur zukünftige pending)
  if(nextEvts.length){
    const d=new Date(nextDate+'T12:00:00');
    const dStr=d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
    h+=`<div class="card"><div class="ch">Nächstes Event <span class="ch-sub">${dStr}</span></div>`;
    ['A','B'].forEach(team=>{
      const e=nextEvts.find(ev=>ev.team===team);if(!e)return;
      h+=`<div class="mi" style="cursor:pointer;padding-left:22px" onclick="APP.wsEventId='${e.id}';renderPage()">
        <div style="width:36px;height:36px;border-radius:9px;background:var(--acc)22;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--acc);flex-shrink:0">?</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">Team ${team} · ${e.time_slot||''}</div>
          <div style="font-size:11px;color:var(--tx3);margin-top:2px">Ergebnis noch offen</div>
        </div>
        <div style="flex-shrink:0">${badge('Ausstehend','var(--acc)')}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  // Alle vergangenen Events (mit oder ohne Ergebnis)
  if(pastEvts.length){
    const dates=[...new Set(pastEvts.map(e=>e.event_date))];
    h+=`<div class="card"><div class="ch">Ergebnisse <span class="ch-sub">Tippen für Details</span></div>`;
    dates.forEach(date=>{
      const dayEvts=pastEvts.filter(e=>e.event_date===date);
      h+=`<div style="padding:8px 14px 4px;font-size:12px;font-weight:800;color:var(--tx3);background:var(--bg2);border-bottom:1px solid var(--bd);letter-spacing:.3px">${date}</div>`;
      ['A','B'].forEach(team=>{
        const e=dayEvts.find(ev=>ev.team===team);if(!e)return;
        const isPend=!e.result||e.result==='pending';
        const isW=e.result==='win';
        const c=isPend?'var(--tx3)':isW?'var(--win)':'var(--loss)';
        const label=isPend?'Kein Ergebnis':isW?'Sieg':'Niederlage';
        const icon=isPend?'–':isW?'S':'N';
        const ps=APP.data.participation.filter(p=>p.event_id===e.id);
        const played=ps.filter(p=>p.played).length;
        const diff=e.our_pts&&e.opp_pts?(e.our_pts>e.opp_pts?'+':'')+fmt(e.our_pts-e.opp_pts):'';
        h+=`<div class="mi" style="cursor:pointer;padding-left:22px" onclick="APP.wsEventId='${e.id}';renderPage()">
          <div style="width:36px;height:36px;border-radius:9px;background:${c}22;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:${c};flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">Team ${team}${e.time_slot?' · '+e.time_slot:''}</div>
            <div style="font-size:11px;color:var(--tx3);margin-top:2px">${e.opponent||'Gegner unbekannt'}${diff?' · Diff: '+diff:''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0">
            ${badge(label,c)}
            ${ps.length?`<span style="font-size:10px;color:var(--tx3)">${played}/${ps.length}</span>`:''}
          </div>
        </div>`;
      });
    });
    h+=`</div>`;
  } else if(!nextEvts.length){
    h+=`<div class="loader">Noch keine Events vorhanden.</div>`;
  }
  h+=wsPlayerStats();
  return h;
}

function wsPlayerStats(){
  const parts=APP.data.participation;
  if(!parts.length)return'';
  const pmap={};
  parts.forEach(p=>{
    if(!pmap[p.player_name])pmap[p.player_name]={name:p.player_name,reg:0,played:0,pts:0};
    const s=pmap[p.player_name];
    if(p.registered!==false)s.reg++;
    if(p.played){s.played++;if(p.individual_pts)s.pts+=p.individual_pts;}
  });
  const list=Object.values(pmap).filter(p=>p.reg>0).sort((a,b)=>(b.pts-a.pts)||(b.played-a.played));
  if(!list.length)return'';
  const rows=list.map(p=>{
    const ns=p.reg-p.played;
    const rate=p.reg?Math.round(p.played/p.reg*100):0;
    const nc=ns>=3?'var(--loss)':ns>=1?'#e67e22':'var(--win)';
    return`<tr><td><strong style="cursor:pointer;color:var(--primary)" onclick="openPlayer('${p.name.replace(/'/g,"\\'")}')">${p.name}</strong></td><td style="text-align:center">${p.reg}</td><td style="text-align:center;color:var(--win)">${p.played}</td><td style="text-align:center;color:${nc};font-weight:${ns>0?700:400}">${ns}</td><td style="text-align:center">${rate}%</td><td style="text-align:right">${p.pts?fmt(p.pts):'–'}</td></tr>`;
  }).join('');
  return`<div class="card"><div class="ch">Spieler-Statistik <span class="ch-sub">sortiert nach Punkten</span></div><div class="scroll-x"><table><thead><tr><th>Spieler</th><th>Angem.</th><th>Gespielt</th><th>Gefehlt</th><th>Quote</th><th>Punkte ges.</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function wsErgebnisDrilldown(eventId){
  const ev=APP.data.events.find(e=>e.id===eventId);
  if(!ev)return`<div class="loader">Event nicht gefunden.</div>`;
  const ps=APP.data.participation.filter(p=>p.event_id===ev.id);
  const played=ps.filter(p=>p.played),missed=ps.filter(p=>!p.played);
  const excused=missed.filter(p=>p.excused),absent=missed.filter(p=>!p.excused);
  const tot=played.reduce((s,p)=>s+(p.individual_pts||0),0);
  const mx=Math.max(...played.map(p=>p.individual_pts||0),1);
  const isW=ev.result==='win',isP=!ev.result||ev.result==='pending';
  const bc=isP?'pend':isW?'win':'loss';
  const rt=isP?'Ausstehend':isW?'SIEG':'NIEDERLAGE';
  let h=`<button class="btn btn-out btn-sm" onclick="APP.wsEventId=null;renderPage()" style="margin-bottom:12px">← Alle Events</button>`;
  h+=`<div class="rbanner ${bc}">
    <div class="rb-date">${ev.event_date}${ev.time_slot?' · '+ev.time_slot:''}</div>
    <div class="rb-res ${bc}">${rt}</div>
    <div class="score-row">
      <div class="sc-block"><div class="sc-name">AR1S</div><div class="sc-pts" style="color:${isP?'var(--acc)':isW?'var(--win)':'var(--loss)'}">${fmt(ev.our_pts)}</div></div>
      <div class="sc-vs">VS</div>
      <div class="sc-block"><div class="sc-name">${ev.opponent||'Gegner'}</div><div class="sc-pts" style="color:var(--tx3)">${fmt(ev.opp_pts)}</div></div>
      ${ev.our_pts&&ev.opp_pts?`<div class="sc-block"><div class="sc-name">Differenz</div><div class="sc-pts" style="color:${ev.our_pts>ev.opp_pts?'var(--win)':'var(--loss)'}">${ev.our_pts>ev.opp_pts?'+':''}${fmt(ev.our_pts-ev.opp_pts)}</div></div>`:''}
    </div></div>`;
  h+=`<div class="sg"><div class="sb"><div class="sb-l">Gespielt</div><div class="sb-v" style="color:var(--win)">${played.length}</div></div><div class="sb"><div class="sb-l">Gefehlt</div><div class="sb-v" style="color:${absent.length?'var(--loss)':'var(--tx3)'}">${absent.length}</div></div><div class="sb"><div class="sb-l">Entschuldigt</div><div class="sb-v" style="color:var(--acc)">${excused.length}</div></div><div class="sb"><div class="sb-l">Quote</div><div class="sb-v" style="color:var(--win)">${ps.length?Math.round(played.length/ps.length*100):0}%</div></div></div>`;
  if(ps.length){
    const rows=[...played].sort((a,b)=>(b.individual_pts||0)-(a.individual_pts||0)).map(p=>{
      const pct=Math.round((p.individual_pts||0)/mx*100);
      const share=tot?((p.individual_pts||0)/tot*100).toFixed(1):'0';
      const rc=p.rank===1?'#f1c40f':p.rank===2?'#aaa':p.rank===3?'#cd7f32':'var(--tx3)';
      const zc=p.zone?.includes('Assassin')?'var(--ass)':p.zone?.includes('1')||p.zone?.includes('3')?'var(--oil)':'var(--med)';
      const inact=isInactive(p.player_name);
      return`<tr style="${inact?'opacity:.45;background:#fafafa':''}"><td style="font-weight:800;color:${rc}">${p.rank||'–'}</td><td><strong style="cursor:pointer;color:var(--primary)" onclick="openPlayer('${p.player_name.replace(/'/g,"\\'")}')"> ${p.player_name}</strong>${inact?` <span style="font-size:9px;color:#e67e22;font-weight:700">AUSGETRETEN</span>`:''}</td><td>${p.zone?badge(p.zone,zc):'–'}</td><td style="font-weight:700">${fmt(p.individual_pts)}</td><td><div class="bar-w"><div class="bar-bg"><div class="bar-f" style="width:${pct}%;background:${p.rank<=3?'#f1c40f':'var(--primary)'}"></div></div><span style="font-size:10px;color:var(--tx3)">${share}%</span></div></td></tr>`;}).join('');
    const missedRows=missed.map(p=>{const inact=isInactive(p.player_name);return`<tr style="opacity:.55;${inact?'background:#fafafa':''}"><td>–</td><td>${p.player_name}${inact?` <span style="font-size:9px;color:#e67e22;font-weight:700">AUSGETRETEN</span>`:''}</td><td>${p.zone?badge(p.zone,'var(--tx3)'):'–'}</td><td>–</td><td>${badge(p.excused?'Entschuldigt':'Gefehlt',p.excused?'var(--acc)':'var(--loss)')}</td></tr>`;}).join('');
    h+=`<div class="card"><div class="ch">Individuelle Punkte</div><div class="scroll-x"><table><thead><tr><th>#</th><th>Spieler</th><th>Zone</th><th>Punkte</th><th>Anteil</th></tr></thead><tbody>${rows}${missedRows}</tbody></table></div></div>`;
  }else{h+=`<div class="note">Noch keine Teilnahme-Daten für dieses Event.</div>`;}
  if(canAccess('ws')){
    const eid=eventId;
    const wSel=ev.result==='win',lSel=ev.result==='loss';
    h+=`<div class="card" style="margin-top:12px">
      <div class="ch" style="cursor:pointer;user-select:none" onclick="ddToggleEdit('${eid}')">
        Ergebnis &amp; Spieler bearbeiten
        <span id="dd-arrow-${eid}" style="float:right;font-size:11px;color:var(--tx3);transition:transform .2s">▼</span>
      </div>
      <div id="dd-edit-${eid}" style="display:none" class="cb">
        <div style="margin-bottom:12px">
          <label style="font-size:12px;color:var(--tx3);display:block;margin-bottom:4px">Screenshots hochladen (Ergebnis- &amp; Ranking-Screen)</label>
          <input type="file" id="dd-shots-${eid}" multiple accept="image/*" onchange="ddShowPreviews('${eid}')" style="width:100%;padding:6px 0">
          <div id="dd-previews-${eid}" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
            <button class="btn btn-sol" id="dd-analyze-btn-${eid}" onclick="ddAnalyze('${eid}')">🔍 Analysieren</button>
            <span id="dd-analyze-status-${eid}" style="font-size:12px;color:var(--tx3)"></span>
          </div>
        </div>
        <hr style="border:none;border-top:1px solid var(--bd);margin:12px 0">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <div class="fl2"><label>Gegner</label><input class="fi" id="dd-opp-${eid}" value="${ev.opponent||''}"></div>
          <div class="fl2"><label>Unsere Punkte</label><input class="fi" id="dd-our-${eid}" type="number" value="${ev.our_pts||''}" oninput="ddAutoRes('${eid}')"></div>
          <div class="fl2"><label>Gegner Punkte</label><input class="fi" id="dd-oppts-${eid}" type="number" value="${ev.opp_pts||''}" oninput="ddAutoRes('${eid}')"></div>
          <div class="fl2"><label>Ergebnis</label>
            <div style="display:flex;gap:8px">
              <button class="btn btn-ok" id="dd-win-${eid}" style="flex:1${wSel?';background:var(--win);color:#fff':''}" onclick="ddSetRes('${eid}','win')">🏆 Sieg</button>
              <button class="btn btn-no" id="dd-loss-${eid}" style="flex:1${lSel?';background:var(--loss);color:#fff':''}" onclick="ddSetRes('${eid}','loss')">💀 Niederlage</button>
            </div>
          </div>
        </div>
        <div style="font-weight:700;font-size:13px;margin:12px 0 4px;color:var(--tx)">Spieler-Teilnahme</div>
        <div style="font-size:11px;color:var(--tx3);margin-bottom:8px">Punkte aus Screenshot werden automatisch zugewiesen · grün = erkannt</div>
        <div class="scroll-x" id="dd-ptable-${eid}">${ddPlayerTableHtml(eid,ev,_ddAnalysis[eid]||[])}</div>
        <button class="btn btn-sol" id="dd-save-${eid}" style="width:100%;margin-top:12px" onclick="ddSave('${eid}')">Änderungen speichern</button>
      </div>
    </div>`;
  }
  return h;
}

// --- DRILLDOWN EDIT HELPERS ---
const _ddRes={};
const _ddExtra={}; // eid → [{name,pts,rank}] Spieler aus Screenshot die nicht im Lauf sind
const _ddManual={}; // eid → [{name,pts}] manuell hinzugefügte Spieler
const _ddLineupOnly={}; // eid → [name] Aufstellungs-Spieler ohne ws_participation-Eintrag
const _ddAnalysis={}; // eid → analysisPlayers vom letzten Screenshot-Scan
function ddToggleEdit(eid){
  const box=document.getElementById('dd-edit-'+eid);
  const arr=document.getElementById('dd-arrow-'+eid);
  if(!box)return;
  const open=box.style.display==='none';
  box.style.display=open?'':'none';
  if(arr)arr.style.transform=open?'rotate(180deg)':'';
}
function ddSetRes(eid,r){
  _ddRes[eid]=r;
  const wb=document.getElementById('dd-win-'+eid);
  const lb=document.getElementById('dd-loss-'+eid);
  if(wb){wb.style.background=r==='win'?'var(--win)':'';wb.style.color=r==='win'?'#fff':'';}
  if(lb){lb.style.background=r==='loss'?'var(--loss)':'';lb.style.color=r==='loss'?'#fff':'';}
}
function ddAutoRes(eid){
  const our=parseInt(document.getElementById('dd-our-'+eid)?.value)||0;
  const opp=parseInt(document.getElementById('dd-oppts-'+eid)?.value)||0;
  if(our&&opp)ddSetRes(eid,our>opp?'win':'loss');
}
function ddShowPreviews(eid){
  const files=document.getElementById('dd-shots-'+eid)?.files;
  const box=document.getElementById('dd-previews-'+eid);
  if(!files||!box)return;
  box.innerHTML='';
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=document.createElement('img');
      img.src=e.target.result;
      img.style.cssText='height:120px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer';
      img.onclick=()=>window.open(e.target.result);
      box.appendChild(img);
    };
    r.readAsDataURL(f);
  });
}
function ddPlayerTableHtml(eid,ev,analysisPlayers){
  const ps=APP.data.participation.filter(p=>p.event_id===ev.id);
  const apList=analysisPlayers||[];

  // Aufstellungs-Spieler die noch kein ws_participation-Eintrag haben
  const lineup=getLineup(ev.team||'A');
  const lineupNames=[...new Set([
    ...(lineup.z1||[]),...(lineup.z2||[]),...(lineup.z3||[]),...(lineup.z4||[]),
    ...(lineup.ass||[]),...(lineup.ars||[]),...(lineup.sold||[]),...(lineup.sup||[])
  ])].filter(n=>n&&!ps.find(p=>p.player_name===n));
  _ddLineupOnly[eid]=lineupNames;

  // Alle erwarteten Teilnehmer: bestehende DB-Einträge + Aufstellungs-Spieler ohne Eintrag
  const allPs=[...ps,...lineupNames.map(n=>({player_name:n,played:false,individual_pts:null}))];

  // Matched-Map: versuche exakten Treffer, dann Fuzzy (≥85%) gegen allPs
  const aMap={};
  const extras=[];
  apList.forEach(ap=>{
    if(!ap.name)return;
    const name=ap.name.replace(/^\[[^\]]+\]\s*/,'').replace(/\s*\[[^\]]+\]$/,'').trim();
    if(!name)return;
    const cap={...ap,name};
    if(allPs.find(p=>p.player_name===name)){aMap[name]=cap;return;}
    let best=null,bestS=0;
    allPs.forEach(p=>{const s=_nameSimilarity(name,p.player_name);if(s>bestS){best=p;bestS=s;}});
    if(bestS>=0.85){aMap[best.player_name]=cap;}
    else extras.push(cap);
  });
  // Manuell hinzugefügte Spieler → direkt in die Teilnahme-Tabelle (wie Lineup-Spieler)
  const manualPs=(_ddManual[eid]||[]).filter(m=>!allPs.find(p=>p.player_name===m.name));
  manualPs.forEach(m=>allPs.push({player_name:m.name,played:false,individual_pts:null,_manual:true}));
  // Manuell hinzugefügte ebenfalls in lineupOnly aufnehmen damit ddSave sie speichert
  _ddLineupOnly[eid]=[...lineupNames,...manualPs.map(m=>m.name)];

  // Unerkannte Screenshot-Spieler → Mapping-Dropdown
  const allExtras=extras.filter(e=>!allPs.find(p=>p.player_name===e.name));
  _ddExtra[eid]=allExtras;
  const analysisRun=apList.length>0;
  const hasAny=Object.keys(aMap).length>0||allExtras.length>0;

  // Zeilen für alle erwarteten Teilnehmer
  const rows=allPs.length?[...allPs].sort((a,b)=>{
    const aA=aMap[a.player_name],aB=aMap[b.player_name];
    if(aA&&!aB)return -1;if(!aA&&aB)return 1;
    const pA=aA?.pts??a.individual_pts??0;
    const pB=aB?.pts??b.individual_pts??0;
    return pB-pA;
  }).map(p=>{
    const safe=p.player_name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    const aData=aMap[p.player_name];
    const absent=analysisRun&&!aData;
    const pts=aData?.pts!=null?aData.pts:(absent?'':(p.individual_pts??''));
    const played=aData?(aData.pts>0):(absent?false:(p.played??false));
    const hl=aData?';background:rgba(39,174,96,.08)':absent?';background:rgba(231,76,60,.04)':'';
    const badge=aData
      ?'<span style="color:var(--win);font-size:9px;margin-left:3px">●</span>'
      :absent
        ?'<span style="font-size:9px;color:var(--loss);font-weight:800;background:rgba(231,76,60,.12);padding:1px 4px;border-radius:3px;margin-left:4px">ABWESEND</span>'
        :'';
    return`<tr style="vertical-align:middle${hl}">
      <td style="font-size:13px;font-weight:600">${p.player_name}${badge}</td>
      <td style="text-align:center"><input type="checkbox" id="dd-pld-${eid}-${safe}"${played?' checked':''}></td>
      <td style="text-align:right"><input type="number" class="fi" id="dd-ipts-${eid}-${safe}" value="${pts}" style="width:100px;text-align:right;padding:3px 6px;font-size:12px;margin:0" placeholder="–" oninput="ddPtsChange('${eid}','${safe}')"></td>
    </tr>`;
  }).join(''):'';

  // Screenshot-Spieler die nicht zugeordnet wurden → Mapping auf DB-Spieler
  const allDbNames=APP.data.players.map(p=>p.name).sort((a,b)=>a.localeCompare(b));
  const extraRows=[...allExtras].sort((a,b)=>(b.pts||0)-(a.pts||0)).map(ap=>{
    const safe='xtra_'+ap.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    // Bestes Fuzzy-Match unter 0.85 als Vorschlag
    let suggName='';let suggScore=0;
    allDbNames.forEach(n=>{const s=_nameSimilarity(ap.name,n);if(s>suggScore&&!allPs.find(p=>p.player_name===n)){suggName=n;suggScore=s;}});
    const opts='<option value="">— ignorieren —</option>'+allDbNames
      .filter(n=>!allPs.find(p=>p.player_name===n))
      .map(n=>`<option value="${n.replace(/"/g,'&quot;')}"${n===suggName&&suggScore>0.2?' selected':''}>${n}</option>`).join('');
    return`<tr style="vertical-align:middle;background:rgba(230,126,34,.06)">
      <td colspan="3" style="padding:6px 4px">
        <div style="font-size:11px;color:#e67e22;font-weight:700;margin-bottom:4px">⚠ Nicht erkannt: <em>${ap.name}</em> (${ap.pts?ap.pts.toLocaleString('de'):'–'} Pkt) → Spieler zuweisen:</div>
        <select class="fi" id="dd-map-${eid}-${safe}" style="width:100%;padding:4px 8px;font-size:12px" onchange="ddMapChange('${eid}','${safe}',this.value,${ap.pts||0})">${opts}</select>
      </td>
    </tr>`;
  }).join('');
  const alreadyNames=new Set([...allPs.map(p=>p.player_name),...allExtras.map(e=>e.name)]);
  const addableOptions=APP.data.players.filter(p=>!alreadyNames.has(p.name)).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.name.replace(/"/g,'&quot;')}">${p.name}</option>`).join('');
  const addRow=`<div style="display:flex;gap:8px;margin-top:10px;align-items:center"><select class="fi" id="dd-addp-${eid}" style="flex:1;padding:5px 8px;font-size:12px"><option value="">Spieler manuell hinzufügen…</option>${addableOptions}</select><button class="btn btn-ok" onclick="ddAddPlayer('${eid}')" style="white-space:nowrap;font-size:12px;padding:5px 12px">+ Hinzufügen</button></div>`;
  if(!allPs.length&&!allExtras.length)return'<div class="note">Noch keine Teilnahme-Daten und keine Aufstellung gespeichert.</div>'+addRow;
  return`${hasAny||analysisRun?`<div style="font-size:11px;margin-bottom:6px">${analysisRun?'<span style="color:var(--win)">● erkannt</span> · <span style="color:var(--loss)">ABWESEND = nicht im Screenshot</span>':''}${allExtras.length?' · <span style="color:#e67e22">⚠ nicht erkannt = Spieler zuweisen</span>':''}</div>`:''}
  <table style="width:100%"><thead><tr><th>Spieler</th><th style="text-align:center">Gespielt</th><th style="text-align:right">Punkte</th></tr></thead>
  <tbody>${rows}${extraRows}</tbody></table>${addRow}`;
}
function ddMapChange(eid,safe,dbName,pts){
  // Wenn Spieler gemappt: diesen Spieler in der Haupttabelle mit den Punkten befüllen
  if(!dbName)return;
  const playerSafe=dbName.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  const ptsEl=document.getElementById('dd-ipts-'+eid+'-'+playerSafe);
  const pldEl=document.getElementById('dd-pld-'+eid+'-'+playerSafe);
  if(ptsEl&&pts){ptsEl.value=pts;if(pldEl)pldEl.checked=true;}
}
function ddPtsChange(eid,safe){
  const pts=parseInt(document.getElementById('dd-ipts-'+eid+'-'+safe)?.value)||0;
  const pld=document.getElementById('dd-pld-'+eid+'-'+safe);
  if(pld)pld.checked=pts>0;
}
function ddAddPlayer(eid){
  const sel=document.getElementById('dd-addp-'+eid);
  if(!sel||!sel.value)return;
  const name=sel.value;
  if(!_ddManual[eid])_ddManual[eid]=[];
  if(_ddManual[eid].find(m=>m.name===name))return;
  _ddManual[eid].push({name,pts:null});
  const ev=APP.data.events.find(e=>e.id===eid);
  if(!ev)return;
  const td=document.getElementById('dd-ptable-'+eid);
  if(td)td.innerHTML=ddPlayerTableHtml(eid,ev,_ddAnalysis[eid]||[]);
}
function _startAnalysisProgress(statusEl){
  if(!statusEl)return(ok,msg)=>{};
  let pct=0;
  statusEl.innerHTML=`<span id="_ap_lbl" style="font-size:12px;color:var(--tx3)">⏳ Analysiere</span><span style="display:inline-block;width:140px;height:6px;background:rgba(0,0,0,0.1);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden"><span id="_ap_fill" style="display:block;height:100%;width:0%;background:var(--acc,#7c3aed);border-radius:3px;transition:width .5s ease"></span></span>`;
  const fill=statusEl.querySelector('#_ap_fill');
  const lbl=statusEl.querySelector('#_ap_lbl');
  let dots=0;
  const di=setInterval(()=>{dots=(dots+1)%4;if(lbl)lbl.textContent='⏳ Analysiere'+'.'.repeat(dots);},400);
  const pi=setInterval(()=>{pct+=Math.max(0.3,(90-pct)*0.06);if(fill)fill.style.width=Math.min(pct,90)+'%';},600);
  return function stop(ok,msg){
    clearInterval(di);clearInterval(pi);
    if(fill){fill.style.width='100%';fill.style.background=ok?'var(--win,#27ae60)':'var(--loss,#e74c3c)';}
    setTimeout(()=>{statusEl.innerHTML=msg;},500);
  };
}
async function ddAnalyze(eid){
  const files=document.getElementById('dd-shots-'+eid)?.files;
  if(!files||!files.length){alert('Bitte zuerst Screenshots auswählen.');return;}
  const statusEl=document.getElementById('dd-analyze-status-'+eid);
  const btn=document.getElementById('dd-analyze-btn-'+eid);
  if(btn)btn.disabled=true;
  const stop=_startAnalysisProgress(statusEl);
  try{
    const images=await Promise.all(Array.from(files).map(f=>new Promise((res,rej)=>{
      const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);
    })));
    const knownPlayers=APP.data.players.map(p=>p.name);
    const resp=await fetch(VISION_URL()+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,known_players:knownPlayers})});
    if(!resp.ok)throw new Error(`Vision-Server: HTTP ${resp.status}`);
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    if(data.opponent){const el=document.getElementById('dd-opp-'+eid);if(el)el.value=data.opponent;}
    if(data.our_pts!=null){const el=document.getElementById('dd-our-'+eid);if(el)el.value=data.our_pts;}
    if(data.opp_pts!=null){const el=document.getElementById('dd-oppts-'+eid);if(el)el.value=data.opp_pts;}
    if(data.result)ddSetRes(eid,data.result);
    ddAutoRes(eid);
    _ddAnalysis[eid]=data.players||[];
    const ev=APP.data.events.find(e=>e.id===eid);
    if(ev){const td=document.getElementById('dd-ptable-'+eid);if(td)td.innerHTML=ddPlayerTableHtml(eid,ev,_ddAnalysis[eid]);}
    const cnt=(data.players||[]).length;
    stop(true,`<span style="color:var(--win)">✓ ${cnt} Spieler erkannt</span>`);
  }catch(e){
    stop(false,`<span style="color:var(--loss)">❌ ${e.message}</span>`);
  }
  if(btn)btn.disabled=false;
}
async function ddSave(eid){
  const ev=APP.data.events.find(e=>e.id===eid);
  if(!ev)return;
  const res=_ddRes[eid]||ev.result;
  if(!res||res==='pending'){alert('Bitte Ergebnis (Sieg/Niederlage) auswählen.');return;}
  const opp=document.getElementById('dd-opp-'+eid)?.value?.trim()||null;
  const our=parseInt(document.getElementById('dd-our-'+eid)?.value)||null;
  const oppPts=parseInt(document.getElementById('dd-oppts-'+eid)?.value)||null;
  const btn=document.getElementById('dd-save-'+eid);
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const r=await fetch(SB+'/rest/v1/ws_events?id=eq.'+eid,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({opponent:opp,our_pts:our,opp_pts:oppPts,result:res})});
    if(!r.ok)throw new Error(await r.text());
    const ps=APP.data.participation.filter(p=>p.event_id===eid);
    await Promise.all(ps.map(async p=>{
      const safe=p.player_name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const pldEl=document.getElementById('dd-pld-'+eid+'-'+safe);
      const ptsEl=document.getElementById('dd-ipts-'+eid+'-'+safe);
      if(!pldEl&&!ptsEl)return;
      const played=pldEl?pldEl.checked:p.played;
      const pts=ptsEl?(parseInt(ptsEl.value)||null):p.individual_pts;
      const pr=await fetch(SB+'/rest/v1/ws_participation?id=eq.'+p.id,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({played,individual_pts:pts})});
      if(!pr.ok)throw new Error('Teilnahme: '+await pr.text());
    }));
    // Aufstellungs-Spieler ohne bisherigen DB-Eintrag anlegen (auch Abwesende)
    const lineupOnly=_ddLineupOnly[eid]||[];
    for(const name of lineupOnly){
      const safe=name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const pldEl=document.getElementById('dd-pld-'+eid+'-'+safe);
      const ptsEl=document.getElementById('dd-ipts-'+eid+'-'+safe);
      if(!pldEl&&!ptsEl)continue;
      const played=pldEl?pldEl.checked:false;
      const pts=ptsEl?(parseInt(ptsEl.value)||null):null;
      const pr=await fetch(SB+'/rest/v1/ws_participation',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({event_id:eid,player_name:name,played,individual_pts:pts})});
      if(!pr.ok)throw new Error('Teilnahme ('+name+'): '+await pr.text());
    }
    // Nicht erkannte Screenshot-Spieler: Mapping auf bestehenden DB-Spieler
    const extras=_ddExtra[eid]||[];
    for(const ap of extras){
      const safe='xtra_'+ap.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const mapEl=document.getElementById('dd-map-'+eid+'-'+safe);
      const mappedName=mapEl?mapEl.value:'';
      if(!mappedName)continue; // ignorieren gewählt
      // Punkte über den Spieler-Input der Haupttabelle lesen (falls durch ddMapChange gesetzt)
      const playerSafe=mappedName.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const ptsEl=document.getElementById('dd-ipts-'+eid+'-'+playerSafe);
      const pldEl=document.getElementById('dd-pld-'+eid+'-'+playerSafe);
      const pts=ptsEl?(parseInt(ptsEl.value)||null):ap.pts||null;
      const played=pldEl?pldEl.checked:(pts>0);
      // Existiert bereits ein ws_participation-Eintrag für diesen Spieler?
      const existing=APP.data.participation.find(p=>p.event_id===eid&&p.player_name===mappedName);
      if(existing){
        const pr=await fetch(SB+'/rest/v1/ws_participation?id=eq.'+existing.id,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({played,individual_pts:pts})});
        if(!pr.ok)throw new Error('Teilnahme update ('+mappedName+'): '+await pr.text());
      }else{
        const pr=await fetch(SB+'/rest/v1/ws_participation',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({event_id:eid,player_name:mappedName,played,individual_pts:pts})});
        if(!pr.ok)throw new Error('Teilnahme ('+mappedName+'): '+await pr.text());
      }
    }
    const [evs,parts,players]=await Promise.all([sbGet('ws_events?order=event_date.desc,team.asc'),sbGet('ws_participation?order=rank.asc'),sbGet('ws_players?order=name.asc')]);
    APP.data.events=evs;APP.data.participation=parts;APP.data.players=players;
    renderPage();
  }catch(e){
    alert('Fehler: '+e.message);
    if(btn){btn.textContent='Änderungen speichern';btn.disabled=false;}
  }
}

// ====== VS-DUELL ======
function getKW(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const jan4=new Date(d.getFullYear(),0,4);
  const startOfWeek1=new Date(jan4);
  startOfWeek1.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  return Math.floor((d-startOfWeek1)/604800000)+1;
}
function pageVS(){
  const sub=APP.vsView||'ranking';
  const canW=canAccess('ws');
  let h=`<div class="hd"><div class="ht">VS-Duell</div></div>`;
  h+=`<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn btn-sm ${sub==='ranking'?'btn-sol':'btn-out'}" onclick="APP.vsView='ranking';renderPage()">📊 Woche</button>
    <button class="btn btn-sm ${sub==='overall'?'btn-sol':'btn-out'}" onclick="APP.vsView='overall';renderPage()">🏆 Gesamt</button>
    ${canW?`<button class="btn btn-sm ${sub==='upload'?'btn-sol':'btn-out'}" onclick="APP.vsView='upload';renderPage()">📷 Hochladen</button>`:''}
  </div>`;
  if(sub==='upload'&&canW)h+=vsUploadSection();
  else if(sub==='overall')h+=vsOverallSection();
  else h+=vsWeekSection();
  return h;
}

function vsWeekSection(){
  const weeks=APP.data.vsWeeks||[];
  if(!weeks.length)return'<div class="note">Noch keine Daten — bitte Screenshots hochladen (📷 Hochladen).</div>';
  const selId=APP.vsWeekId||weeks[0]?.id;
  const week=weeks.find(w=>w.id===selId)||weeks[0];
  const entries=(APP.data.vsEntries||[]).filter(e=>e.week_id===week?.id);
  const weekOpts=weeks.map(w=>`<option value="${w.id}"${w.id===selId?' selected':''}>KW${getKW(w.week_start)} · ${w.week_start}</option>`).join('');
  let h=`<div style="margin-bottom:14px">
    <select class="fi" onchange="APP.vsWeekId=this.value;renderPage()">${weekOpts}</select>
  </div>`;
  if(!entries.length)return h+'<div class="note">Keine Einträge für diese Woche.</div>';
  h+=vsStatCards(entries,1);
  h+=vsRankTable(entries,VS_TARGET,1,false);
  return h;
}

function vsOverallSection(){
  const weeks=APP.data.vsWeeks||[];
  const allEntries=APP.data.vsEntries||[];
  if(!weeks.length)return'<div class="note">Noch keine Daten.</div>';
  const from=APP.vsFromDate||weeks[weeks.length-1]?.week_start||'';
  const to=APP.vsToDate||weeks[0]?.week_start||'';
  const filtIds=new Set(weeks.filter(w=>w.week_start>=from&&w.week_start<=to).map(w=>w.id));
  const filtEntries=allEntries.filter(e=>filtIds.has(e.week_id));
  const weekCount=filtIds.size;
  const byPl={};
  filtEntries.forEach(e=>{
    if(!byPl[e.player_name])byPl[e.player_name]={player_name:e.player_name,pts:0,weeks:0,belowTarget:0};
    byPl[e.player_name].pts+=e.pts;
    byPl[e.player_name].weeks++;
    if(e.pts<VS_TARGET)byPl[e.player_name].belowTarget++;
  });
  const agg=Object.values(byPl);
  let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <div class="fl2"><label style="font-size:11px">Von (Montag)</label><input type="date" class="fi" value="${from}" onchange="APP.vsFromDate=this.value;renderPage()"></div>
    <div class="fl2"><label style="font-size:11px">Bis (Montag)</label><input type="date" class="fi" value="${to}" onchange="APP.vsToDate=this.value;renderPage()"></div>
  </div>`;
  if(!agg.length)return h+'<div class="note">Keine Daten im gewählten Zeitraum.</div>';
  h+=vsStatCards(agg,weekCount);
  h+=vsRankTable(agg,VS_TARGET*weekCount,weekCount,true);
  return h;
}

function vsStatCards(entries,weekCount){
  const total=entries.reduce((s,e)=>s+e.pts,0);
  const avg=entries.length?Math.round(total/entries.length):0;
  const target=VS_TARGET*weekCount;
  const above=entries.filter(e=>e.pts>=target).length;
  return`<div class="sg" style="margin-bottom:12px">
    <div class="sb"><div class="sb-l">Spieler</div><div class="sb-v">${entries.length}</div></div>
    <div class="sb"><div class="sb-l">Gesamt</div><div class="sb-v" style="font-size:13px">${fmtMio(total)}</div></div>
    <div class="sb"><div class="sb-l">Ziel erreicht</div><div class="sb-v" style="color:var(--win)">${above}/${entries.length}</div></div>
    <div class="sb"><div class="sb-l">Ø/Spieler</div><div class="sb-v" style="font-size:13px">${fmtMio(avg)}</div></div>
  </div>`;
}

function vsRankTable(entries,target,weekCount,showMissed){
  const sorted=[...entries].sort((a,b)=>b.pts-a.pts);
  const medals=['🥇','🥈','🥉'];
  const rowBg=['background:rgba(255,215,0,.12)','background:rgba(192,192,192,.12)','background:rgba(205,127,50,.12)'];
  const rows=sorted.map((e,i)=>{
    const rank=i+1;
    const medal=rank<=3?`<span style="font-size:${rank===1?22:18}px">${medals[rank-1]}</span>`:`<span style="font-size:14px;color:var(--tx3)">${rank}</span>`;
    const bg=rank<=3?rowBg[rank-1]:'';
    const pct=target?Math.min(Math.round(e.pts/target*100),999):0;
    const barW=Math.min(pct,100);
    const barColor=pct>=100?'var(--win)':pct>=80?'var(--acc)':'var(--loss)';
    const isLow=showMissed?(e.belowTarget||0)>weekCount*0.5:(target&&e.pts<target);
    const lowBadge=isLow?`<span style="font-size:9px;background:var(--loss);color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle">unter Ziel</span>`:'';
    return`<tr style="${bg}">
      <td style="text-align:center;padding:6px 4px">${medal}</td>
      <td style="font-weight:700;font-size:13px;padding:6px 4px">${e.player_name}${lowBadge}</td>
      <td style="text-align:right;font-weight:800;white-space:nowrap;padding:6px 4px">${fmtMio(e.pts)}</td>

        </div>
        <div style="font-size:10px;color:${barColor};text-align:right;font-weight:700">${pct}%</div>
      </td>
    </tr>`;
  }).join('');
  const targetLabel=weekCount>1?`${weekCount} Wochen × ${fmtMio(VS_TARGET)}`:`Wochenziel: ${fmtMio(VS_TARGET)}`;
  return`<div class="card"><div class="ch">${weekCount>1?'Gesamt-Ranking':'Wochen-Ranking'} <span class="ch-sub">${targetLabel}</span></div><div class="scroll-x"><table><thead><tr><th style="width:36px">#</th><th>Spieler</th><th style="text-align:right">Punkte</th><th>Zielquote</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function _nameSimilarity(a,b){
  a=(a||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  b=(b||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!a||!b)return 0;if(a===b)return 1;
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return 1-dp[m][n]/Math.max(m,n);
}
function _bestVsMatch(name){
  let best=null,bestScore=0;
  for(const kp of APP.data.players){
    const s=_nameSimilarity(name,kp.name);
    if(s>bestScore){best=kp;bestScore=s;}
  }
  if(bestScore>=0.85)return{player:best,score:bestScore,status:bestScore>=0.999?'exact':'fuzzy'};
  return null;
}
let _vsMatchData=[];

    return{recognized:p.name,dbName:m?m.player.name:null,pts:p.pts,rank:p.rank,status:m?m.status:'new'};
  });
  const counts={exact:0,fuzzy:0,new:0};
  _vsMatchData.forEach(m=>counts[m.status]++);
  const bgColor={exact:'#f0fff4',fuzzy:'#fffde7',new:'#eff6ff'};

  const allNames=APP.data.players.map(p=>p.name).sort((a,b)=>a.localeCompare(b));
  const playerOpts='<option value="__new__">➕ Neu anlegen</option>'+allNames.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`).join('');
  const rows=_vsMatchData.map((m,i)=>{

        <label style="display:block;font-size:12px;cursor:pointer;margin-bottom:2px"><input type="radio" name="vsr-c-${i}" value="db" checked> DB behalten: <b>${m.dbName}</b></label>
        <label style="display:block;font-size:12px;cursor:pointer"><input type="radio" name="vsr-c-${i}" value="ss"> Screenshot: <b>${m.recognized}</b> <span style="color:#e67e22;font-size:10px">(DB-Name wird umbenannt)</span></label>`;
    }else{
      nameCell=`<div style="font-size:10px;color:var(--tx3);margin-bottom:4px">Erkannt: <b>${m.recognized}</b></div>
        <select id="vsr-link-${i}" class="fi" style="width:100%;padding:3px 6px;font-size:12px;margin:0">${playerOpts}</select>`;
    }
    return`<tr style="background:${bgColor[m.status]}">
      <td style="text-align:center;font-size:11px;color:var(--tx3);padding:4px;white-space:nowrap">${m.rank||i+1}</td>
      <td style="text-align:center;padding:4px">${badge[m.status]}</td>
      <td style="padding:4px 8px">${nameCell}</td>
      <td style="text-align:right;padding:4px;white-space:nowrap"><input type="number" class="fi" id="vsr-pts-${i}" value="${m.pts||''}" style="width:100px;text-align:right;padding:3px 6px;font-size:12px;margin:0"></td>
    </tr>`;
  }).join('');
  return`<div style="display:flex;gap:16px;margin-bottom:8px;font-size:12px;flex-wrap:wrap">
    <span style="color:var(--win)">✓ ${counts.exact} exakt</span>
    <span style="color:#e67e22">≈ ${counts.fuzzy} Name wählen</span>
    <span style="color:#2980b9">+ ${counts.new} verknüpfen / neu</span>
    <span style="color:var(--tx3)">${_vsMatchData.length} gesamt</span>
  </div>
  <div style="max-height:500px;overflow-y:auto">
  <table style="width:100%"><thead><tr><th style="padding:4px">#</th><th></th><th>Spieler</th><th style="text-align:right">Punkte</th></tr></thead>

async function vsAnalyze(){
  const files=document.getElementById('vs-shots')?.files;
  if(!files||!files.length){alert('Bitte Screenshots auswählen.');return;}
  const statusEl=document.getElementById('vs-analyze-status');
  const btn=document.getElementById('vs-analyze-btn');
  if(btn)btn.disabled=true;
  const stop=_startAnalysisProgress(statusEl);
  try{
    const images=await Promise.all(Array.from(files).map(f=>new Promise((res,rej)=>{
      const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);
    })));
    const knownPlayers=APP.data.players.map(p=>p.name);
    const resp=await fetch(VISION_URL()+'/analyze-vs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,known_players:knownPlayers})});
    if(!resp.ok)throw new Error(`Vision-Server: HTTP ${resp.status}`);
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    const rs=document.getElementById('vs-result-section');
    const rt=document.getElementById('vs-result-table');
    if(rs)rs.style.display='';
    if(rt)rt.innerHTML=vsResultTableHtml(data.players||[]);
    const cnt=(data.players||[]).length;
    const perImg=(data.per_image||[]).join(' · ');
    const warn=(data.warnings||[]).length?`<br><span style="color:var(--loss);font-size:11px">${(data.warnings||[]).join(' · ')}</span>`:'';
    stop(true,`<span style="color:var(--win)">✓ ${cnt} Spieler erkannt</span>${warn}<br><span style="font-size:11px;color:var(--tx3)">${perImg}</span>`);
  }catch(e){
    stop(false,`<span style="color:var(--loss)">❌ ${e.message}</span>`);
  }
  if(btn)btn.disabled=false;
}

async function vsSave(){
  const weekDate=document.getElementById('vs-week-date')?.value;
  if(!weekDate){alert('Bitte Wochenbeginn angeben.');return;}
  // Auflösen was gespeichert werden soll
  const resolved=_vsMatchData.map((m,i)=>{
    const pts=parseInt(document.getElementById('vsr-pts-'+i)?.value)||0;
    let finalName,renameFrom=null;
    if(m.status==='exact'){
      finalName=m.dbName;
    }else if(m.status==='fuzzy'){
      const choice=document.querySelector(`input[name="vsr-c-${i}"]:checked`)?.value||'db';
      if(choice==='ss'){finalName=m.recognized;renameFrom=m.dbName;}
      else finalName=m.dbName;
    }else{
      const linked=document.getElementById('vsr-link-'+i)?.value||'__new__';
      finalName=linked==='__new__'?m.recognized:linked;
    }
    return{name:finalName,pts,rank:m.rank||(i+1),renameFrom};
  }).filter(e=>e.name&&e.pts>0);
  if(!resolved.length){alert('Keine gültigen Einträge.');return;}
  const btn=document.getElementById('vs-save-btn');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
  try{
    // 1. DB-Umbenennungen (Screenshot-Name gewählt)
    const toRename=resolved.filter(e=>e.renameFrom);
    for(const e of toRename){
      const old=encodeURIComponent(e.renameFrom),n=JSON.stringify({name:e.name}),pn=JSON.stringify({player_name:e.name});
      await fetch(SB+'/rest/v1/ws_players?name=eq.'+old,{method:'PATCH',headers:H,body:n});
      await fetch(SB+'/rest/v1/ws_participation?player_name=eq.'+old,{method:'PATCH',headers:H,body:pn});
      await fetch(SB+'/rest/v1/vs_entries?player_name=eq.'+old,{method:'PATCH',headers:H,body:pn});
      await fetch(SB+'/rest/v1/ws_player_history?player_name=eq.'+old,{method:'PATCH',headers:H,body:pn});
    }
    // 2. Neue Spieler anlegen
    const knownNames=new Set(APP.data.players.map(p=>p.name.toLowerCase()));
    toRename.forEach(e=>knownNames.add(e.name.toLowerCase()));
    const newPlayers=resolved.filter(e=>!knownNames.has(e.name.toLowerCase()));
    if(newPlayers.length){
      const nr=await fetch(SB+'/rest/v1/ws_players',{method:'POST',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify(newPlayers.map(e=>({name:e.name,role:'R3',access_enabled:false})))});
      if(!nr.ok)throw new Error('Spieler anlegen: '+await nr.text());
    }
    if(toRename.length||newPlayers.length)APP.data.players=await sbGet('ws_players?order=name.asc&select=name,role,access_enabled,password_hash');
    // 3. Woche anlegen/finden
    let week=(APP.data.vsWeeks||[]).find(w=>w.week_start===weekDate);
    if(!week){
      const wr=await fetch(SB+'/rest/v1/vs_weeks',{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({week_start:weekDate})});
      if(!wr.ok)throw new Error(await wr.text());
      week=(await wr.json())[0];
    }
    // 4. Einträge speichern
    await fetch(SB+'/rest/v1/vs_entries?week_id=eq.'+week.id,{method:'DELETE',headers:H});
    const body=resolved.map(e=>({week_id:week.id,player_name:e.name,pts:e.pts,rank:e.rank}));
    const er=await fetch(SB+'/rest/v1/vs_entries',{method:'POST',headers:H,body:JSON.stringify(body)});
    if(!er.ok)throw new Error(await er.text());
    const[vsw,vse]=await Promise.all([sbGet('vs_weeks?order=week_start.desc'),sbGet('vs_entries?order=pts.desc')]);
    APP.data.vsWeeks=vsw;APP.data.vsEntries=vse;
    APP.vsWeekId=week.id;APP.vsView='ranking';
    renderPage();
  }catch(e){
    alert('Fehler: '+e.message);
    if(btn){btn.textContent='Speichern';btn.disabled=false;}
  }
}
