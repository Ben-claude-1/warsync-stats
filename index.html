function _nameSimilarity(a,b){
  a=(a||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  b=(b||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!a||!b)return 0;if(a===b)return 1;
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return 1-dp[m][n]/Math.max(m,n);
}
function _bestVsMatch(name){
  let best=null,bestScore=0;
  for(const kp of APP.data.players){
    const s=_nameSimilarity(name,kp.name);
    if(s>bestScore){best=kp;bestScore=s;}
  }
  if(bestScore>=0.72)return{player:best,score:bestScore,status:bestScore>=0.999?'exact':'fuzzy'};
  return null;
}
let _vsMatchData=[];
function vsResultTableHtml(players){
  _vsResultData=[...players].sort((a,b)=>(a.rank||999)-(b.rank||999));
  _vsMatchData=_vsResultData.map(p=>{
    const m=_bestVsMatch(p.name);
    return{recognized:p.name,dbName:m?m.player.name:null,pts:p.pts,rank:p.rank,status:m?m.status:'none'};
  });
  const counts={exact:0,fuzzy:0,none:0};
  _vsMatchData.forEach(m=>counts[m.status=(m.status||'none')]++);
  const bgColor={exact:'#f0fff4',fuzzy:'#fffde7',none:'#fff8f0'};
  const badgeHtml={exact:'<span style="color:var(--win);font-weight:700;font-size:14px">✓</span>',fuzzy:'<span style="color:#e67e22;font-weight:700;font-size:14px">≈</span>',none:'<span style="color:var(--loss);font-weight:700;font-size:14px">?</span>'};
  const activePlayers=APP.data.players.filter(p=>!isInactive(p.name)).map(p=>p.name).sort((a,b)=>a.localeCompare(b));
  const makeOpts=(preselect)=>'<option value="">– Allianz-Spieler wählen –</option>'+activePlayers.map(n=>`<option value="${n.replace(/"/g,'&quot;')}"${n===preselect?' selected':''}>${n}</option>`).join('');
  const rows=_vsMatchData.map((m,i)=>{
    let nameCell;
    if(m.status==='exact'){
      nameCell=`<span style="font-weight:600;font-size:13px">${m.dbName}</span><input type="hidden" id="vsr-link-${i}" value="${(m.dbName||'').replace(/"/g,'&quot;')}">`;
    }else if(m.status==='fuzzy'){
      nameCell=`<div style="font-size:10px;color:var(--tx3);margin-bottom:4px">Screenshot: <b>${m.recognized}</b></div>
        <select id="vsr-link-${i}" class="fi" style="width:100%;padding:3px 6px;font-size:12px;margin:0">${makeOpts(m.dbName)}</select>`;
    }else{
      nameCell=`<div style="font-size:10px;color:var(--tx3);margin-bottom:4px">Nicht erkannt: <b>${m.recognized}</b></div>
        <select id="vsr-link-${i}" class="fi" style="width:100%;padding:3px 6px;font-size:12px;margin:0;border-color:var(--loss)">${makeOpts('')}</select>`;
    }
    return`<tr style="background:${bgColor[m.status]}">
      <td style="text-align:center;font-size:11px;color:var(--tx3);padding:4px;white-space:nowrap">${m.rank||i+1}</td>
      <td style="text-align:center;padding:4px">${badgeHtml[m.status]}</td>
      <td style="padding:4px 8px">${nameCell}</td>
      <td style="text-align:right;padding:4px;white-space:nowrap"><input type="number" class="fi" id="vsr-pts-${i}" value="${m.pts||''}" style="width:100px;text-align:right;padding:3px 6px;font-size:12px;margin:0"></td>
    </tr>`;
  }).join('');
  return`<div style="display:flex;gap:16px;margin-bottom:8px;font-size:12px;flex-wrap:wrap">
    <span style="color:var(--win)">✓ ${counts.exact} exakt</span>
    <span style="color:#e67e22">≈ ${counts.fuzzy} bitte bestätigen</span>
    <span style="color:var(--loss)">? ${counts.none} manuell zuordnen</span>
    <span style="color:var(--tx3)">${_vsMatchData.length} gesamt</span>
  </div>
  <div style="max-height:500px;overflow-y:auto">
  <table style="width:100%"><thead><tr><th style="padding:4px">#</th><th></th><th>Spieler</th><th style="text-align:right">Punkte</th></tr></thead>
  <tbody>${rows}</tbody></table></div>
  <div style="font-size:11px;color:var(--tx3);margin-top:6px">Gelb = korrekten Allianz-Spieler bestätigen · Orange = manuell zuordnen · Es werden keine neuen Spieler angelegt</div>`;
}

async function vsAnalyze(){
  const files=document.getElementById('vs-shots')?.files;
  if(!files||!files.length){alert('Bitte Screenshots auswählen.');return;}
  const statusEl=document.getElementById('vs-analyze-status');
  const btn=document.getElementById('vs-analyze-btn');
  if(btn)btn.disabled=true;
  const stop=_startAnalysisProgress(statusEl);
  try{
    const images=await Promise.all(Array.from(files).map(f=>new Promise((res,rej)=>{
      const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);
    })));
    const knownPlayers=APP.data.players.map(p=>p.name);
    const resp=await fetch(VISION_URL()+'/analyze-vs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,known_players:knownPlayers})});
    if(!resp.ok)throw new Error(`Vision-Server: HTTP ${resp.status}`);
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    const rs=document.getElementById('vs-result-section');
    const rt=document.getElementById('vs-result-table');
    if(rs)rs.style.display='';
    if(rt)rt.innerHTML=vsResultTableHtml(data.players||[]);
    const cnt=(data.players||[]).length;
    const perImg=(data.per_image||[]).join(' · ');
    const warn=(data.warnings||[]).length?`<br><span style="color:var(--loss);font-size:11px">${(data.warnings||[]).join(' · ')}</span>`:'';
    stop(true,`<span style="color:var(--win)">✓ ${cnt} Spieler erkannt</span>${warn}<br><span style="font-size:11px;color:var(--tx3)">${perImg}</span>`);
  }catch(e){
    stop(false,`<span style="color:var(--loss)">❌ ${e.message}</span>`);
  }
  if(btn)btn.disabled=false;
}

async function vsSave(){
  const weekDate=document.getElementById('vs-week-date')?.value;
  if(!weekDate){alert('Bitte Wochenbeginn angeben.');return;}
  // Alle Zuordnungen auslesen
  const missing=_vsMatchData.filter((_,i)=>!(document.getElementById('vsr-link-'+i)?.value));
  if(missing.length){alert(`${missing.length} Spieler noch nicht zugeordnet — bitte alle Dropdowns ausfüllen.`);return;}
  const resolved=_vsMatchData.map((m,i)=>({
    name:document.getElementById('vsr-link-'+i)?.value||'',
    pts:parseInt(document.getElementById('vsr-pts-'+i)?.value)||0,
    rank:m.rank||(i+1)
  })).filter(e=>e.name&&e.pts>0);
  if(!resolved.length){alert('Keine gültigen Einträge.');return;}
  const btn=document.getElementById('vs-save-btn');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
  try{
    // Woche anlegen/finden
    let week=(APP.data.vsWeeks||[]).find(w=>w.week_start===weekDate);
    if(!week){
      const wr=await fetch(SB+'/rest/v1/vs_weeks',{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({week_start:weekDate})});
      if(!wr.ok)throw new Error(await wr.text());
      week=(await wr.json())[0];
    }
    // Einträge speichern (immer Allianz-Namen)
    await fetch(SB+'/rest/v1/vs_entries?week_id=eq.'+week.id,{method:'DELETE',headers:H});
    const body=resolved.map(e=>({week_id:week.id,player_name:e.name,pts:e.pts,rank:e.rank}));
    const er=await fetch(SB+'/rest/v1/vs_entries',{method:'POST',headers:H,body:JSON.stringify(body)});
    if(!er.ok)throw new Error(await er.text());
    const[vsw,vse]=await Promise.all([sbGet('vs_weeks?order=week_start.desc'),sbGet('vs_entries?order=pts.desc')]);
    APP.data.vsWeeks=vsw;APP.data.vsEntries=vse;
    APP.vsWeekId=week.id;APP.vsView='ranking';
    renderPage();
  }catch(e){
    alert('Fehler: '+e.message);
    if(btn){btn.textContent='Speichern';btn.disabled=false;}
  }
}
async function vsApplyFix(oldName,idx){
  const newName=document.getElementById('vs-fix-'+idx)?.value;
  if(!newName){alert('Bitte einen Allianz-Spieler wählen.');return;}
  const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
  try{
    const r=await fetch(SB+'/rest/v1/vs_entries?player_name=eq.'+encodeURIComponent(oldName),{method:'PATCH',headers:H,body:JSON.stringify({player_name:newName})});

    APP.data.vsEntries=await sbGet('vs_entries?order=pts.desc');

}

// Drag & Drop handlers
function dragStart(e,name,fromZone){
  APP.selectedChip=name;APP.selectedFromZone=fromZone;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',name);
  // delay so the element isn't hidden before the drag ghost is captured
  requestAnimationFrame(()=>{const el=document.getElementById('chip-'+name.replace(/\s/g,'_'));if(el)el.classList.add('dragging');});}
function dragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.zc').forEach(el=>el.classList.remove('drop-target'));
  APP.selectedChip=null;APP.selectedFromZone=null;
  renderPage();}
function handleDrop(e,toZone){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.zc').forEach(el=>el.classList.remove('drop-target'));
  if(APP.selectedChip)moveChip(APP.selectedChip,APP.selectedFromZone,toZone);}
function handleDropBld(e,toZone,toBld){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.zc').forEach(el=>el.classList.remove('drop-target'));
  document.querySelectorAll('.bld-sub').forEach(el=>{const m=BLD_META[el.dataset.bld];if(m)el.style.background=m.color+'0d';});
  if(APP.selectedChip)moveChip(APP.selectedChip,APP.selectedFromZone,toZone,toBld);
}
function dragEnterZone(e,zone){e.preventDefault();document.getElementById('zone-'+zone).classList.add('drop-target');}
function dragLeaveZone(e,zone){
  const el=document.getElementById('zone-'+zone);
  if(el&&!el.contains(e.relatedTarget))el.classList.remove('drop-target');}

// Tap-to-select (mobile)
function selectChip(name,zone){
  if(APP.selectedChip===name){APP.selectedChip=null;APP.selectedFromZone=null;}
  else{APP.selectedChip=name;APP.selectedFromZone=zone;}
  renderPage();}
function dropToZone(zone){
  if(!APP.selectedChip)return;
  if(APP.selectedFromZone===zone){APP.selectedChip=null;APP.selectedFromZone=null;renderPage();return;}
  moveChip(APP.selectedChip,APP.selectedFromZone,zone);
}
function dropToBld(toZone,toBld){
  if(!APP.selectedChip)return;
  const ba=APP.bldAssign||{};
  // Gleicher Spieler im selben Gebäude → deselektieren
  if(APP.selectedFromZone===toZone&&ba[APP.selectedChip]===toBld){
    APP.selectedChip=null;APP.selectedFromZone=null;renderPage();return;
  }
  moveChip(APP.selectedChip,APP.selectedFromZone,toZone,toBld);
}
function moveChip(name,fromZone,toZone,bldKey){
  const t=APP.team;
  const L=getLineup(t);
  if(!APP.bldAssign)APP.bldAssign={};
  // Phase-2-Rolle→Zone: Spieler bleibt in Rollen-Slot, nur Phase-1-Gebäude ändert sich
  // Prüfe tatsächlichen Lineup-Slot (nicht fromZone — Gast-Chips melden z1/z2/z3/z4 als fromZone)
  const _actualRole=['ass','ars','sold'].find(r=>(L[r]||[]).includes(name));
  if(_actualRole&&['z1','z2','z3','z4'].includes(toZone)){
    APP.bldAssign[name]=bldKey||(_zoneBlds[toZone]||[])[0];
    APP.selectedChip=null;APP.selectedFromZone=null;
    setLineupReady(t,true);
    saveWSState();renderPage();return;
  }
  // Standard-Move: aus altem Slot raus, in neuen rein
  if(fromZone&&L[fromZone])L[fromZone]=L[fromZone].filter(n=>n!==name);
  Object.keys(L).forEach(k=>{if(k!==toZone)L[k]=L[k].filter(n=>n!==name);});
  if(!L[toZone])L[toZone]=[];
  if(!L[toZone].includes(name))L[toZone].push(name);
  // Gebäude-Zuweisung
  if(bldKey&&BLD_META[bldKey]){
    APP.bldAssign[name]=bldKey;
  } else if(['z1','z2','z3','z4'].includes(toZone)){
    autoAssignBld(name,toZone,L);
  } else if(toZone==='ars'){
    autoAssignBld(name,'z2',{z2:L.ars||[]});
  } else if(toZone==='sold'){
    autoAssignBld(name,'z4',{z4:L.sold||[]});
  } else if(toZone==='ass'){
    APP.bldAssign[name]='infozentrum';
  } else if(toZone==='sup'){
    delete APP.bldAssign[name];
  }
  setLineup(t,L);
  APP.selectedChip=null;APP.selectedFromZone=null;
  setLineupReady(t,true);
  saveWSState();
  renderPage();}

function autoAssign(){
  const t=APP.team;
  const teamPool=Object.entries(APP.teamAssign).filter(([,v])=>v===t).map(([k])=>k);
  const seen=new Set();
  const rawPool=teamPool.length?teamPool:[...APP.accepted];
  const pool=rawPool.filter(n=>{
    if(!n||seen.has(n)||isInactive(n))return false;
    seen.add(n);return true;
  }).sort((a,b)=>wsPower(b)-wsPower(a));

  const newL={ass:[],ars:[],sold:[],sup:[],z1:[],z2:[],z3:[],z4:[]};
  if(!APP.bldAssign)APP.bldAssign={};
  pool.forEach(n=>delete APP.bldAssign[n]);

  const ts=getZoneSlots(t);
  const supN=ts.sup||0;

  // Springer: schwächste N (kein Gebäude). Achtung: slice(-0) === slice(0) → gesondert behandeln.
  newL.sup=supN===0?[]:(pool.length>supN?pool.slice(-supN):pool.slice());
  const ph1=pool.slice(0,pool.length-newL.sup.length); // alle außer Springer

  // Z5-Rollen nach Stärke: stärkste → Silo, nächste → Arsenal, nächste → Söldner
  // Constraint: jede Zone muss mindestens 1 permanenten Spieler behalten
  const ph1BldKeysEarly=['infozentrum','oelraf1','sciencehub','oelraf2','laz1','laz2','laz3','laz4'];
  const bldOrdEarly=(APP.buildingOrder||ph1BldKeysEarly).filter(k=>ph1BldKeysEarly.includes(k));
  const _bzE={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
  // Slot-Folge aus den eingestellten Zahlen bauen. Vorher lief das stumpf reihum über
  // alle acht Gebäude und las getBldSlots gar nicht — ein Gebäude mit 0 Slots bekam
  // trotzdem Spieler, eines mit 3 bekam zu viele. Die Zonen-Anzeige rechnet Phase-1-
  // Gäste (Silo/Arsenal/Söldner) gegen dieselbe Kapazität, deshalb zählen die hier mit.
  // Reihum bleibt es innerhalb der Kapazität: erst bekommt jedes Gebäude einen Spieler,
  // dann der Reihe nach den zweiten. So gehen die Stärksten auf die wichtigsten Gebäude.
  const bldCap=getBldSlots(t);
  const slotSeqE=[];
  {
    const used={};
    let platziert=true;
    while(slotSeqE.length<ph1.length&&platziert){
      platziert=false;
      for(const bk of bldOrdEarly){
        if(slotSeqE.length>=ph1.length)break;
        if((used[bk]||0)>=(bldCap[bk]||0))continue;
        used[bk]=(used[bk]||0)+1;slotSeqE.push(bk);platziert=true;
      }
    }
  }
  // Hilfsfunktion: Anzahl Zonen mit permanentem Spieler ab Index 'off'
  const zonesFrom=off=>{const zs=new Set();for(let i=off;i<slotSeqE.length;i++){const z=_bzE[slotSeqE[i]];if(z)zs.add(z);}return zs.size;};
  let assN=ts.ass||0,arsN=ts.ars||0,soldN=ts.sold||0;
  // Kappen: nicht mehr als ph1.length Z5-Spieler
  while(assN+arsN+soldN>ph1.length){if(soldN>0)soldN--;else if(arsN>0)arsN--;else assN--;}
  // Reduziere Z5 (unwichtigste zuerst) bis alle 4 Zonen mindestens 1 Spieler haben
  const needZones=Math.min(4,ph1.length);
  while(assN+arsN+soldN>0&&zonesFrom(assN+arsN+soldN)<needZones){
    if(soldN>0)soldN--;else if(arsN>0)arsN--;else if(assN>0)assN--;else break;
  }
  let off=0;
  newL.ass=ph1.slice(off,off+assN); off+=assN;
  newL.ars=ph1.slice(off,off+arsN); off+=arsN;
  newL.sold=ph1.slice(off,off+soldN); off+=soldN;
  const zonePlayers=ph1.slice(off); // bleiben die ganze Zeit in ihren Zonen

  // Phase-1-Gebäude-Zuteilung: slotSeqE und _bzE bereits oben definiert.
  // Reichen die Slots nicht für alle, bleiben die Schwächsten ohne Gebäude — sie
  // landen unten in keiner Zone und stehen weiter im Pool zum Verteilen von Hand.
  ph1.forEach((name,i)=>{if(slotSeqE[i])APP.bldAssign[name]=slotSeqE[i];});
  const ohnePlatz=ph1.length-slotSeqE.length;

  // Zone-Spieler (permanent) in z1-z4 einsortieren
  zonePlayers.forEach(name=>{
    const zone=_bzE[APP.bldAssign[name]];
    if(zone)newL[zone].push(name);
  });

  // --- Minimaler Shift (Phase 2) ---
  // Z5-Spieler verlassen ihre Phase-1-Gebäude ab Min 10.
  // Spieler von den UNWICHTIGSTEN Gebäuden (letzte N in zonePlayers) springen in die geräumten wichtigen Slots.
  // Innerhalb dieser Gruppe: stärkster Shifter → wichtigstes geräumtes Gebäude.
  const z5Count=newL.ass.length+newL.ars.length+newL.sold.length;
  const vacatedSlots=slotSeqE.slice(0,z5Count); // wichtigste Gebäude (von Z5 geräumt)
  if(!APP.bldAssignPh2)APP.bldAssignPh2={};
  ph1.forEach(n=>delete APP.bldAssignPh2[n]);
  const shifterStart=Math.max(0,zonePlayers.length-z5Count);
  zonePlayers.forEach((n,i)=>{
    if(!APP.bldAssign[n])return;   // ohne Phase-1-Gebäude auch keine Phase-2-Zuordnung
    if(i>=shifterStart&&vacatedSlots[i-shifterStart]){
      APP.bldAssignPh2[n]=vacatedSlots[i-shifterStart];
    } else {
      APP.bldAssignPh2[n]=APP.bldAssign[n];
    }
  });

  setLineup(t,newL);
  setLineupReady(t,true);
  APP.selectedChip=null;
  saveWSState();
  renderPage();
  // Nicht stillschweigend übergehen: sonst wundert man sich, wo die Spieler geblieben sind.
  if(ohnePlatz>0)alert(`${ohnePlatz} Spieler passen nicht in die eingestellten Gebäude-Slots (${slotSeqE.length} Plätze für ${ph1.length} Spieler) und stehen weiter im Pool.\n\nEntweder Slots erhöhen oder von Hand verteilen.`);
}

function buildAufstellungMail(t){
  const L=getLineup(t);
  const ba=APP.bldAssign||{};
  const time=t==='A'?'13:00':'22:00';
  const stealZone=APP.teamSide==='left'?'z4':APP.teamSide==='right'?'z2':null;
  const BLD_SHORT={
    infozentrum:'Infozentrum',oelraf1:'Ölraf I',oelraf2:'Ölraf II',
    sciencehub:'Science Hub',laz1:'Laz I',laz2:'Laz II',laz3:'Laz III',laz4:'Laz IV',
  };
  const assSet=new Set(L.ass||[]),arsSet=new Set(L.ars||[]),soldSet=new Set(L.sold||[]);
  const ba2=APP.bldAssignPh2||{};
  function ph2(n){
    if(assSet.has(n))return'→ Silo (Z5) ab Min 10';
    if(arsSet.has(n))return'→ Arsenal (Z5) ab Min 10';
    if(soldSet.has(n))return'→ Söldner (Z5) ab Min 10';
    const p2=ba2[n];
    if(p2&&p2!==ba[n])return`→ ${BLD_SHORT[p2]||p2} ab Min 10 (Shift)`;
    return'bleibt';
  }
  const lines=[];
  const intro=APP.mailText[t]&&APP.mailText[t].trim();
  if(intro)lines.push(intro,'');
  lines.push(`Team ${t} · ${time} Uhr – Aufstellung`);
  lines.push('');
  const zoneDef=[
    {key:'z1',lbl:'ZONE 1 (Infozentrum + Ölraf I)'},
    {key:'z2',lbl:'ZONE 2 (2× Feldlazarett)'},
    {key:'z3',lbl:'ZONE 3 (Ölraf II + Science Hub)'},
    {key:'z4',lbl:'ZONE 4 (2× Feldlazarett)'},
  ];
  // Z5-Gäste: Z5-Spieler in einer Zone anhand bldAssign
  const _bz={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',
             oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
  const z5All=[...assSet,...arsSet,...soldSet];
  function guestsInZone(zk){return z5All.filter(n=>_bz[ba[n]]===zk);}
  zoneDef.forEach(({key,lbl})=>{
    const isSteal=key===stealZone;
    const perm=L[key]||[];
    const guests=guestsInZone(key);
    const all=[...guests,...perm]; // Z5-Spieler zuerst (stärkste)
    lines.push(isSteal?`${lbl} ⚠ STEAL:`:`${lbl}:`);
    if(isSteal){
      lines.push('  leer lassen');
    } else if(!all.length){
      lines.push('  (leer)');
    } else {
      all.forEach(n=>{
        const bShort=BLD_SHORT[ba[n]]||'';
        lines.push(`  ${n} – ${bShort?bShort+' · ':''}${ph2(n)}`);
      });
    }
    lines.push('');
  });
  if((L.sup||[]).length){
    lines.push('🛡 SPRINGER:');
    L.sup.forEach(n=>lines.push(`  ${n} – Kisten sammeln · ab Min 25 freie Gebäude${stealZone?' · Steal-Zone beobachten':''}`));
    lines.push('');
  }
  lines.push('ZONE 5 (ab Min 10:00):');
  if((L.ass||[]).length)lines.push(`  Silo: ${[...assSet].join(', ')}`);
  if((L.ars||[]).length)lines.push(`  Arsenal: ${[...arsSet].join(', ')}`);
  if((L.sold||[]).length)lines.push(`  Söldner: ${[...soldSet].join(', ')}`);
  return lines.join('\n').trim();
}

function regStats(name,since){
  const parts=APP.data.participation.filter(x=>{
    if(x.player_name!==name)return false;
    const ev=APP.data.events.find(e=>e.id===x.event_id);
    return ev&&(!since||ev.event_date>=since);
  });
  return{reg:parts.filter(x=>x.registered!==false).length,played:parts.filter(x=>x.played).length,total:parts.length};
}

const LS_KEY='warsync_ws_state';

// Einteilung, blieben sonst mit den Spielern der Vorwoche stehen und würden
// über APP.accepted sogar wieder als Auto-Verteil-Pool herhalten.
// Unberührt bleiben Gebäude-Reihenfolge, Gebäude-Slots und die Mail-Texte.
function resetWSAnmeldung(){
  const belegt=Object.values(APP.teamAssign).filter(v=>v==='A'||v==='B').length;
  const leer={ass:[],ars:[],sold:[],sup:[],z1:[],z2:[],z3:[],z4:[]};
  const plaene=['A','B'].reduce((s,t)=>s+Object.values(getLineup(t)||{}).flat().length,0);
  if(!confirm('Wüstensturm für die neue Woche zurücksetzen?\n\n'
    +'· Team-Einteilung ('+belegt+' Spieler) wird geleert\n'
    +'· Aufstellungen beider Teams ('+plaene+' Zuweisungen) werden verworfen\n\n'
    +'Gebäude-Reihenfolge, Gebäude-Slots und die Mail-Texte bleiben erhalten.'))return;
  APP.teamAssign={};APP.anmeldungClosed=false;
  APP.lineupA={...leer};APP.lineupB={...leer};
  APP.lineupReadyA=false;APP.lineupReadyB=false;

  // Vorwoche der Auto-Aufstellung weiter als Rückfall-Pool
  APP.accepted=APP.data.players.filter(p=>p.active!==false).map(p=>p.name);

}
function saveWSState(){
  const payload={
    savedAt:new Date().toISOString(),
    wsStateWeek:getNextFriday(),
    teamAssign:APP.teamAssign,
    anmeldungClosed:APP.anmeldungClosed,
    lineupA:APP.lineupA,lineupB:APP.lineupB,
    lineupReadyA:APP.lineupReadyA,lineupReadyB:APP.lineupReadyB,
    bldSlotsA:APP.bldSlotsA,bldSlotsB:APP.bldSlotsB,
    buildingOrder:APP.buildingOrder,bldAssign:APP.bldAssign,bldAssignPh2:APP.bldAssignPh2,
    stratCardOpen:APP.stratCardOpen,
    mailText:APP.mailText,
    mailGeneral:APP.mailGeneral,
    teamSide:APP.teamSide,
    infoCardOpen:APP.infoCardOpen,
    wsStrength:APP.wsStrength,
  };
  try{localStorage.setItem(LS_KEY,JSON.stringify(payload));}catch(e){}
  plannerPush('ws',payload);
}
function loadWSState(){
  try{
    const s=plannerResolve('ws',LS_KEY);
    if(!s)return;
    if(s.teamSide)APP.teamSide=s.teamSide;
    if(s.infoCardOpen!==undefined)APP.infoCardOpen=s.infoCardOpen;
    if(s.wsStrength==='hero'||s.wsStrength==='t1')APP.wsStrength=s.wsStrength;
    if(s.teamAssign&&typeof s.teamAssign==='object')APP.teamAssign=s.teamAssign;
    if(s.anmeldungClosed!==undefined)APP.anmeldungClosed=s.anmeldungClosed;
    // Auto-Reset: Wenn der gespeicherte WS-Freitag in der Vergangenheit liegt → neue Woche
    {const _today=new Date().toISOString().slice(0,10);if(s.wsStateWeek&&_today>s.wsStateWeek){APP.teamAssign={};APP.anmeldungClosed=false;}}
    if(s.lineupA)APP.lineupA=s.lineupA;
    if(s.lineupB)APP.lineupB=s.lineupB;
    if(s.lineupReadyA!==undefined)APP.lineupReadyA=s.lineupReadyA;
    if(s.lineupReadyB!==undefined)APP.lineupReadyB=s.lineupReadyB;
    // Aktuelle bldSlots-Felder
    if(s.bldSlotsA)APP.bldSlotsA={...APP.bldSlotsA,...s.bldSlotsA};
    if(s.bldSlotsB)APP.bldSlotsB={...APP.bldSlotsB,...s.bldSlotsB};
    // Migration: alte zoneSlotsA/B + arsSlots/soldSlots → bldSlotsA/B
    ['A','B'].forEach(team=>{
      const oldZone=s['zoneSlots'+team];
      const oldArs=s.arsSlots, oldSold=s.soldSlots;
      const target=APP['bldSlots'+team];
      // Pro Zone Summe → auf primäres Gebäude allokieren, Rest auf sekundäres (gleichmäßig)
      function distribute(z,bldA,bldB){
        if(!oldZone||oldZone[z]===undefined||s.bldSlotsA||s.bldSlotsB)return;
        const total=oldZone[z]||0;
        target[bldA]=Math.ceil(total/2);
        target[bldB]=Math.floor(total/2);
      }
      distribute('z1','oelraf1','infozentrum');
      distribute('z2','laz2','laz4');
      distribute('z3','oelraf2','sciencehub');
      distribute('z4','laz1','laz3');
      if(!s.bldSlotsA&&!s.bldSlotsB){
        if(oldZone&&oldZone.ass!==undefined)target.silo=oldZone.ass;
        if(oldZone&&oldZone.sup!==undefined)target.oelquellen=oldZone.sup;
        if(oldArs!==undefined)target.arsenal=oldArs;
        if(oldSold!==undefined)target.soeldner=oldSold;
      }
    });
    if(Array.isArray(s.buildingOrder)&&s.buildingOrder.length)APP.buildingOrder=s.buildingOrder;
    if(s.bldAssign&&typeof s.bldAssign==='object')APP.bldAssign=s.bldAssign;
    if(s.bldAssignPh2&&typeof s.bldAssignPh2==='object')APP.bldAssignPh2=s.bldAssignPh2;
    if(s.stratCardOpen!==undefined)APP.stratCardOpen=s.stratCardOpen;
    // Migration: alte gespeicherte lineups ohne ars/sold ergänzen
    ['A','B'].forEach(t=>{
      const L=APP['lineup'+t];
      if(L){if(!L.ars)L.ars=[];if(!L.sold)L.sold=[];}
    });
    if(s.mailText)APP.mailText=s.mailText;
    if(typeof s.mailGeneral==='string'){
      // Migration: alten langen Default-Text aus localStorage werfen (begann mit "🏜 Wüstensturm – Taktik")
      APP.mailGeneral=s.mailGeneral.startsWith('🏜 Wüstensturm – Taktik')?'':s.mailGeneral;
    }
    // Einmalige Migration: stale teamAssign-Einträge alter hardcodierter Inaktiv-Spieler entfernen
    if(!localStorage.getItem('ws_mig_v2')){
      ['ChrisPiii','Dani3371','Goramar','Hurikan666','Kogse','Lulllull',
       'MaidenofShadows','saltycereal','Sol Aeternus','StylesX','Vikotnik','xArticulate','xcape']
      .forEach(n=>{delete APP.teamAssign[n];});
      localStorage.setItem('ws_mig_v2','1');
      saveWSState();
    }
  }catch(e){console.warn('loadWSState parse-Fehler — gespeicherter Stand bleibt unverändert:',e);}
}

      ${avatarImg(p.name,38,'border-radius:8px',`<div class="mav" style="background:${inactive?'#eee':bg};color:${inactive?'#bbb':color};font-size:16px">${inactive?'✕':icon}</div>`)}

  function groupHeader(role){const m=GROUP_META[role]||{label:role,c:'#8892a4'};return`<div style="padding:8px 14px 4px;font-size:11px;font-weight:800;color:${m.c};letter-spacing:.6px;background:${m.c}11;border-bottom:1px solid ${m.c}33">── ${m.label} ──</div>`;}

function wsPlayerProfile(name){
  const p=APP.data.players.find(x=>x.name===name);
  if(!p)return`<div class="loader">Spieler nicht gefunden.</div>`;
  const allParts=APP.data.participation.filter(x=>x.player_name===name);
  const allEvts=allParts.map(x=>({...x,ev:APP.data.events.find(e=>e.id===x.event_id)})).filter(x=>x.ev).sort((a,b)=>b.ev.event_date.localeCompare(a.ev.event_date));
  const played=allParts.filter(x=>x.played);
  const missed=allParts.filter(x=>!x.played&&!x.excused);
  const excused=allParts.filter(x=>x.excused);
  const rel=allParts.length?Math.round(played.length/allParts.length*100):null;
  const ap=played.filter(x=>x.individual_pts).reduce((s,x)=>s+(x.individual_pts||0),0);
  const apCount=played.filter(x=>x.individual_pts).length;

  const evtsLost=allEvts.filter(x=>x.played&&x.ev?.result==='loss').length;

  const inactive=isInactive(name);

  const safeName=name.replace(/'/g,"\\'");
  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">

    </div></div>
  </div>`;

  // Spieler-Info (Beruf, Kills, Beliebtheit)
  const profP=p.profession||'Ingenieur';const isKP=profP==='Kriegsführer';
  if(profP||p.kills||p.popularity||p.profession_level){
    h+=`<div class="card" style="margin-bottom:10px"><div class="ch">Spieler-Info</div><div style="padding:12px"><div class="kk-grid">
      <div class="kk-box" style="${isKP?'border:1.5px solid var(--ass);background:var(--ass-l)':''}"><div class="kk-l">Beruf</div><div class="kk-v" style="font-size:14px;color:${isKP?'var(--ass)':'var(--primary)'}">${isKP?'⚔ Kriegsführer':'🔧 Ingenieur'}</div></div>
      ${p.level?`<div class="kk-box"><div class="kk-l">Basis-Level</div><div class="kk-v">${p.level}</div></div>`:''}
      ${GENDER_SYM[p.gender]?`<div class="kk-box"><div class="kk-l">Geschlecht</div><div class="kk-v" style="color:${GENDER_SYM[p.gender].c}">${GENDER_SYM[p.gender].s} ${GENDER_SYM[p.gender].t}</div></div>`:''}
      ${p.profession_level?`<div class="kk-box"><div class="kk-l">Beruf-Level</div><div class="kk-v">${p.profession_level}</div></div>`:''}
      ${p.kills?`<div class="kk-box"><div class="kk-l">Kills</div><div class="kk-v">${fmtK(p.kills)}</div></div>`:''}
      ${p.popularity?`<div class="kk-box"><div class="kk-l">❤ Beliebtheit</div><div class="kk-v">${fmt(p.popularity)}</div></div>`:''}
    </div></div></div>`;
  }
  // Strength box
  if(p.t1||p.t2||p.t3||p.hero_power){
    h+=`<div class="card" style="margin-bottom:10px"><div class="ch">Truppenstärke</div><div style="padding:12px"><div class="kk-grid">
      ${p.t1?`<div class="kk-box"><div class="kk-l">T1</div><div class="kk-v">${p.t1} M</div></div>`:''}
      ${p.t2?`<div class="kk-box"><div class="kk-l">T2</div><div class="kk-v">${p.t2} M</div></div>`:''}
      ${p.t3?`<div class="kk-box"><div class="kk-l">T3</div><div class="kk-v">${p.t3} M</div></div>`:''}
      ${p.t4?`<div class="kk-box"><div class="kk-l">T4</div><div class="kk-v">${p.t4} M</div></div>`:''}
      ${p.total_power?`<div class="kk-box" style="grid-column:1/-1"><div class="kk-l">Gesamtkampfkraft</div><div class="kk-v" style="font-size:18px">${fmt(p.total_power)}</div></div>`:''}
            ${p.hero_power?`<div class="kk-box" style="grid-column:1/-1;border-color:var(--ass)"><div class="kk-l">🦸 Gesamtkraft der Helden</div><div class="kk-v" style="font-size:18px;color:var(--ass)">${fmtMio(p.hero_power)}</div></div>`:''}
    </div></div></div>`;
  }

  // WS stats
  if(allParts.length){
    h+=`<div class="sg"><div class="sb"><div class="sb-l">Gespielt</div><div class="sb-v" style="color:var(--win)">${played.length}</div><div class="sb-s">von ${allParts.length}</div></div><div class="sb"><div class="sb-l">Siege</div><div class="sb-v" style="color:var(--win)">${evtsWon}</div><div class="sb-s">als aktiver Spieler</div></div><div class="sb"><div class="sb-l">Niederlagen</div><div class="sb-v" style="color:var(--loss)">${evtsLost}</div></div><div class="sb"><div class="sb-l">Ø Punkte</div><div class="sb-v">${fmt(avgP)}</div><div class="sb-s">pro Event</div></div>${missed.length?`<div class="sb"><div class="sb-l">Gefehlt</div><div class="sb-v" style="color:var(--loss)">${missed.length}</div></div>`:''}${excused.length?`<div class="sb"><div class="sb-l">Entschuldigt</div><div class="sb-v" style="color:var(--acc)">${excused.length}</div></div>`:''}</div>`;
  }

  // Event history
  if(allEvts.length){
    h+=`<div class="card"><div class="ch">WS-Verlauf</div>`;
    allEvts.forEach(x=>{
      const ev=x.ev;
      const c=x.played?(ev.result==='win'?'var(--win)':'var(--loss)'):(x.excused?'var(--acc)':'var(--loss)');
      const label=x.played?(ev.result==='win'?'Sieg':'Niederlage'):(x.excused?'Entschuldigt':'Gefehlt');
      h+=`<div class="mi">
        <div style="width:34px;height:34px;border-radius:9px;background:${c}22;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${c};flex-shrink:0">${x.played?(ev.result==='win'?'S':'N'):(x.excused?'E':'F')}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${ev.event_date} · Team ${ev.team}</div>

        </div>

          ${x.individual_pts?`<span style="font-size:13px;font-weight:800">${fmt(x.individual_pts)}</span>`:''}
          ${badge(label,c)}
        </div>
      </div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="note">Noch keine WS-Teilnahme erfasst.</div>`;
  }
  return h;
}

// --- ERGEBNIS ERFASSEN ---
function wsErfassenView(){
  // Lineup des aktuellen Teams → vorregistrierte Spieler
  const L=getLineup(APP.team);
  const regSet=new Set([...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[]),
    ...(L.ass||[]),...(L.ars||[]),...(L.sold||[]),...(L.sup||[])]);
  // Pending Event für dieses Team finden (am nächsten in der Zukunft oder gerade abgelaufen)
  const pendingEvt=[...APP.data.events]
    .filter(e=>e.team===APP.team&&(!e.result||e.result==='pending'))
    .sort((a,b)=>b.event_date.localeCompare(a.event_date))[0]||null;
  const defaultDate=pendingEvt?.event_date||new Date().toISOString().split('T')[0];
  const pendingId=pendingEvt?.id||'';
  const players=APP.data.players.filter(p=>!isInactive(p.name)).sort((a,b)=>getT1(b)-getT1(a));
  const pRows=players.map(p=>{
    const safe=p.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    const isReg=regSet.has(p.name)||regSet.size===0; // wenn kein Lineup: alle als registriert
    return`<tr style="${isReg?'':'opacity:0.45'}">
      <td style="font-size:13px;font-weight:600">${p.name}</td>
      <td style="text-align:center"><input type="checkbox" id="ef-reg-${safe}" ${isReg?'checked':''} onchange="efRegChange('${safe}')"></td>
      <td style="text-align:center"><input type="checkbox" id="ef-pld-${safe}"></td>
      <td><input type="number" id="ef-pts-${safe}" class="fi" style="width:110px;text-align:right;padding:3px 6px;font-size:12px;margin:0" placeholder="–" oninput="efPtsInput('${safe}')"></td>
    </tr>`;
  }).join('');
  const pendingNote=pendingEvt?`<div class="note info" style="margin-bottom:12px">Pending Event gefunden: <strong>${pendingEvt.event_date}</strong> · Dieses Event wird mit dem Ergebnis aktualisiert.</div>`:'';
  return`<button class="btn btn-out btn-sm" onclick="APP.wsErfassen=false;renderPage()" style="margin-bottom:12px">← Alle Events</button>
  ${pendingNote}
  <div class="card"><div class="ch">Ergebnis erfassen – Team ${APP.team}</div><div class="cb">
    <input type="hidden" id="ef-pending-id" value="${pendingId}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="fl2"><label>Datum</label><input class="fi" id="ef-date" type="date" value="${defaultDate}"></div>
      <div class="fl2"><label>Gegner</label><input class="fi" id="ef-opp" type="text" placeholder="Allianzname" value="${pendingEvt?.opponent||''}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="fl2"><label>Unsere Punkte</label><input class="fi" id="ef-our" type="number" placeholder="z.B. 327675" oninput="efAutoResult()"></div>
      <div class="fl2"><label>Gegner Punkte</label><input class="fi" id="ef-opp-pts" type="number" placeholder="z.B. 242149" oninput="efAutoResult()"></div>
    </div>
    <div class="fl2"><label>Ergebnis</label>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ok" id="res-win" style="flex:1" onclick="setResult('win')">🏆 Sieg</button>
        <button class="btn btn-no" id="res-loss" style="flex:1" onclick="setResult('loss')">💀 Niederlage</button>
      </div>
    </div>
    <div class="fl2"><label>Screenshots (optional – nur zur Ansicht)</label>
      <input type="file" id="ef-shots" multiple accept="image/*" onchange="efShowPreviews()" style="width:100%;padding:6px 0">
    </div>
    <div id="ef-previews" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
    <div style="font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--tx)">Spieler – Punkte aus Screenshot</div>
    <div style="font-size:11px;color:var(--tx3);margin-bottom:8px">Punkte eintragen → Spieler wird automatisch als <strong>Gespielt</strong> markiert. Spieler ohne Punkte aber mit Angem. ✓ → werden als <strong>Abwesend</strong> gespeichert.</div>
    <div class="scroll-x"><table>
      <thead><tr><th>Spieler</th><th style="text-align:center;white-space:nowrap">Angem.</th><th style="text-align:center">Gespielt</th><th style="text-align:right">Punkte</th></tr></thead>
      <tbody>${pRows}</tbody>
    </table></div>
    <button class="btn btn-sol" style="width:100%;margin-top:14px" id="saveRes2" onclick="saveResult2()">Ergebnis speichern</button>
  </div></div>`;
}

let _resultChoice=null;
function setResult(r){
  _resultChoice=r;
  document.getElementById('res-win').style.background=r==='win'?'var(--win)':'';
  document.getElementById('res-win').style.color=r==='win'?'#fff':'';
  document.getElementById('res-loss').style.background=r==='loss'?'var(--loss)':'';
  document.getElementById('res-loss').style.color=r==='loss'?'#fff':'';}
function efAutoResult(){
  const our=parseInt(document.getElementById('ef-our')?.value)||0;
  const opp=parseInt(document.getElementById('ef-opp-pts')?.value)||0;
  if(our&&opp)setResult(our>opp?'win':'loss');
}
function efShowPreviews(){
  const files=document.getElementById('ef-shots')?.files;
  const box=document.getElementById('ef-previews');
  if(!files||!box)return;
  box.innerHTML='';
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=document.createElement('img');
      img.src=e.target.result;
      img.style.cssText='height:200px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer';
      img.onclick=()=>window.open(e.target.result);
      box.appendChild(img);
    };
    r.readAsDataURL(f);
  });
}
function efRegChange(safe){
  const reg=document.getElementById('ef-reg-'+safe);
  const pld=document.getElementById('ef-pld-'+safe);
  if(reg&&pld&&!reg.checked)pld.checked=false;
}
function efPtsInput(safe){
  const pts=parseInt(document.getElementById('ef-pts-'+safe)?.value)||0;
  const pld=document.getElementById('ef-pld-'+safe);
  const reg=document.getElementById('ef-reg-'+safe);
  if(pld)pld.checked=pts>0;
  if(pts>0&&reg&&!reg.checked)reg.checked=true; // Punkte eingetragen → automatisch angemeldet+gespielt
}

async function saveResult2(){
  const date=document.getElementById('ef-date')?.value;
  const opp=document.getElementById('ef-opp')?.value?.trim();
  const our=parseInt(document.getElementById('ef-our')?.value)||null;
  const oppPts=parseInt(document.getElementById('ef-opp-pts')?.value)||null;
  if(!date||!_resultChoice){alert('Bitte Datum und Ergebnis (Sieg/Niederlage) angeben.');return;}
  const btn=document.getElementById('saveRes2');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const pendingId=document.getElementById('ef-pending-id')?.value||'';
    let eid;
    if(pendingId){
      // Bestehendes pending Event aktualisieren
      const upd=await fetch(SB+'/rest/v1/ws_events?id=eq.'+pendingId,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({event_date:date,opponent:opp||null,our_pts:our,opp_pts:oppPts,result:_resultChoice})});
      if(!upd.ok)throw new Error(await upd.text());
      // Alte Teilnahme-Daten löschen (werden neu gesetzt)
      await fetch(SB+'/rest/v1/ws_participation?event_id=eq.'+pendingId,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
      eid=pendingId;
    }else{
      const evRes=await fetch(SB+'/rest/v1/ws_events',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({event_date:date,team:APP.team,time_slot:APP.team==='A'?'13:00':'22:00',opponent:opp||null,our_pts:our,opp_pts:oppPts,result:_resultChoice})});
      if(!evRes.ok)throw new Error(await evRes.text());
      const [newEv]=await evRes.json();
      eid=newEv.id;
    }
    const players=APP.data.players.filter(p=>!isInactive(p.name));
    const ptsArr=[];
    players.forEach(p=>{
      const safe=p.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const pts=parseInt(document.getElementById('ef-pts-'+safe)?.value)||null;
      if(pts)ptsArr.push({name:p.name,pts});
    });
    ptsArr.sort((a,b)=>b.pts-a.pts);
    const rankMap={};ptsArr.forEach((x,i)=>rankMap[x.name]=i+1);
    const ptsMap=Object.fromEntries(ptsArr.map(x=>[x.name,x.pts]));
    const recs=players.map(p=>{
      const safe=p.name.replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const reg=document.getElementById('ef-reg-'+safe)?.checked!==false;
      const pts=ptsMap[p.name]||null;
      // Gespielt = Punkte vorhanden ODER Gespielt-Checkbox manuell gesetzt
      const pld=pts>0||!!document.getElementById('ef-pld-'+safe)?.checked;
      return{event_id:eid,player_name:p.name,registered:reg,played:pld,excused:false,individual_pts:pts,rank:rankMap[p.name]||null};
    });
    let batches=[];
    for(let i=0;i<recs.length;i+=20)batches.push(recs.slice(i,i+20));
    const stripReg=r=>{const{registered,...rest}=r;return rest;};
    let hasRegCol=true;
    try{await sbPost('ws_participation',batches[0]);}
    catch(e){
      if(e.message?.includes('registered')){hasRegCol=false;await sbPost('ws_participation',batches[0].map(stripReg));}
      else throw e;
    }
    for(let i=1;i<batches.length;i++)await sbPost('ws_participation',hasRegCol?batches[i]:batches[i].map(stripReg));
    if(!hasRegCol)console.warn('SQL needed: ALTER TABLE ws_participation ADD COLUMN registered boolean DEFAULT true;');
    alert('✅ Ergebnis gespeichert!');
    _resultChoice=null;
    await loadData();
    APP.wsErfassen=false;APP.wsEventId=eid;
    setWSView('ergebnis');
  }catch(err){
    alert('Fehler: '+err.message);
    const btn=document.getElementById('saveRes2');
    if(btn){btn.textContent='Ergebnis speichern';btn.disabled=false;}
  }
}

// ── Auto-Verteilung ──
function csAutoAssign(){
  const t=APP.csTeam, pool=csPool(t), slots=csGetSlots(t);
  if(!pool.length){alert('Für Team '+t+' ist noch niemand zugeordnet.\nErst im Tab „Anmeldung" Spieler auf Team A/B verteilen.');return;}
  const plan={};
  // 1) Stärkste werden Assassinen — kein Startgebäude, Ziel Viruslabor
  const assN=Math.min(CS_MAXCAP,slots.ass||0,pool.length);
  pool.slice(0,assN).forEach(n=>plan[n]={s:null,d:'viruslab'});
  // 2) Rest auf die Startgebäude verteilen (stärkster zuerst in das wichtigste)
  const rest=pool.slice(assN);
  const open=[];
  for(const b of CS_START_BLD){const cap=Math.min(CS_MAXCAP,slots[b]||0);for(let i=0;i<cap;i++)open.push(b);}
  rest.forEach((n,i)=>{plan[n]={s:open[i]||null,d:null};});
  // 3) Wechsler für die späten Gebäude ziehen — nie das letzte aus einem Startgebäude
  // Wechsler ziehen. Entfernung spielt keine Rolle — im Spiel wird geportet.
  // Quelle: Gebäude mit den meisten verbleibenden Spielern (verteilt die Abgaben
  // gleichmäßig), bei Gleichstand das unwichtigere. Der Kraftturm gibt nur ab,
  // wenn es sonst keine Quelle gibt. Nie wird der letzte Spieler abgezogen.
  const bleibt=b=>rest.filter(n=>plan[n].s===b&&!plan[n].d).length;
  const rang=b=>CS_START_BLD.indexOf(b);
  for(const lb of CS_LATE_BLD){
    const need=Math.min(CS_MAXCAP,slots[lb]||0);
    for(let k=0;k<need;k++){
      let quellen=CS_START_BLD.filter(b=>bleibt(b)>1);
      const ohneTurm=quellen.filter(b=>b!=='kraftturm');   // Energieturm gibt niemanden ab
      if(ohneTurm.length)quellen=ohneTurm;
      const src=quellen.sort((a,b)=>bleibt(b)-bleibt(a)||rang(b)-rang(a))[0];
      if(!src)break;
      const cand=rest.find(n=>plan[n].s===src&&!plan[n].d);  // stärkster dort
      if(!cand)break;
      plan[cand].d=lb;
    }
  }
  // Innerhalb einer Zeitwelle die Ziele so tauschen, dass sich die Pfeile im Bild
  // nicht kreuzen. Spielerisch irrelevant (es wird geportet), macht das
  // Übersichtsbild aber deutlich leichter lesbar.
  const wellen={};
  CS_LATE_BLD.forEach(b=>{(wellen[CS_BLD[b].from]=wellen[CS_BLD[b].from]||[]).push(b);});
  Object.values(wellen).forEach(ziele=>{
    const mover=rest.filter(n=>plan[n].d&&ziele.includes(plan[n].d));
    if(mover.length<2)return;
    const zielSlots=mover.map(n=>plan[n].d).sort((a,b)=>CS_ANCHOR[a].x-CS_ANCHOR[b].x);
    mover.slice().sort((a,b)=>CS_ANCHOR[plan[a].s].x-CS_ANCHOR[plan[b].s].x)
      .forEach((n,i)=>{plan[n].d=zielSlots[i];});
  });
  csSetPlan(t,plan);csSetReady(t,true);
  APP.csSel=null;csSaveState();renderPage();
}

  csSetPlan(t,{});csSetReady(t,false);

// Wochen-Reset: räumt die Team-Einteilung UND beide Aufstellungen.
// Die Aufstellungen müssen mit weg — sie hängen an der Team-Einteilung, und
// ohne sie zeigt csPool() niemanden mehr an, während die Zuweisungen im
// gespeicherten Plan als unsichtbare Karteileichen weiterlaufen.
// Bewusst unberührt: Fraktion, Partnerallianz und der Allianz-Text. Die
// setzt du je Woche selbst, und der Text ist von Hand geschrieben.
function csResetWoche(){
  const belegt=Object.values(APP.csTeamAssign).filter(v=>v==='A'||v==='B').length;
  const plaene=Object.keys(APP.csPlanA||{}).length+Object.keys(APP.csPlanB||{}).length;
  if(!confirm('Schluchtsturm für die neue Woche zurücksetzen?\n\n'
    +'· Team-Einteilung ('+belegt+' Spieler) wird geleert\n'
    +'· Aufstellungen beider Teams ('+plaene+' Zuweisungen) werden verworfen\n\n'
    +'Fraktion, Partnerallianz und Allianz-Text bleiben erhalten.'))return;
  APP.csTeamAssign={};
  APP.csPlanA={};APP.csPlanB={};
  APP.csReadyA=false;APP.csReadyB=false;

function csSetFaction(t,f){
  if(APP.csFaction[t]===f)return;
  const hatPlan=Object.keys(csGetPlan(t)).length>0;
  if(hatPlan&&!confirm(`Fraktion für Team ${t} auf ${CS_FACTIONS[f].label} umstellen?\n\nDie Aufstellung wird verworfen — die Vorgaben unterscheiden sich stark:\nOrdnungshüter halten Norden und Mitte, Morgenbringer sichern die Probenlager im Süden.\n\nDie Team-Einteilung bleibt unberührt.`))return;
  APP.csFaction[t]=f;
  csSetPlan(t,{});csSetReady(t,false);
  if(t==='B')APP.csSlotsB=null;else APP.csSlotsA=null;   // Vorgaben der neuen Fraktion ziehen
  csSaveState();renderPage();
}
function csSelectChip(name){APP.csSel=APP.csSel===name?null:name;renderPage();}
function csAssign(name,slot){
  const t=APP.csTeam, P=csGetPlan(t);
  if(!P[name])P[name]={s:null,d:null};
  if(slot==='ass'){P[name]={s:null,d:'viruslab'};}
  else if(CS_START_BLD.includes(slot)){P[name].s=slot;if(P[name].d==='viruslab')P[name].d=null;}
  else if(CS_LATE_BLD.includes(slot)){
    if(P[name].d==='viruslab')P[name].d=null;
    P[name].d=slot;
    // Ohne Startgebäude ergibt ein Wechsel keinen Sinn → erstes freies Startgebäude nehmen
    if(!P[name].s)P[name].s=CS_START_BLD.find(b=>csAtStart(t,b).length<CS_MAXCAP)||'kraftturm';
  }
  csSetPlan(t,P);csSetReady(t,true);
  APP.csSel=null;csSaveState();renderPage();
}
function csClearMove(name){
  const t=APP.csTeam,P=csGetPlan(t);

}

// Übernimmt die im Wüstensturm gepflegte Einteilung in den Schluchtsturm.
// modus 'kopieren'    → Wüstensturm behält seine Einteilung
// modus 'verschieben' → Wüstensturm-Einteilung wird danach geleert
function csImportFromWS(modus){
  const ws=Object.entries(APP.teamAssign).filter(([,v])=>v==='A'||v==='B');
  if(!ws.length){alert('Im Wüstensturm ist aktuell keine Team-Einteilung hinterlegt.');return;}
  const vorhanden=Object.values(APP.csTeamAssign).filter(v=>v==='A'||v==='B').length;
  let txt=`${ws.length} Spieler aus der Wüstensturm-Einteilung in den Schluchtsturm übernehmen?`;
  if(vorhanden)txt+=`\n\nACHTUNG: Die bestehende Schluchtsturm-Einteilung (${vorhanden} Spieler) wird dabei überschrieben.`;
  if(modus==='verschieben')txt+='\n\nDie Wüstensturm-Einteilung wird anschliessend geleert.';
  if(!confirm(txt))return;
  APP.csTeamAssign={};
  ws.forEach(([n,v])=>{APP.csTeamAssign[n]=v;});
  csSaveState();
  if(modus==='verschieben'){
    APP.teamAssign={};
    saveWSState();
  }
  renderPage();
}

// ── Persistenz ──
// csTeamAssign ist die von Hand gepflegte Team-A/B-Einteilung. Der Schlüssel darf nicht
// umbenannt werden und wird beim Laden zusammengeführt — eine bestehende Einteilung
// überlebt damit jedes App-Update.
function csSaveState(){
  const payload={
    savedAt:new Date().toISOString(),
    csTeamAssign:APP.csTeamAssign,
    csPlanA:APP.csPlanA,csPlanB:APP.csPlanB,
    csSlotsA:APP.csSlotsA,csSlotsB:APP.csSlotsB,
    csReadyA:APP.csReadyA,csReadyB:APP.csReadyB,
    csFaction:APP.csFaction,csPartner:APP.csPartner,csInfoOpen:APP.csInfoOpen,
    csMsg:APP.csMsg,
    csStrength:APP.csStrength,
  };
  try{localStorage.setItem(CS_LS_KEY,JSON.stringify(payload));}catch(e){}
  plannerPush('cs',payload);
}
function csLoadState(){
  try{
    const s=plannerResolve('cs',CS_LS_KEY);if(!s)return;
    if(s.csTeamAssign&&typeof s.csTeamAssign==='object')APP.csTeamAssign={...APP.csTeamAssign,...s.csTeamAssign};
    const okPlan=p=>p&&typeof p==='object'&&Object.values(p).every(v=>v&&typeof v==='object'&&('s'in v)&&('d'in v));
    if(okPlan(s.csPlanA))APP.csPlanA=s.csPlanA;
    if(okPlan(s.csPlanB))APP.csPlanB=s.csPlanB;
    if(s.csSlotsA&&s.csSlotsA.v===4)APP.csSlotsA=s.csSlotsA;
    if(s.csSlotsB&&s.csSlotsB.v===4)APP.csSlotsB=s.csSlotsB;
    if(s.csReadyA!==undefined)APP.csReadyA=s.csReadyA;
    if(s.csReadyB!==undefined)APP.csReadyB=s.csReadyB;
    if(s.csFaction)APP.csFaction={...APP.csFaction,...s.csFaction};
    if(s.csPartner)APP.csPartner=s.csPartner;
    if(typeof s.csMsg==='string')APP.csMsg=s.csMsg;
    if(s.csInfoOpen!==undefined)APP.csInfoOpen=s.csInfoOpen;
    if(s.csStrength==='hero'||s.csStrength==='t1')APP.csStrength=s.csStrength;
  }catch(e){}
}

function csAufstellung(){
  const t=APP.csTeam,f=csFaction(t),F=CS_FACTIONS[f];
  const pool=csPool(t),P=csGetPlan(t),slots=csGetSlots(t);
  const sel=APP.csSel,unass=csUnassigned(t);
  const V=CS_BLD.viruslab;

  function chip(name,ctx){
    const p=P[name]||{};
    let badge='';
    if(ctx==='start'&&p.d&&p.d!=='viruslab'){
      const c=csTColor(p.d);
      badge=`<button onclick="event.stopPropagation();csClearMove('${_csQ(name)}')" title="Wechsel entfernen"
        style="font-size:9px;padding:1px 5px;border-radius:4px;border:1px solid ${c}66;background:${c}18;color:${c};font-weight:800;cursor:pointer;white-space:nowrap">→ ${CS_BLD[p.d].short} ${csTLabel(p.d)}</button>`;
    }
    if(ctx==='dest'&&p.s){
      badge=`<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:#7f8c8d18;color:#7f8c8d;font-weight:700;white-space:nowrap">von ${CS_BLD[p.s].short}</span>`;
    }
    return`<div class="player-chip${sel===name?' selected':''}" draggable="true"
      ondragstart="csDragStart(event,'${_csQ(name)}')"
      onclick="event.stopPropagation();csSelectChip('${_csQ(name)}')"
      style="display:inline-flex;align-items:center;gap:4px">
      ${avatarImg(name,18,'border-radius:4px;margin-right:1px','')}<span onclick="event.stopPropagation();openPlayer('${_csQ(name)}')" style="cursor:pointer">${name}</span>
      <span class="chip-t1">${powerTag(name,APP.csStrength)}</span>${badge}
    </div>`;
  }
  function box(b,ctx){
    const m=CS_BLD[b];
    const cap=Math.min(CS_MAXCAP,slots[b]||0);
    const inside=ctx==='dest'?csAtDest(t,b):csAtStart(t,b);
    const over=inside.length>CS_MAXCAP;
    const bleiben=ctx==='start'?inside.filter(n=>!(P[n]&&P[n].d&&P[n].d!=='viruslab')).length:inside.length;
    return`<div class="cs-bld" data-bld="${b}"
      ondragover="event.preventDefault();this.classList.add('drop-target')"
      ondragleave="this.classList.remove('drop-target')"
      ondrop="csDrop(event,'${b}')" onclick="csMoveTo('${b}')"
      style="padding:8px 9px;border:1.5px ${sel?'solid':'dashed'} ${m.color}66;border-radius:8px;background:${m.color}0d;cursor:${sel?'pointer':'default'};margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px">
        <span style="font-size:11px;font-weight:700;color:${m.color}">${m.dot} ${m.label}</span>
        <span style="font-size:10px;color:${over?'var(--loss)':'var(--tx3)'};font-weight:${over?'800':'500'};white-space:nowrap">${inside.length}/${cap}</span>
      </div>
      <div style="font-size:9px;color:var(--tx3);margin-bottom:5px">${m.pts}/s · gesamt ${fmt(csTotal(b))} Pkt${ctx==='start'&&bleiben!==inside.length?` · ab 12:00 noch ${bleiben}`:''}</div>
      ${inside.length?inside.map(n=>chip(n,ctx)).join(''):'<div style="font-size:10px;color:var(--tx3);font-style:italic;text-align:center;padding:4px 0">leer</div>'}
      ${over?`<div style="font-size:9px;color:var(--loss);font-weight:700;text-align:center;margin-top:3px">⚠ über dem Spiel-Limit von 5</div>`:''}
    </div>`;
  }
  const ass=csAssassinen(t);
  const moves=csMoves(t);
  const placed=pool.filter(n=>P[n]&&(P[n].s||P[n].d)).length;

  return`
    ${csTeamTabs()}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:${t==='A'?'var(--win-l)':'#eaf3fb'};border:1.5px solid ${t==='A'?'var(--win)':'#2980b9'};border-radius:10px;padding:10px 12px">
        <div style="font-size:11px;font-weight:700;color:${t==='A'?'var(--win)':'#2980b9'};text-transform:uppercase;letter-spacing:.04em">Team ${t} · 16:00 Uhr</div>
        <div style="font-size:12px;color:var(--tx2);margin-top:3px">${pool.length} zugeordnet · ${placed} eingeplant · ${moves.length} Wechsel</div>
      </div>
      <div style="flex:0 0 auto;background:${F.bg};border:1.5px solid ${F.color};border-radius:10px;padding:10px 12px;cursor:pointer" onclick="csSetView('fraktion')">
        <div style="font-size:10px;font-weight:700;color:${F.color};text-transform:uppercase;letter-spacing:.04em">Fraktion</div>
        <div style="font-size:13px;font-weight:800;color:${F.color};margin-top:2px">${F.label}</div>
      </div>
    </div>

    ${strengthPicker(APP.csStrength,'setCsStrength')}
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn-sol" onclick="csAutoAssign()" style="flex:1">⚡ Auto-Verteilen Team ${t}</button>
      <button class="btn btn-out" onclick="csResetLineup()" style="flex:0;white-space:nowrap">↺ Reset</button>
    </div>

    ${sel?`<div class="move-hint">„${sel}" ausgewählt — Gebäude antippen zum Zuweisen</div>`:''}

    ${unass.length?`<div class="card" style="margin-bottom:12px;border:2px solid var(--acc)">
      <div class="ch">🎒 Ohne Zuweisung <span class="ch-sub">${unass.length} Spieler</span></div>
      <div style="padding:8px 10px">${unass.map(n=>chip(n,'start')).join('')}</div>
    </div>`:''}

    <!-- ASSASSINEN -->
    <div class="zc ass" style="grid-column:1/-1;margin-bottom:12px;border:2px solid var(--ass)">
      <div class="zc-hd">
        <div><div class="zc-name" style="color:var(--ass)">⚔ Assassinen — kein festes Startgebäude</div>
        <div class="zc-pts">Stärkste Spieler · ab 12:00 geschlossen ins Viruslabor</div></div>
        <div class="zc-count" style="background:var(--ass)22;color:var(--ass)">${ass.length}/${Math.min(CS_MAXCAP,slots.ass||0)}</div>
      </div>
      <div class="cs-bld" data-bld="ass"
        ondragover="event.preventDefault();this.classList.add('drop-target')"
        ondragleave="this.classList.remove('drop-target')"
        ondrop="csDrop(event,'ass')" onclick="csMoveTo('ass')"
        style="padding:8px 9px;border:1.5px ${sel?'solid':'dashed'} ${V.color}66;border-radius:8px;background:${V.color}0d;cursor:${sel?'pointer':'default'}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px">
          <span style="font-size:11px;font-weight:700;color:${V.color}">${V.dot} Ziel ab 12:00 · ${V.label}</span>
          <span style="font-size:10px;color:var(--tx3)">${V.pts}/s</span>
        </div>
        ${ass.length?ass.map(n=>chip(n,'ass')).join(''):'<div style="font-size:10px;color:var(--tx3);font-style:italic;text-align:center;padding:4px 0">leer</div>'}
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--tx2);line-height:1.5">
        <strong style="color:var(--ass)">Auftrag:</strong> sie stehen nirgends fest. Bis 12:00 sichern sie flexibel die
        Gebäude, die gerade unter Druck stehen — <strong>ab 12:00 alle geschlossen ins Viruslabor</strong> und bis zum Ende halten.
      </div>
    </div>

    <!-- STARTGEBÄUDE -->
    <div class="zc oil" style="grid-column:1/-1;margin-bottom:10px">
      <div class="zc-hd">
        <div><div class="zc-name">🚩 Startaufstellung · ab 0:00</div>
        <div class="zc-pts">Diese 7 Gebäude sind von Beginn an offen</div></div>
        <div class="zc-count" style="background:rgba(0,0,0,.06)">${CS_START_BLD.reduce((s,b)=>s+csAtStart(t,b).length,0)}</div>
      </div>
      ${CS_START_BLD.map(b=>box(b,'start')).join('')}
    </div>

    <!-- WECHSEL -->
    <div class="zc med" style="grid-column:1/-1;margin-bottom:10px">
      <div class="zc-hd">
        <div><div class="zc-name">🔄 Wechsel bei Freischaltung</div>
        <div class="zc-pts">Serumfabriken ab 5:00 · Verteidigungssysteme ab 8:00</div></div>
        <div class="zc-count" style="background:rgba(0,0,0,.06)">${moves.length}</div>
      </div>
      <div class="note info" style="margin:0 0 8px;font-size:11px">
        Hierhin wird <strong>nur aus einem Startgebäude</strong> gewechselt. Wer hier steht, zieht zur genannten Minute um —
        sein Startgebäude zeigt den Wechsel als Badge.
      </div>
      ${CS_LATE_BLD.map(b=>box(b,'dest')).join('')}
    </div>

    <!-- SLOTS -->
    <div class="card" style="margin-bottom:12px">
      <div class="ch">Spieler-Slots <span class="ch-sub">Team ${t} · max. ${CS_MAXCAP} pro Gebäude</span></div>
      <div class="cb">
        <div class="slot-row" style="padding-left:4px">
          <div class="slot-label" style="color:var(--ass);font-weight:700;font-size:12px">⚔ Assassinen</div>
          <div class="slot-btns">
            <button class="slot-btn" onclick="csChangeSlot('ass',-1)">−</button>
            <div class="slot-num">${Math.min(CS_MAXCAP,slots.ass||0)}</div>
            <button class="slot-btn" onclick="csChangeSlot('ass',1)">+</button>
          </div>
        </div>
        <div style="font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px">Startgebäude</div>
        ${CS_START_BLD.map(b=>{const m=CS_BLD[b];return`<div class="slot-row" style="padding-left:4px">
          <div class="slot-label" style="color:${m.color};font-weight:600;font-size:12px">${m.dot} ${m.label}</div>
          <div class="slot-btns">
            <button class="slot-btn" onclick="csChangeSlot('${b}',-1)">−</button>
            <div class="slot-num">${Math.min(CS_MAXCAP,slots[b]||0)}</div>
            <button class="slot-btn" onclick="csChangeSlot('${b}',1)">+</button>
          </div></div>`;}).join('')}
        <div style="font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px">Wechsel dorthin</div>
        ${CS_LATE_BLD.map(b=>{const m=CS_BLD[b];return`<div class="slot-row" style="padding-left:4px">
          <div class="slot-label" style="color:${m.color};font-weight:600;font-size:12px">${m.dot} ${m.label} <span style="color:var(--tx3);font-weight:500">ab ${csTLabel(b)}</span></div>
          <div class="slot-btns">
            <button class="slot-btn" onclick="csChangeSlot('${b}',-1)">−</button>
            <div class="slot-num">${Math.min(CS_MAXCAP,slots[b]||0)}</div>
            <button class="slot-btn" onclick="csChangeSlot('${b}',1)">+</button>
          </div></div>`;}).join('')}
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="ch">⏱ Ablauf</div>
      <div class="cb">
        ${CS_PHASES.map(p=>`<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px">
          <div style="min-width:44px;font-size:12px;font-weight:800;color:var(--primary)">${p.t}</div>
          <div style="font-size:11px;color:var(--tx2);line-height:1.45">${p.desc}</div>
        </div>`).join('')}
      </div>
    </div>

    ${csBuildingInfoCard()}

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div class="note info" style="flex:1;text-align:center;cursor:pointer;margin:0" onclick="csSetView('mail')">✉ Mail-Export</div>
      <div class="note info" style="flex:1;text-align:center;cursor:pointer;margin:0;background:#f5f0ff;color:var(--ass);border-color:var(--ass)44" onclick="showCSMap()">🗺 Übersichtsbild · PNG</div>
    </div>`;
}

// Ein Bild: Karte in der Mitte, Namen in den Seitenspalten, farbige Pfeile für jeden

const CS_ANCHOR={
  dc_w:     {x:112,y:118,side:'l'},
  kraftturm:{x:194,y:222,side:'l'},
  serum_nw: {x:72, y:240,side:'l'},
  def_sw:   {x:72, y:322,side:'l'},
  lager1:   {x:50, y:398,side:'l'},
  lager2:   {x:146,y:398,side:'l'},
  dc_o:     {x:274,y:118,side:'r'},
  def_no:   {x:317,y:240,side:'r'},
  viruslab: {x:194,y:307,side:'r'},
  serum_so: {x:317,y:322,side:'r'},
  lager3:   {x:242,y:398,side:'r'},
  lager4:   {x:338,y:398,side:'r'},
};
// Spawn-Bereiche auf dem Bild: Ordnungshüter oben, Morgenbringer unten (2 Spawns,
// einer davon gehört der Partnerallianz).
const CS_SPAWN={
  ordnung:[{x:194,y:42}],
  morgen: [{x:76, y:494},{x:283,y:494}],
};
function csMapSvg(t){
  const MW=Math.round(CS_MAP_W*CS_S), MH=Math.round(CS_MAP_H*CS_S);
  const GUT=176, TOP=32, mapX=GUT;
  const P=t?csGetPlan(t):{};
  const moves=t?csMoves(t):[];
  const ass=t?csAssassinen(t):[];
  // Das Bild ist bewusst durchgehend englisch — siehe trEN(). Deshalb stehen hier
  // keine deutschen Wörter, auch nicht in zusammengesetzten Texten.
  const legendRows=[...moves.map(m=>({t:csTLabel(m.to),c:csTColor(m.to),
      txt:`${m.n}: ${trEN(CS_BLD[m.from].label)} → ${trEN(CS_BLD[m.to].label)}`})),
    ...(ass.length?[{t:'12:00',c:'#7c3aed',txt:`${trEN('Assassinen')} (${ass.join(', ')}) → ${trEN('Hochsicherheitslabor')}`}]:[])];
  const LEG=legendRows.length?34+legendRows.length*14+10:14;
  const W=GUT*2+MW, H=TOP+MH+LEG;

  // Wer steht auf welcher Karte
  function occ(b){
    if(!t)return[];
    if(b==='viruslab')return ass.map(n=>({n,tag:'from 12:00',c:'#7c3aed'}));
    if(CS_LATE_BLD.includes(b))
      return csAtDest(t,b).map(n=>({n,tag:'from '+csTLabel(b)+(P[n]&&P[n].s?' · from '+trEN(CS_BLD[P[n].s].short):''),c:csTColor(b)}));
    return csAtStart(t,b).map(n=>{
      const d=P[n]&&P[n].d&&P[n].d!=='viruslab'?P[n].d:null;
      return{n,tag:d?'→ '+trEN(CS_BLD[d].short)+' '+csTLabel(d):null,c:d?csTColor(d):null};
    });
  }
  const ROW=n=>n.some(z=>z.tag)?18:13;
  function layout(side){
    const keys=CS_ALL_BLD.filter(b=>CS_ANCHOR[b].side===side).sort((a,b)=>CS_ANCHOR[a].y-CS_ANCHOR[b].y);
    const out=[];let prev=-999;
    keys.forEach(b=>{
      // +14 statt +8 wenn Badges dabei sind — sonst wird die Badge-Zeile unter dem
      // letzten Namen vom Kartenrand abgeschnitten.
      const ns=occ(b), h=17+Math.max(1,ns.length)*ROW(ns)+(ns.some(z=>z.tag)?15:8);
      let y=CS_ANCHOR[b].y*CS_S-h/2;
      if(y<prev+9)y=prev+9;
      if(y<2)y=2;
      out.push({b,y,h,ns});prev=y+h;
    });
    const last=out[out.length-1];
    if(last&&last.y+last.h>MH){
      let sh=last.y+last.h-MH;
      for(let i=out.length-1;i>=0&&sh>0;i--){
        const min=i===0?0:out[i-1].y+out[i-1].h+9;
        const can=Math.min(sh,out[i].y-min);out[i].y-=can;sh-=can;
      }
    }
    return out;
  }
  function card(o,side){
    const b=o.b,m=CS_BLD[b],isAss=b==='viruslab';
    const x=side==='l'?8:mapX+MW+12, w=GUT-20;
    const col=m.color, ax=mapX+CS_ANCHOR[b].x*CS_S, ay=TOP+CS_ANCHOR[b].y*CS_S;
    const cy=TOP+o.y+o.h/2, lx=side==='l'?x+w:x, rh=ROW(o.ns);
    return`<g>
      <line x1="${lx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="${col}" stroke-width="1.2" stroke-opacity=".7" stroke-dasharray="3,2"/>
      <circle cx="${ax}" cy="${ay}" r="4" fill="${col}" stroke="#fff" stroke-width="1.4"/>
      <rect x="${x}" y="${TOP+o.y}" width="${w}" height="${o.h}" rx="6" fill="#fff" stroke="${col}" stroke-width="${isAss?2.2:1.3}"/>
      <path d="M${x+6},${TOP+o.y} h${w-12} a6,6 0 0 1 6,6 v11 h${-w} v-11 a6,6 0 0 1 6,-6 z" fill="${col}"/>
      <text x="${x+w/2}" y="${TOP+o.y+12}" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">${escapeHtml(trEN(m.label))}</text>
      <text x="${x+5}" y="${TOP+o.y+26}" font-size="8" font-weight="700" fill="${col}" font-family="sans-serif">${m.pts}/s${m.from?' · from '+Math.floor(m.from/60)+':00':''}</text>
      ${isAss?`<text x="${x+w-5}" y="${TOP+o.y+26}" font-size="8" font-weight="800" fill="#7c3aed" text-anchor="end" font-family="sans-serif">${escapeHtml(trEN('Assassinen').toUpperCase())}</text>`:''}
      ${o.ns.length?o.ns.map((z,i)=>{
        const yy=TOP+o.y+17+(i+1)*rh;
        return`<text x="${x+w/2}" y="${yy}" font-size="9.5" font-weight="700" fill="#1d2b3a" text-anchor="middle" font-family="sans-serif">${escapeHtml(z.n.length>19?z.n.slice(0,18)+'…':z.n)}</text>`+
          (z.tag?`<text x="${x+w/2}" y="${yy+8.5}" font-size="8" font-weight="800" fill="${z.c}" text-anchor="middle" font-family="sans-serif">${escapeHtml(z.tag)}</text>`:'');
      }).join(''):`<text x="${x+w/2}" y="${TOP+o.y+17+rh}" font-size="8.5" font-style="italic" fill="#8892a4" text-anchor="middle" font-family="sans-serif">${escapeHtml(trEN('frei'))}</text>`}
    </g>`;
  }
  function arrows(){
    let g='<defs>';
    ['#27ae60','#e67e22','#7c3aed'].forEach((c,i)=>{
      g+=`<marker id="csah${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
    });
    g+='</defs>';
    const mi={'#27ae60':0,'#e67e22':1,'#7c3aed':2};
    moves.forEach(m=>{
      const a=CS_ANCHOR[m.from],b=CS_ANCHOR[m.to],c=csTColor(m.to);
      const x1=mapX+a.x*CS_S,y1=TOP+a.y*CS_S,x2=mapX+b.x*CS_S,y2=TOP+b.y*CS_S;
      const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
      const cx=mx-dy/len*26,cy=my+dx/len*26;
      g+=`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${c}" stroke-width="2.6" stroke-opacity=".95" marker-end="url(#csah${mi[c]})"/>`;
      const lx=(x1+2*cx+x2)/4,ly=(y1+2*cy+y2)/4;
      g+=`<rect x="${lx-17}" y="${ly-8}" width="34" height="16" rx="8" fill="${c}"/>`;
      g+=`<text x="${lx}" y="${ly+3.5}" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">${csTLabel(m.to)}</text>`;
    });
    if(ass.length){
      const v=CS_ANCHOR.viruslab;
      const x2=mapX+v.x*CS_S,y2=TOP+v.y*CS_S;
      const x1=mapX+194*CS_S,y1=TOP+150*CS_S;
      g+=`<path d="M${x1},${y1} L${x2},${y2-9}" fill="none" stroke="#7c3aed" stroke-width="3.4" stroke-opacity=".95" marker-end="url(#csah2)"/>`;
      g+=`<rect x="${x1-58}" y="${y1-27}" width="116" height="20" rx="10" fill="#7c3aed"/>`;
      g+=`<text x="${x1}" y="${y1-13}" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">${escapeHtml(trEN('Assassinen').toUpperCase())} 12:00</text>`;
    }
    return g;
  }
  // Spawn-Bereiche beschriften. Die eigene Seite wird farbig hervorgehoben,
  // die gegnerische bleibt gedämpft.
  function spawns(){
    const eigene=t?csFaction(t):null;
    let g='';
    Object.entries(CS_SPAWN).forEach(([fk,pos])=>{
      const wir=eigene===fk;
      const col=wir?CS_FACTIONS[fk].color:'#3d4a5c';
      // Bei den Morgenbringern gehören BEIDE unteren Spawns zur eigenen Seite —
      // einer davon der Partnerallianz. Deshalb „unsere Seite" statt „wir".
      const zusatz=!t?'':wir?(pos.length>1?' · OUR SIDE':' · US'):' · ENEMY';
      const label=trEN(CS_FACTIONS[fk].label).toUpperCase()+zusatz;
      // 5.0 pro Zeichen war zu knapp: "DAWNBRINGERS · OUR SIDE" misst 118.9px und lief
      // aus der 115px-Kapsel heraus. 5.4 plus 12px Innenabstand deckt den längsten Fall.
      const w=Math.max(112,label.length*5.4+12), h=17;
      pos.forEach(p=>{
        const cx=mapX+p.x*CS_S, cy=TOP+p.y*CS_S;
        g+=`<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="8"
             fill="${col}" fill-opacity="${wir?0.95:0.72}" stroke="#fff" stroke-width="${wir?1.8:1}"${wir?'':' stroke-dasharray="4,2"'}/>`;
        g+=`<text x="${cx}" y="${cy+4}" font-size="8.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">${escapeHtml(label)}</text>`;
      });
    });
    return g;
  }
  const F=t?CS_FACTIONS[csFaction(t)]:null;
  const title=t?`${trEN('Schluchtsturm')} · Team ${t} · 16:00${F?' · '+trEN(F.label):''}`
             :`${trEN('Schluchtsturm')} · ${trEN('Gebäude')}`;
  const legend=legendRows.length?`
    <rect x="10" y="${TOP+MH+8}" width="${W-20}" height="${LEG-16}" rx="8" fill="#fff" stroke="#c9d2e0"/>
    <text x="20" y="${TOP+MH+25}" font-size="10.5" font-weight="800" fill="#2c3e6b" font-family="sans-serif">${escapeHtml(trEN('WECHSEL-FAHRPLAN'))}</text>
    ${legendRows.map((r,i)=>`
      <rect x="20" y="${TOP+MH+33+i*14}" width="36" height="12" rx="6" fill="${r.c}"/>
      <text x="38" y="${TOP+MH+42+i*14}" font-size="8" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">${r.t}</text>
      <text x="63" y="${TOP+MH+42+i*14}" font-size="9.5" fill="#1d2b3a" font-family="sans-serif">${escapeHtml(r.txt)}</text>`).join('')}`:'';
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block;margin:0 auto;border-radius:10px;border:1px solid #c9d2e0" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="#f4f6fa"/>
    <rect width="${W}" height="26" fill="#2c3e6b"/>
    <text x="${W/2}" y="18" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">${escapeHtml(title)}</text>
    <image href="assets/cs_map_bg.png" x="${mapX}" y="${TOP}" width="${MW}" height="${MH}" preserveAspectRatio="none"/>
    ${spawns()}
    ${t?arrows():''}
    ${layout('l').map(o=>card(o,'l')).join('')}
    ${layout('r').map(o=>card(o,'r')).join('')}
    ${legend}
  </svg>`;
}

async function _buildCSMapCanvas(){
  const svg=document.querySelector('#csmap-body svg');

  return _svgToPngCanvas(svg,2);
}
async function downloadCSMapPng(t){

// ========== ZUGFAHRT ==========
// Eine Zeile pro Tag in zug_rides (Single-Alliance): driver_name (Zugführer) + vip_name.
// Mo/Mi/Fr = Zugführer-Tage → Auto-Vorschlag aus R4/R5. Andere Tage → restliche Spieler (R3 u.).
// Faire Rotation: wenigste Fahrten zuerst, dann älteste letzte Fahrt. R4/R5 können alles überschreiben.
function zugISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function zugFmtISO(iso){if(!iso)return'–';const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function zugDaysAgo(iso){if(!iso)return null;const a=new Date(iso+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/86400000);}
const ZUG_WD=LANG==='en'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat']:['So','Mo','Di','Mi','Do','Fr','Sa'];
const ZUG_WD_LONG=LANG==='en'
  ?['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
  :['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

function zugStats(){
  const rides=APP.data.zugRides||[];const today=zugISO(new Date());
  const drvPast={},lastDrv={},vipPast={},lastVip={},drvAll={},vipAll={};
  rides.forEach(r=>{
    if(r.driver_name){drvAll[r.driver_name]=(drvAll[r.driver_name]||0)+1;
      if(r.ride_date<=today){drvPast[r.driver_name]=(drvPast[r.driver_name]||0)+1;
        if(!lastDrv[r.driver_name]||r.ride_date>lastDrv[r.driver_name])lastDrv[r.driver_name]=r.ride_date;}}
    if(r.vip_name){vipAll[r.vip_name]=(vipAll[r.vip_name]||0)+1;
      if(r.ride_date<=today){vipPast[r.vip_name]=(vipPast[r.vip_name]||0)+1;
        if(!lastVip[r.vip_name]||r.ride_date>lastVip[r.vip_name])lastVip[r.vip_name]=r.ride_date;}}
  });
  return{drvPast,lastDrv,vipPast,lastVip,drvAll,vipAll};
}

// Baut den 7-Tage-Plan: gespeicherte Einteilung + Auto-Vorschläge für freie Slots.
function zugBuildPlan(){
  const active=APP.data.players.filter(p=>p.active!==false);
  const r45=active.filter(p=>p.role==='R4'||p.role==='R5');
  const reg=active.filter(p=>p.role!=='R4'&&p.role!=='R5');
  const st=zugStats();
  const dCount={...st.drvAll},vCount={...st.vipAll},lastDrv={...st.lastDrv},lastVip={...st.lastVip};
  const pick=(pool,count,last,exclude)=>{
    let best=null;
    pool.forEach(p=>{
      if(exclude&&p.name===exclude)return;
      const c=count[p.name]||0,l=last[p.name]||''; // '' = nie gefahren → ältester
      if(!best||c<best.c||(c===best.c&&l<best.l)||(c===best.c&&l===best.l&&p.name<best.name))best={name:p.name,c,l};
    });
    return best?best.name:'';
  };
  const rows=APP.data.zugRides||[];const base=new Date();base.setHours(0,0,0,0);const plan=[];
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);const iso=zugISO(d);const wd=d.getDay();
    const conductor=(wd===1||wd===3||wd===5);
    const row=rows.find(r=>r.ride_date===iso);
    const driver=row&&row.driver_name?row.driver_name:'';
    const vip=row&&row.vip_name?row.vip_name:'';
    let suggD='',suggV='';
    if(!driver){suggD=pick(conductor?r45:reg,dCount,lastDrv,'');if(suggD){dCount[suggD]=(dCount[suggD]||0)+1;lastDrv[suggD]=iso;}}
    const effDriver=driver||suggD;
    if(!vip){suggV=pick(active,vCount,lastVip,effDriver);if(suggV){vCount[suggV]=(vCount[suggV]||0)+1;lastVip[suggV]=iso;}}
    plan.push({iso,wd,conductor,saved:!!row,auto:row?!!row.auto:false,driver,vip,suggD,suggV,effDriver,effVip:vip||suggV});
  }
  return plan;
}

function zugPlayerOptions(sel){
  const active=[...APP.data.players.filter(p=>p.active!==false)]
    .sort((a,b)=>(roleRank(b.role)-roleRank(a.role))||a.name.localeCompare(b.name));
  return'<option value="">— niemand —</option>'+active.map(p=>`<option value="${p.name.replace(/"/g,'&quot;')}"${p.name===sel?' selected':''}>${p.name} · ${p.role||'R3'}</option>`).join('');
}

async function zugReload(){APP.data.zugRides=await sbGet('zug_rides?order=ride_date.asc');}

async function zugSetField(iso,field,value){
  if(!canAccess('zugfahrt')||APP.zugBusy)return;
  value=value||null;
  const ex=(APP.data.zugRides||[]).find(r=>r.ride_date===iso);
  const driver=field==='driver'?value:(ex?ex.driver_name:null);
  const vip=field==='vip'?value:(ex?ex.vip_name:null);
  APP.zugBusy=true;renderPage();
  try{
    if(!driver&&!vip){if(ex)await sbDelete('zug_rides','ride_date=eq.'+iso);}
    else await sbUpsert('zug_rides',{ride_date:iso,driver_name:driver,vip_name:vip,auto:false,updated_by:APP.user.playerName,updated_at:new Date().toISOString()},'ride_date');
    await zugReload();
  }catch(e){alert('Speichern fehlgeschlagen: '+e.message);}
  APP.zugBusy=false;renderPage();
}

async function zugAcceptAll(){
  if(!canAccess('zugfahrt')||APP.zugBusy)return;
  const toSave=zugBuildPlan().filter(d=>(!d.driver&&d.suggD)||(!d.vip&&d.suggV))
    .map(d=>({ride_date:d.iso,driver_name:d.effDriver||null,vip_name:d.effVip||null,auto:!d.saved,updated_by:APP.user.playerName,updated_at:new Date().toISOString()}));
  if(!toSave.length){alert('Keine offenen Vorschläge zum Übernehmen.');return;}
  APP.zugBusy=true;renderPage();
  try{await sbUpsert('zug_rides',toSave,'ride_date');await zugReload();}
  catch(e){alert('Speichern fehlgeschlagen: '+e.message);}
  APP.zugBusy=false;renderPage();
}

// Rendert den 7-Tage-Plan als PNG-Canvas (analog WS-Aufstellung).
function _buildZugCanvas(){
  const plan=zugBuildPlan();
  const roleOf=n=>{const p=APP.data.players.find(x=>x.name===n);return p?(p.role||'R3'):'';};
  const S=2,W=470*S,pad=14*S;
  const titleH=58*S,colHdrH=26*S,rowH=36*S,footH=30*S;
  const totalH=titleH+colHdrH+plan.length*rowH+footH;
  const c=document.createElement('canvas');c.width=W;c.height=totalH;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#f8f9fc';ctx.fillRect(0,0,W,totalH);
  const fit=(t,maxW)=>{if(ctx.measureText(t).width<=maxW)return t;let s=t;while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…';};
  // Spalten
  const cx1=pad+6*S, cx2=pad+162*S, cx3=pad+318*S;
  const wDrv=cx3-cx2-10*S, wVip=W-pad-cx3-6*S;
  // Titelband
  ctx.fillStyle='#2c3e6b';ctx.fillRect(0,0,W,titleH);
  ctx.textAlign='left';
  ctx.font=`800 ${17*S}px Arial`;ctx.fillStyle='#fff';
  ctx.fillText(trs('Zugfahrt — Einteilung'),pad,29*S);
  ctx.font=`${11*S}px Arial`;ctx.fillStyle='#c9d3ee';
  const range=zugFmtISO(plan[0].iso).slice(0,6)+' – '+zugFmtISO(plan[plan.length-1].iso);
  ctx.fillText('AR1S #1668   ·   '+range,pad,47*S);
  // Spaltenkopf
  let y=titleH;
  ctx.fillStyle='#eef1f8';ctx.fillRect(0,y,W,colHdrH);
  ctx.font=`800 ${10*S}px Arial`;ctx.fillStyle='#5a6278';
  ctx.fillText(trs('TAG'),cx1,y+17*S);ctx.fillText(trs('ZUGFÜHRER'),cx2,y+17*S);ctx.fillText('VIP',cx3,y+17*S);
  y+=colHdrH;
  const WD=ZUG_WD_LONG;
  const drawName=(name,x,maxW)=>{
    if(!name){ctx.font=`${13*S}px Arial`;ctx.fillStyle='#bbb';ctx.fillText('–',x,y+rowH/2+5*S);return;}
    ctx.font=`700 ${12*S}px Arial`;ctx.fillStyle='#1a1d2e';ctx.fillText(fit(name,maxW),x,y+16*S);
    ctx.font=`${9*S}px Arial`;ctx.fillStyle='#8892a4';ctx.fillText(trs(roleOf(name)),x,y+28*S);
  };
  plan.forEach((d,i)=>{
    ctx.fillStyle=i%2?'#ffffff':'#f4f6fb';ctx.fillRect(0,y,W,rowH);
    if(d.conductor){ctx.fillStyle='#c0392b';ctx.fillRect(0,y,4*S,rowH);}
    ctx.font=`800 ${12*S}px Arial`;ctx.fillStyle='#1a1d2e';
    ctx.fillText(WD[d.wd],cx1,y+16*S);
    const wdw=ctx.measureText(WD[d.wd]).width;
    if(d.conductor){ctx.font=`700 ${8*S}px Arial`;ctx.fillStyle='#c0392b';ctx.fillText('R4/R5',cx1+wdw+6*S,y+15*S);}
    ctx.font=`${9*S}px Arial`;ctx.fillStyle='#8892a4';ctx.fillText(zugFmtISO(d.iso),cx1,y+28*S);
    drawName(d.effDriver,cx2,wDrv);
    drawName(d.effVip,cx3,wVip);
    y+=rowH;
  });
  ctx.font=`${9*S}px Arial`;ctx.fillStyle='#8892a4';
  ctx.fillText(trs('Stand ')+zugFmtISO(zugISO(new Date()))+trs('   ·   rot = Zugführer-Tag (Mo/Mi/Fr, R4/R5)'),pad,y+19*S);
  return c;
}
async function zugDownloadPng(btn){
  const o=btn?btn.textContent:'';if(btn){btn.textContent='⏳';btn.disabled=true;}
  try{
    const c=_buildZugCanvas();const a=document.createElement('a');
    a.href=c.toDataURL('image/png');a.download='zugfahrt_'+zugISO(new Date())+'.png';a.target='_blank';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    if(btn)btn.textContent='✓ Erstellt';
  }catch(e){alert('Fehler: '+e.message);if(btn)btn.textContent=o;}
  if(btn)setTimeout(()=>{btn.textContent=o;btn.disabled=false;},1800);
}
async function zugSharePng(btn){
  const o=btn?btn.textContent:'';if(btn){btn.textContent='⏳';btn.disabled=true;}
  try{
    const c=_buildZugCanvas();
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const file=new File([blob],'zugfahrt.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Zugfahrt-Einteilung'});
      if(btn)btn.textContent=o;
    }else{
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      if(btn)btn.textContent='✓ Kopiert';
    }
  }catch(e){if(e&&e.name!=='AbortError')alert('Teilen/Kopieren fehlgeschlagen: '+e.message);if(btn)btn.textContent=o;}
  if(btn)setTimeout(()=>{btn.textContent=o;btn.disabled=false;},1800);
}
