function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ========== KARTEN-BILD ==========
// Phase 1: 4 Zonen (volle Breite, kein Z5-Streifen), kein Z5-Footer
// Phase 2: Z5-Mittelspalte + Z5-Footer mit neuer Aufstellung
function renderWSMapSvg(t, phase){
  const L=getLineup(t);
  const ba=APP.bldAssign||{};
  const ba2=APP.bldAssignPh2||{};
  const time=t==='A'?'13:00':'22:00';
  const W=400;
  const trunc=s=>(s||'').length>12?s.slice(0,11)+'…':s;

  const _bz={oelraf1:'z1',infozentrum:'z1',laz2:'z2',laz4:'z2',oelraf2:'z3',sciencehub:'z3',laz1:'z4',laz3:'z4'};
  const z5All=[...(L.ass||[]),...(L.ars||[]),...(L.sold||[])];
  const allZonePlayers=[...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[])];
  function z5Short(n){
    if((L.ass||[]).includes(n))return'→Silo';
    if((L.ars||[]).includes(n))return'→Ars';
    return'→Söld';
  }

  const hdrH=0, mapH=395, mapY=hdrH;
  const topY=mapY+4, topH=190, botY=topY+topH, botH=196;
  const BOX_FILL='rgba(255,255,255,0.45)';
  const hasSpringer=(L.sup||[]).length>0;
  const FS={zone:15,bld:12,player:14,guest:13,z5lbl:13,z5entry:12,footer:11,legend:10}; // font-sizes

  // Zone-Layout: Phase 1 = volle Breite ohne Z5; Phase 2 = mit Z5-Mittelspalte
  let zones, z5box=null;
  if(phase===1){
    zones={
      z1:{x:4,   y:topY, w:195, h:topH, color:'#c0392b', label:'Z1', blds:['oelraf1','infozentrum']},
      z4:{x:4,   y:botY, w:195, h:botH, color:'#2980b9', label:'Z4', blds:['laz3','laz4']},
      z2:{x:201, y:topY, w:195, h:topH, color:'#e8a020', label:'Z2', blds:['laz1','laz2']},
      z3:{x:201, y:botY, w:195, h:botH, color:'#27ae60', label:'Z3', blds:['oelraf2','sciencehub']},
    };
  } else {
    zones={
      z1:{x:4,   y:topY, w:138, h:topH, color:'#c0392b', label:'Z1', blds:['oelraf1','infozentrum']},
      z4:{x:4,   y:botY, w:138, h:botH, color:'#2980b9', label:'Z4', blds:['laz3','laz4']},
      z2:{x:258, y:topY, w:138, h:topH, color:'#e8a020', label:'Z2', blds:['laz1','laz2']},
      z3:{x:258, y:botY, w:138, h:botH, color:'#27ae60', label:'Z3', blds:['oelraf2','sciencehub']},
    };
    z5box={x:146, y:topY, w:108, h:topH+botH, color:'#7c3aed'};
  }

  // Dynamische Gesamthöhe
  const z5FooterH=0;
  const supH=hasSpringer?46:0;
  const H=mapY+mapH+8+z5FooterH+supH+40;

  let parts=[];
  // Bild + dunkles Overlay
  parts.push(`<image href="assets/ws_map_bg.jpg" x="0" y="${mapY}" width="${W}" height="${mapH}" preserveAspectRatio="none"/>`);
  parts.push(`<rect x="0" y="${mapY}" width="${W}" height="${mapH}" fill="rgba(0,0,0,0.12)"/>`);
  // Z5-Spalte (nur Phase 2)
  if(z5box){
    const {x,y,w,h,color}=z5box;
    parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(124,58,237,0.28)" stroke="${color}" stroke-width="2" rx="6"/>`);
    parts.push(`<text x="${x+w/2}" y="${y+18}" text-anchor="middle" font-size="${FS.z5lbl}" font-weight="800" fill="${color}" font-family="Arial" stroke="#fff" stroke-width="2.5" paint-order="stroke">Z5</text>`);
    const z5entries=[...(L.ass||[]).map(n=>({n,r:'Silo'})),...(L.ars||[]).map(n=>({n,r:'Ars'})),...(L.sold||[]).map(n=>({n,r:'Söld'}))];
    let z5yo=y+34;
    z5entries.forEach(({n,r})=>{
      if(z5yo>y+h-8)return;
      parts.push(`<text x="${x+w/2}" y="${z5yo}" text-anchor="middle" font-size="${FS.z5entry}" fill="${color}" font-family="Arial" stroke="#fff" stroke-width="1.5" paint-order="stroke">${r}: ${trunc(n)}</text>`);
      z5yo+=15;
    });
  }

  // Zonen-Overlays
  Object.entries(zones).forEach(([zk,z])=>{
    parts.push(`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${BOX_FILL}" stroke="${z.color}" stroke-width="1.5" rx="5"/>`);
    parts.push(`<text x="${z.x+5}" y="${z.y+16}" font-size="${FS.zone}" font-weight="800" fill="${z.color}" font-family="Arial" stroke="#fff" stroke-width="2.5" paint-order="stroke">${z.label}</text>`);
    let yo=z.y+32;
    z.blds.forEach(bk=>{
      const meta=BLD_META[bk];
      const permForBld=phase===2
        ?allZonePlayers.filter(n=>(ba2[n]||ba[n])===bk)
        :(L[zk]||[]).filter(n=>(ba[n]||z.blds[0])===bk);
      const guestForBld=phase===1?z5All.filter(n=>_bz[ba[n]]===zk&&(ba[n]||z.blds[0])===bk):[];
      if(!permForBld.length&&!guestForBld.length)return;
      const sl=meta.label.replace('Feldlazarett','Laz').replace('Ölraffinerie','Öl').replace('Infozentrum','Info').replace('Science Hub','Sci');
      parts.push(`<text x="${z.x+5}" y="${yo}" font-size="${FS.bld}" font-weight="700" fill="${meta.color}" font-family="Arial" stroke="#fff" stroke-width="2.5" paint-order="stroke">${sl}</text>`);
      yo+=16;
      permForBld.forEach(n=>{
        if(yo>z.y+z.h-4)return;
        const isShifted=phase===2&&ba2[n]&&ba2[n]!==ba[n];
        parts.push(`<text x="${z.x+8}" y="${yo}" font-size="${FS.player}" fill="${isShifted?'#000':'#fff'}" font-family="Arial" stroke="${isShifted?'rgba(255,255,255,0.85)':'rgba(0,0,0,0.5)'}" stroke-width="2" paint-order="stroke">${isShifted?'↑ ':'• '}${trunc(n)}</text>`);
        yo+=16;
      });
      guestForBld.forEach(n=>{
        if(yo>z.y+z.h-4)return;
        parts.push(`<text x="${z.x+8}" y="${yo}" font-size="${FS.guest}" fill="#000" font-style="italic" font-family="Arial" stroke="rgba(255,255,255,0.85)" stroke-width="2" paint-order="stroke">⏱ ${trunc(n)} ${z5Short(n)}</text>`);
        yo+=15;
      });
      yo+=4;
    });
  });

  // Footer
  const footerY=mapY+mapH+8;
  parts.push(`<rect x="0" y="${footerY-8}" width="${W}" height="${H-footerY+8}" fill="#fff"/>`);
  let fy=footerY;



  // Springer (nur wenn vorhanden)
  if(hasSpringer){
    parts.push(`<text x="${W/2}" y="${fy+14}" text-anchor="middle" font-size="${FS.footer}" font-weight="700" fill="#7f8c8d" font-family="Arial">Springer / Sammler</text>`);
    parts.push(`<text x="${W/2}" y="${fy+28}" text-anchor="middle" font-size="${FS.z5entry}" fill="#2c3e50" font-family="Arial">${(L.sup||[]).map(trunc).join(', ')}</text>`);
    fy+=supH;
  }

  // Legende
  if(phase===2){
    parts.push(`<text x="${W/2}" y="${fy+15}" text-anchor="middle" font-size="${FS.legend}" font-weight="700" fill="#2c3e50" font-family="Arial">↑ = rückt in geräumtes Gebäude nach (Shift)</text>`);
  }
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block">${parts.join('')}</svg>`;
}
function wsZoneCards(t,phase){
  const L=getLineup(t);
  const ba=APP.bldAssign||{};
  const ba2=APP.bldAssignPh2||{};
  const BS={infozentrum:'Infozentrum',oelraf1:'Ölraf I',oelraf2:'Ölraf II',sciencehub:'Science Hub',laz1:'Laz I',laz2:'Laz II',laz3:'Laz III',laz4:'Laz IV'};
  const ZD=[{z:'z1',label:'Zone 1',color:'#c0392b',blds:['oelraf1','infozentrum']},{z:'z2',label:'Zone 2',color:'#e8a020',blds:['laz1','laz2']},{z:'z3',label:'Zone 3',color:'#27ae60',blds:['oelraf2','sciencehub']},{z:'z4',label:'Zone 4',color:'#2980b9',blds:['laz3','laz4']}];
  // Nur Spieler dieses Teams berücksichtigen
  const teamPl=new Set([...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[]),...(L.ass||[]),...(L.ars||[]),...(L.sold||[]),...(L.sup||[])]);
  const assSet=new Set(L.ass||[]),arsSet=new Set(L.ars||[]),soldSet=new Set(L.sold||[]);
  const isZ5=n=>assSet.has(n)||arsSet.has(n)||soldSet.has(n);
  if(phase===1){
    const boxes=ZD.map(z=>{
      const byBld={};z.blds.forEach(b=>byBld[b]=[]);
      Object.entries(ba).forEach(([n,b])=>{if(z.blds.includes(b)&&teamPl.has(n))byBld[b].push(n);});
      let rows='';
      z.blds.forEach(b=>{(byBld[b]||[]).forEach(n=>{const z5=isZ5(n);rows+=`<div style="padding:2px 0;font-size:11px"><span style="color:${z.color};font-weight:700">${BS[b]||b}:</span> ${n}${z5?` <span style="color:#7c3aed;font-size:9px;font-weight:800">⏱→Z5</span>`:''}</div>`;});});
      if(!rows)rows='<div style="font-size:10px;color:#aaa">–</div>';
      return`<div style="border:2px solid ${z.color};border-radius:8px;padding:8px"><div style="font-weight:800;color:${z.color};font-size:12px;margin-bottom:4px">${z.label}</div>${rows}</div>`;
    }).join('');
    return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${boxes}</div>`;
  } else {
    const boxes=ZD.map(z=>{
      const byBld={};z.blds.forEach(b=>byBld[b]=[]);
      Object.entries(ba2).forEach(([n,b])=>{if(z.blds.includes(b)&&teamPl.has(n))byBld[b].push(n);});

function _buildWSCardsCanvas(team,phase){

  const baCur=phase===1?ba:ba2;
  const BS={infozentrum:'Infozentrum',oelraf1:'Ölraf I',oelraf2:'Ölraf II',sciencehub:'Science Hub',laz1:'Laz I',laz2:'Laz II',laz3:'Laz III',laz4:'Laz IV'};

  const S=2,W=400*S,pad=10*S,gap=6*S,colW=(W-pad*2-gap)/2;
  const lineH=18*S,hdrH=24*S,innerPad=8*S,titleH=38*S;
  const fs=12*S,hdrFs=13*S,titleFs=14*S;
  const teamPl=new Set([...(L.z1||[]),...(L.z2||[]),...(L.z3||[]),...(L.z4||[]),...(L.ass||[]),...(L.ars||[]),...(L.sold||[]),...(L.sup||[])]);

    const out=[];zd.blds.forEach(b=>(byB[b]||[]).forEach(n=>out.push({n,b,shifted:phase===2&&ba[n]!==ba2[n]})));

  }
  // Titel

  ctx.fillStyle=phase===1?'#27ae60':'#7c3aed';
  ctx.fillText(`Team ${team} · ${team==='A'?'13:00':'22:00'} – Phase ${phase} Aufstellung`,W/2,titleH-10*S);
  ctx.textAlign='left';
  function drawCard(x,y,w,h,zd,entries){

  rows.forEach((row,ri)=>{
    const rh=rowH[ri];
    row.forEach(({zd,entries},ci)=>drawCard(pad+ci*(colW+gap),cy,colW,rh,zd,entries));
    cy+=rh+gap;
  });
  if(z5entries.length){
    const z5H=hdrH+z5entries.length*lineH+innerPad;
    rr(pad,cy,W-pad*2,z5H,8*S,'#faf5ff','#7c3aed',2*S);
    ctx.font=`800 ${hdrFs}px Arial`;ctx.fillStyle='#7c3aed';ctx.fillText('Zone 5 (ab Min 10:00)',pad+innerPad,cy+hdrH-5*S);
    let z5y=cy+hdrH;
    z5entries.forEach(({n,role,color})=>{
      ctx.font=`700 ${fs}px Arial`;ctx.fillStyle=color;
      const rl=role+': ';ctx.fillText(rl,pad+innerPad,z5y+lineH-4*S);
      const rlw=ctx.measureText(rl).width;
      ctx.font=`${fs}px Arial`;ctx.fillStyle='#222';ctx.fillText(n,pad+innerPad+rlw,z5y+lineH-4*S);
      z5y+=lineH;
    });
  }
  return c;
}

async function downloadWSCombinedPng(team,phase){
  const box=document.getElementById('ws-map-'+team+'-p'+phase);
  if(!box)return;const svg=box.querySelector('svg');if(!svg)return;
  const S=2;
  const [mapC,cardsC]=await Promise.all([_svgToPngCanvas(svg,S),Promise.resolve(_buildWSCardsCanvas(team,phase))]);
  const totalH=mapC.height+cardsC.height;
  const c=document.createElement('canvas');c.width=mapC.width;c.height=totalH;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#f8f9fc';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(mapC,0,0);ctx.drawImage(cardsC,0,mapC.height);

}

function exportPlayersExcel(){
  if(typeof XLSX==='undefined'){alert('Excel-Bibliothek noch nicht geladen. Bitte kurz warten und nochmal versuchen.');return;}
  const all=APP.data.players;
  if(!all.length){alert('Keine Spielerdaten vorhanden.');return;}

  // Aktive Spieler zuerst, dann inaktive; innerhalb nach Rolle sortiert
  const sorted=[...all].sort((a,b)=>{
    const ia=isInactive(a.name),ib=isInactive(b.name);
    if(ia!==ib)return ia?1:-1;
    const rr=roleRank(b.role||'R3')-roleRank(a.role||'R3');
    return rr||a.name.localeCompare(b.name);
  });

  const rows=sorted.map(p=>({
    'Name':p.name,
    'Rolle':p.role||'R3',
    'Status':isInactive(p.name)?'Ausgetreten':'Aktiv',
    'Beruf':p.profession||'',
    'Beruf-Level':p.profession_level||'',
    'Kills':p.kills||'',
    'Beliebtheit':p.popularity||'',
    'T1 (Mio.)':p.t1||'',
    'T2 (Mio.)':p.t2||'',
    'T3 (Mio.)':p.t3||'',
    'T4 (Mio.)':p.t4||'',
    'Gesamtkampfkraft':p.total_power||'',
    'T1 zuletzt aktualisiert':p.t1_updated_at?p.t1_updated_at.slice(0,10):'',
  }));

  const ws=XLSX.utils.json_to_sheet(rows);

  // Auto column widths
  const colWidths=Object.keys(rows[0]).map(k=>({wch:Math.max(k.length,12)}));
  ws['!cols']=colWidths;

  // Style header row bold (basic)
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let C=range.s.c;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(!ws[addr])continue;
    ws[addr].s={font:{bold:true},fill:{fgColor:{rgb:'2C3E6B'}},};
  }

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Spielerprofile');

  const date=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`warsync_spieler_${date}.xlsx`);

  const info=document.getElementById('export-info');
  if(info){info.style.display='block';info.textContent=`✓ ${rows.length} Spieler exportiert (${sorted.filter(p=>!isInactive(p.name)).length} aktiv, ${sorted.filter(p=>isInactive(p.name)).length} ausgetreten)`;}
}

async function adminPromptSetPassword(name){
  const pw=(prompt(`Neues Passwort für „${name}":\n(min. 4 Zeichen — wird im Klartext angezeigt)`,'')||'').trim();
  if(!pw)return; // abgebrochen oder leer
  if(pw.length<4){alert('Passwort muss mindestens 4 Zeichen haben.');return;}
  try{
    const hash=await sha256(pw);
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),{password_hash:hash,access_enabled:true});
    const pl=APP.data.players.find(p=>p.name===name);
    if(pl){pl.password_hash=hash;pl.access_enabled=true;}
    alert(`✓ Passwort für „${name}" gesetzt. Zugang aktiviert.`);
    renderPage();
  }catch(e){alert('Fehler: '+e.message);}
}
async function adminMergePlayers(){
  const src=document.getElementById('merge-src')?.value;
  const dst=document.getElementById('merge-dst')?.value;
  const res=document.getElementById('merge-result');
  const btn=document.getElementById('merge-btn');
  function showRes(msg,ok){if(res){res.style.display='block';res.style.background=ok?'#eafaf1':'#fdecea';res.style.color=ok?'var(--win)':'var(--loss)';res.innerHTML=msg;}}
  if(!src||!dst){showRes('Bitte beide Spieler auswählen.',false);return;}
  if(src===dst){showRes('Quelle und Ziel sind identisch.',false);return;}
  if(!confirm(`"${src}" → "${dst}" zusammenführen?\n\nAlle Daten von "${src}" werden auf "${dst}" übertragen, dann wird "${src}" gelöscht.`))return;
  if(btn){btn.textContent='Läuft…';btn.disabled=true;}
  try{
    const srcE=encodeURIComponent(src),dstE=encodeURIComponent(dst);
    // ws_participation
    const wpR=await fetch(SB+'/rest/v1/ws_participation?player_name=eq.'+srcE,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({player_name:dst})});
    if(!wpR.ok)throw new Error('ws_participation: '+await wpR.text());
    // vs_entries
    const veR=await fetch(SB+'/rest/v1/vs_entries?player_name=eq.'+srcE,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({player_name:dst})});
    if(!veR.ok)throw new Error('vs_entries: '+await veR.text());
    // ws_player_history
    await fetch(SB+'/rest/v1/ws_player_history?player_name=eq.'+srcE,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({player_name:dst})});
    // ws_players löschen
    const delR=await fetch(SB+'/rest/v1/ws_players?name=eq.'+srcE,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
    if(!delR.ok)throw new Error('Löschen: '+await delR.text());
    APP.data.players=await sbGet('ws_players?order=name.asc&select=name,role,access_enabled,password_hash');
    showRes(`✓ "${src}" wurde mit "${dst}" vereint und gelöscht.`,true);
    setTimeout(()=>renderPage(),1500);
  }catch(e){showRes('Fehler: '+e.message,false);}
  if(btn){btn.textContent='🔀 Zusammenführen';btn.disabled=false;}
}

async function admAnalyzeMembers(){
  const files=document.getElementById('adm-mem-shots')?.files;
  if(!files||!files.length){alert('Bitte zuerst Screenshots auswählen.');return;}
  const btn=document.getElementById('adm-mem-btn');
  const statusEl=document.getElementById('adm-mem-status');
  const resultEl=document.getElementById('adm-mem-result');
  if(btn){btn.disabled=true;btn.textContent='⏳ Analysiere…';}
  if(statusEl)statusEl.textContent='';
  if(resultEl)resultEl.innerHTML='';
  try{
    const images=await Promise.all(Array.from(files).map(f=>new Promise((res,rej)=>{
      const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);
    })));
    const knownPlayers=APP.data.players.map(p=>p.name);
    const resp=await fetch(VISION_URL()+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,known_players:knownPlayers})});
    if(!resp.ok)throw new Error(`Vision-Server: HTTP ${resp.status}`);
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    const detected=new Set((data.players||[]).map(p=>{
      const n=p.name||'';
      return n.replace(/^\[[^\]]+\]\s*/,'').replace(/\s*\[[^\]]+\]$/,'').trim();
    }).filter(Boolean));
    // Vergleich mit aktiven DB-Spielern
    const activePlayers=APP.data.players.filter(p=>p.active!==false);
    const activeNames=new Set(activePlayers.map(p=>p.name));
    // Neu: in Screenshots, nicht in DB
    const neuList=[...detected].filter(n=>!APP.data.players.find(p=>p.name===n));
    // Nicht mehr gesehen: aktiv in DB, nicht in Screenshots
    const weggList=activePlayers.filter(p=>!detected.has(p.name));
    if(resultEl)resultEl.innerHTML=admMemDiffHtml(detected.size,neuList,weggList);
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--win)">✓ ${detected.size} Spieler erkannt</span>`;
  }catch(e){
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--loss)">❌ ${e.message}</span>`;
  }
  if(btn){btn.disabled=false;btn.textContent='🔍 Analysieren';}
}
function admMemDiffHtml(total,neuList,weggList){
  let h=`<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--tx3)">${total} Spieler auf Screenshots erkannt</div>`;
  if(!neuList.length&&!weggList.length){
    return h+`<div class="note" style="color:var(--win)">✓ Keine Unterschiede — Mitgliederliste ist aktuell.</div>`;
  }
  if(neuList.length){
    const rows=neuList.map(n=>`<tr>
      <td style="font-weight:600">${n}</td>
      <td><label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
        <input type="checkbox" class="adm-mem-neu-chk" data-name="${n.replace(/"/g,'&quot;')}" checked style="width:16px;height:16px">
        Neu anlegen
      </label></td></tr>`).join('');
    h+=`<div class="card" style="margin-bottom:10px;border-left:3px solid #2980b9">
      <div class="ch" style="color:#2980b9">➕ Neu in Screenshots (${neuList.length})</div>
      <div class="scroll-x"><table style="width:100%"><thead><tr><th>Spieler</th><th>Aktion</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  }
  if(weggList.length){
    const rows=weggList.map(p=>`<tr>
      <td style="font-weight:600">${p.name}</td>
      <td><label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
        <input type="checkbox" class="adm-mem-inakt-chk" data-name="${p.name.replace(/"/g,'&quot;')}" checked style="width:16px;height:16px">
        Inaktiv setzen
      </label></td></tr>`).join('');
    h+=`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--loss)">
      <div class="ch" style="color:var(--loss)">⚠️ Nicht auf Screenshots (${weggList.length})</div>
      <div style="font-size:11px;color:var(--tx3);margin-bottom:8px">Diese aktiven Spieler wurden auf keinem Screenshot erkannt.</div>
      <div class="scroll-x"><table style="width:100%"><thead><tr><th>Spieler</th><th>Aktion</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  }
  h+=`<button class="btn btn-sol" style="width:100%;margin-top:4px" onclick="admApplyMemberChanges()">✅ Änderungen übernehmen</button>`;
  return h;
}
async function admApplyMemberChanges(){
  const neuChecked=[...document.querySelectorAll('.adm-mem-neu-chk:checked')].map(el=>el.dataset.name);
  const inaktChecked=[...document.querySelectorAll('.adm-mem-inakt-chk:checked')].map(el=>el.dataset.name);
  if(!neuChecked.length&&!inaktChecked.length){alert('Keine Änderungen ausgewählt.');return;}
  const btn=document.querySelector('[onclick="admApplyMemberChanges()"]');
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    for(const name of neuChecked){
      const r=await fetch(SB+'/rest/v1/ws_players',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({name,role:'R3',access_enabled:false,active:true})});
      if(!r.ok)throw new Error('Neu anlegen ('+name+'): '+await r.text());
    }
    for(const name of inaktChecked){
      const r=await fetch(SB+'/rest/v1/ws_players?name=eq.'+encodeURIComponent(name),{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({active:false})});
      if(!r.ok)throw new Error('Inaktiv ('+name+'): '+await r.text());
      delete APP.teamAssign[name];
    }
    if(inaktChecked.length)saveWSState();
    const players=await sbGet('ws_players?order=name.asc');
    APP.data.players=players;
    renderPage();
    // Kurz warten bis DOM neu gerendert, dann Erfolgsmeldung einblenden
    setTimeout(()=>{
      const resultEl=document.getElementById('adm-mem-result');
      if(resultEl)resultEl.innerHTML=`<div class="note" style="color:var(--win)">✓ ${neuChecked.length} Spieler angelegt, ${inaktChecked.length} inaktiv gesetzt.</div>`;
    },50);
  }catch(e){
    alert('Fehler: '+e.message);
    if(btn){btn.textContent='✅ Änderungen übernehmen';btn.disabled=false;}
  }
}

async function adminSetPassword(){
  const name=document.getElementById('pw-player')?.value;
  const pw=document.getElementById('pw-new')?.value?.trim();
  const res=document.getElementById('pw-result');
  const btn=document.getElementById('pw-save-btn');
  if(!name||!pw){if(res){res.style.display='block';res.style.background='#fdecea';res.style.color='var(--loss)';res.textContent='Bitte Spieler und Passwort eingeben.';}return;}
  if(pw.length<4){if(res){res.style.display='block';res.style.background='#fdecea';res.style.color='var(--loss)';res.textContent='Passwort muss mindestens 4 Zeichen haben.';}return;}
  if(btn){btn.textContent='Speichern…';btn.disabled=true;}
  try{
    const hash=await sha256(pw);
    await sbPatch('ws_players','name=eq.'+encodeURIComponent(name),{password_hash:hash,access_enabled:true});
    const pl=APP.data.players.find(p=>p.name===name);
    if(pl){pl.password_hash=hash;pl.access_enabled=true;}
    document.getElementById('pw-new').value='';
    if(res){res.style.display='block';res.style.background='#eafaf1';res.style.color='var(--win)';res.textContent=`✓ Passwort für „${name}" gesetzt. Zugang wurde automatisch aktiviert.`;}
    renderPage();
  }catch(e){if(res){res.style.display='block';res.style.background='#fdecea';res.style.color='var(--loss)';res.textContent='Fehler: '+e.message;}}
  finally{if(btn){btn.textContent='🔑 Passwort speichern';btn.disabled=false;}}
}

// ====== RANGLISTEN ======
let _rkData=null,_rkTab='kampfkraft',_rkChartPlayers=null;

async function loadRankingsData(){
  if(_rkData)return _rkData;
  const rows=await sbGet('ws_rankings?order=recorded_at.desc&limit=5000');
  const byDate={},dates=[],playerSet=new Set();
  for(const r of rows){
    if(!byDate[r.recorded_at]){byDate[r.recorded_at]=[];dates.push(r.recorded_at);}
    byDate[r.recorded_at].push(r);
    if(r.player_name)playerSet.add(r.player_name);
  }
  dates.sort((a,b)=>b.localeCompare(a));
  _rkData={dates,byDate,players:[...playerSet].sort()};
  return _rkData;
}

async function pageRankings(el){
  el.innerHTML=`<div class="loader"><span class="spin"></span>Lade Rankings…</div>`;
  let data;
  try{data=await loadRankingsData();}
  catch(e){el.innerHTML=`<div class="loader" style="color:var(--loss)">Fehler: ${e.message}</div>`;return;}

  if(!data.dates.length){
    el.innerHTML=`<div class="card"><div class="ch">Ranglisten</div><div style="padding:20px;text-align:center;color:var(--tx3)">Noch keine Daten.<br><br>Der Collector läuft täglich um 13:30 Uhr automatisch.</div></div>`;
    return;
  }

  if(!_rkChartPlayers)_rkChartPlayers=new Set(data.players.slice(0,5));

  const latestDate=data.dates[0];
  const latest=data.byDate[latestDate]||[];
  const TABS=[
    {k:'kampfkraft',         rk:'list_rank_kampfkraft',          label:'Kampfkraft',        fmt:v=>v?(v/1e6).toFixed(2)+'M':'-'},
    {k:'kills',              rk:'list_rank_kills',                label:'Kills',             fmt:v=>v?v.toLocaleString('de'):'-'},
    {k:'spende_taeglich',    rk:'list_rank_spende_taeglich',      label:'Spende Tägl.',      fmt:v=>v?v.toLocaleString('de'):'-'},
    {k:'spende_woechentlich',rk:'list_rank_spende_woechentlich',  label:'Spende Wöch.',      fmt:v=>v?v.toLocaleString('de'):'-'},
  ];
  const tab=TABS.find(t=>t.k===_rkTab)||TABS[0];
  const sorted=[...latest].filter(r=>r[tab.rk]!=null).sort((a,b)=>(a[tab.rk]||999)-(b[tab.rk]||999));
  const chronoDates=[...data.dates].sort();
  const COLORS=['#2980b9','#27ae60','#e8a020','#9b59b6','#e74c3c','#1abc9c','#f39c12','#8e44ad','#c0392b','#16a085'];

  function renderTrend(){
    if(chronoDates.length<2)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Mindestens 2 Tage Daten nötig.</div>`;
    const sel=data.players.filter(p=>_rkChartPlayers.has(p));
    if(!sel.length)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Wähle unten Spieler aus.</div>`;
    const series=sel.map((name,i)=>({name,color:COLORS[i%COLORS.length],pts:chronoDates.map(d=>{const rec=(data.byDate[d]||[]).find(r=>r.player_name===name);return rec?rec[tab.k]:null;})}));
    const allV=series.flatMap(s=>s.pts.filter(v=>v!=null));
    if(!allV.length)return`<div style="padding:14px;text-align:center;font-size:12px;color:var(--tx3)">Keine Daten für Auswahl.</div>`;
    const maxV=Math.max(...allV),minV=Math.min(...allV),range=maxV-minV||1;
    const W=360,H=140,PAD=8,BOTT=22,LEFT=10;
    const xS=(W-PAD-LEFT)/(chronoDates.length-1||1),yS=(H-PAD-BOTT)/range;
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
    for(let i=0;i<=4;i++){
      const y=PAD+(H-PAD-BOTT)*(1-i/4),val=minV+range*i/4;
      const lbl=tab.k==='kampfkraft'?(val/1e6).toFixed(1)+'M':Math.round(val).toLocaleString('de');
      svg+=`<line x1="${LEFT}" y1="${y}" x2="${W-PAD}" y2="${y}" stroke="#e2e6f0" stroke-width="1"/>`;
      svg+=`<text x="${LEFT}" y="${y-2}" font-size="7" fill="#8892a4">${lbl}</text>`;
    }
    series.forEach(s=>{
      const vpts=[];
      s.pts.forEach((v,i)=>{
        if(v==null)return;
        const x=LEFT+i*xS,y=H-BOTT-(v-minV)*yS;
        vpts.push(`${x},${y}`);
        svg+=`<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"><title>${s.name}: ${tab.fmt(v)} · ${chronoDates[i]}</title></circle>`;
      });
      if(vpts.length>1)svg+=`<polyline points="${vpts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    });
    const step=Math.max(1,Math.floor(chronoDates.length/4));
    chronoDates.forEach((d,i)=>{if(i%step!==0&&i!==chronoDates.length-1)return;svg+=`<text x="${LEFT+i*xS}" y="${H-5}" font-size="7" fill="#8892a4" text-anchor="middle">${d.slice(5)}</text>`;});
    svg+=`</svg>`;
    const legend=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;cursor:pointer" onclick="rkTogglePlayer('${s.name.replace(/'/g,"\\'")}')"><span style="width:14px;height:3px;background:${s.color};display:inline-block;border-radius:2px"></span>${s.name}</span>`).join('');
    return`<div style="padding:10px">${svg}<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${legend}</div></div>`;
  }

  function rkRoleBadge(r){
    if(!r)return'';
    const c={R5:'#e74c3c',R4:'#e8a020',R3:'#2980b9',R2:'#27ae60',R1:'#95a5a6'}[r]||'#bbb';
    return`<span style="font-size:10px;font-weight:800;color:#fff;background:${c};padding:2px 5px;border-radius:4px;margin-right:5px">${r}</span>`;
  }

  const listRows=sorted.slice(0,30).map(r=>{
    const rank=r[tab.rk],val=r[tab.k];
    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    return`<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd)">
      <div style="width:28px;text-align:center;font-size:13px;font-weight:800;color:${rank<=3?'var(--primary)':'var(--tx3)'};flex-shrink:0">${medal||rank}</div>
      <div style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rkRoleBadge(r.alliance_rank)}${r.player_name}</div>
      <div style="font-size:13px;font-weight:700;color:var(--primary);flex-shrink:0">${tab.fmt(val)}</div>
    </div>`;
  }).join('');

  const playerBtns=data.players.map(name=>{
    const on=_rkChartPlayers.has(name);
    return`<button onclick="rkTogglePlayer('${name.replace(/'/g,"\\'")}'" style="font-size:11px;padding:4px 9px;border-radius:6px;border:1.5px solid ${on?'var(--primary)':'var(--bd)'};background:${on?'var(--primary)':'var(--card)'};color:${on?'#fff':'var(--tx2)'};cursor:pointer;font-family:inherit;font-weight:600">${name}</button>`;
  }).join('');

  el.innerHTML=`
  <div class="card" style="margin-bottom:10px">
    <div class="stabs" style="margin-bottom:8px">${TABS.map(t=>`<button class="stab${_rkTab===t.k?' on':''}" onclick="rkSetTab('${t.k}')">${t.label}</button>`).join('')}</div>
    <div style="font-size:11px;color:var(--tx3);padding:0 12px 8px">Stand: ${latestDate} · ${sorted.length} Spieler</div>
    <div>${listRows||'<div style="padding:20px;text-align:center;color:var(--tx3)">Keine Daten für diesen Tab.</div>'}</div>
  </div>

  <div class="card" style="margin-bottom:10px">
    <div class="ch">Verlauf <span class="ch-sub">${chronoDates.length} Tage · ${tab.label}</span></div>
    ${renderTrend()}
  </div>

  <div class="card">
    <div class="ch">Spieler im Diagramm</div>
    <div style="padding:10px;display:flex;flex-wrap:wrap;gap:6px">${playerBtns}</div>
  </div>`;
}

function rkSetTab(t){_rkTab=t;_rkData=null;const el=document.getElementById('pc');if(el)pageRankings(el);}
function rkTogglePlayer(name){
  if(_rkChartPlayers.has(name))_rkChartPlayers.delete(name);else _rkChartPlayers.add(name);
  const el=document.getElementById('pc');if(el)pageRankings(el);
}

// ====== INIT ======
render();
</script>
